<script>
/* ============================================================
   資料區（DATA）
   要換成你自己的角色：
   - avatarImg / fullbodyImg 留空字串 "" 會顯示佔位色塊；
     填入圖片路徑（例如 "images/角色/avatar.jpg"）就會改成顯示真實圖片。
   - gallery 陣列每一項為 { thumb, full, caption }，同樣可留空顯示佔位。
   - articles 陣列每一項為 { title, src, url }，url 可為外部連結（同人誌網站、社群貼文等）。
============================================================ */
/* 世界觀介紹文字（名稱／代號／簡述／介紹卡片）現在從 worlds.json 讀取，
   在後台的「世界觀 Worlds」分類裡就能直接編輯，不用改這支 index.html。
   這裡只放名稱跟代號當備援，避免 worlds.json 讀取失敗時整頁掛掉（介紹文字以 worlds.json 為準）。
   注意：這裡只是「介紹文字」的資料，真正的角色列表還是各自存在
   characters-<slug>.json 這些檔案裡，兩邊的 slug（例如 "mafia"）要一致，
   角色才會被歸到對的世界觀底下。 */
let WORLD_META = {
  mafia:    { name:'MAFIA',     code:'W-01' },
  ancient:  { name:'ANCIENT',   code:'W-02' },
  hero:     { name:'HERO',      code:'W-03' },
  fantasy:  { name:'FANTASY',   code:'W-04' },
  football: { name:'FOOTBALL',  code:'W-05' },
  victorian:{ name:'VICTORIAN', code:'W-06' },
  other:    { name:'OTHER',     code:'W-07' },
};

async function loadWorldMeta(){
  try{
    const res = await fetch('./worlds.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.worlds || []);
    if(list.length){
      const merged = {};
      list.forEach(w=>{
        if(!w.slug) return;
        const color = COLOR_RE.test(w.color||'') ? w.color : '';
        merged[w.slug] = { name:w.name, code:w.code, desc:w.desc, brief:w.brief, timeline:w.timeline||[], color };
        if(color) WORLD_COLORS[w.slug] = color;
      });
      WORLD_META = merged;
    }
  }catch(err){
    console.warn('無法讀取 worlds.json，改用內建備援世界觀資料。', err);
  }
}

/* 角色資料拆成好幾個外部檔案讀取（每個世界觀一個，見下方 CHARACTER_SOURCES），
   之後要新增/修改角色，直接在後台（/admin/）編輯即可，完全不用碰這支 index.html。 */
let CHARACTERS = [];

/* 讀不到角色資料檔案時（例如用 file:// 直接打開）顯示的內建備用資料，避免整頁空白 */
const FALLBACK_CHARACTERS = [
  {
    id:'sample-01', category:'original',
    codename:'Sample Character', realname:'—', role:'Placeholder',
    affiliation:'—', skill:'—', status:'active',
    bio:'This is placeholder data. See the on-screen notice for how to load your real character data files.',
    avatarImg:'', fullbodyImg:'', articles:[], gallery:[],
  },
];

const STATUS_LABEL = { alive:'Alive', dead:'Dead' };
const STATUS_COLOR = { alive:'#3fa66a', dead:'#5a5a5e' };

/* ---------------- 壓縮版圖片（縮圖／大圖） ----------------
   Netlify 部署時，scripts/build-images.mjs 會幫 images/、gate-art/ 底下每張圖
   自動產生兩個壓縮版本，並把成功產生的清單寫進 _img/manifest.json：
     thumb：短邊 600px，給 Gallery 縮圖、頭像、角色卡片用
     large：長邊最多 2400px，給燈箱、全身立繪、首頁大圖用
   後台上傳圖片、填路徑的方式完全不變，這裡會自動把原圖路徑換成壓縮版。
   清單裡沒有的圖（例如本機直接打開、還沒重新部署、外部網址）就照舊顯示原圖；
   壓縮版萬一讀取失敗，也會自動退回原圖（見下方 revealImg）。 */
let IMG_MANIFEST = null;
let IMG_HERO = new Set(); /* 有另外做高畫質版的首頁大圖 */
async function loadImageManifest(){
  try{
    const res = await fetch('/_img/manifest.json', {cache:'no-cache'});
    if(!res.ok) return;
    const data = await res.json();
    IMG_MANIFEST = new Set(data.images || []);
    IMG_HERO = new Set(data.hero || []);
  }catch(err){ /* 沒有清單就全部用原圖，不影響網站運作 */ }
}
function imgVariant(src, size){
  if(!src || !IMG_MANIFEST) return src;
  let rel = String(src).replace(/^\.?\//, '');
  try{ rel = decodeURI(rel); }catch(e){}
  if(!IMG_MANIFEST.has(rel)) return src;
  return '/_img/' + size + '/' + rel.split('/').map(encodeURIComponent).join('/') + '.webp';
}
const thumbSrc = src => imgVariant(src, 'thumb');
const largeSrc = src => imgVariant(src, 'large');
/* 首頁滿版大圖：有高畫質版就用高畫質版，沒有就用一般大圖 */
const heroSrc = src => {
  let rel = String(src||'').replace(/^\.?\//, '');
  try{ rel = decodeURI(rel); }catch(e){}
  return IMG_HERO.has(rel) ? imgVariant(src, 'hero') : largeSrc(src);
};
/* 產生 <img> 的 src 屬性；用的是壓縮版時，順便用 data-orig 記住原圖，讀取失敗時拿來退回 */
function imgSrcAttr(src, size){
  const v = imgVariant(src, size);
  return v === src ? `src="${src}"` : `src="${v}" data-orig="${src}"`;
}

/* 佔位色塊統一使用單一藍色（品牌色），不做漸層深淺，所有沒放圖的角色看起來色調一致 */
function placeholderStyle(seed, sat, light1, light2){
  return `background:var(--brand);`;
}
function avatarBlock(ch, size){
  if(ch.avatarImg){ return `<img ${imgSrcAttr(ch.avatarImg,'thumb')} alt="${ch.codename}" decoding="async">`; }
  return `<div class="avatar-fill" style="${placeholderStyle(ch.id)}">${ch.codename.slice(0,1)}</div>`;
}
function fullbodyBlock(ch){
  if(ch.fullbodyImg){ return `<img ${imgSrcAttr(ch.fullbodyImg,'large')} alt="${ch.codename} full body art">`; }
  return `<div class="avatar-fill" style="${placeholderStyle(ch.id+'fb')}; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.85); font-family:var(--font-mono); font-size:12px;">Full body art not uploaded</div>`;
}
function galleryThumb(item, ch, idx){
  /* 新的 CMS 欄位只要傳一張「圖片 image」；舊角色資料如果還是用以前的
     「縮圖 thumb／原圖 full」分開兩張，也繼續相容、不會壞掉 */
  const src = item.thumb || item.image;
  if(src){ return `<img ${imgSrcAttr(src,'thumb')} alt="" loading="lazy" decoding="async">`; }
  return `<div class="avatar-fill">IMG_${String(idx+1).padStart(2,'0')}</div>`;
}

/* Gallery 縮圖視差：滑鼠在縮圖裡的位置決定圖片往哪個方向輕輕位移
   （滑鼠在右上，圖片就往右上偏移一點），疊加在原本 hover 放大上面，
   讓縮圖有一點點「立體」的手感，不只是單純整張放大。離開縮圖時
   position 歸零，CSS 的 transition 會負責自然地滑回正中央。 */
const GALLERY_PARALLAX_RANGE = 12; /* px，位移幅度上限 */
function initGalleryParallax(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.gallery-thumb').forEach(thumb=>{
    if(thumb.dataset.parallaxInit) return;
    thumb.dataset.parallaxInit = '1';
    const media = thumb.querySelector('img, .avatar-fill');
    if(!media) return;
    thumb.addEventListener('mousemove', (e)=>{
      const r = thumb.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      const mx = (px * GALLERY_PARALLAX_RANGE).toFixed(1);
      const my = (py * GALLERY_PARALLAX_RANGE).toFixed(1);
      media.style.transform = `scale(1.08) translate(${mx}px, ${my}px)`;
    });
    thumb.addEventListener('mouseleave', ()=>{ media.style.transform = ''; });
  });
}

/* ============================================================
   路由與換頁動畫
============================================================ */
const app = document.getElementById('app');
const wipe = document.getElementById('wipe');
const wipeLabelEl = document.getElementById('wipe-label');
let wiping = false;

/* 根據「要去的頁面」決定這次轉場要掃出哪個顏色、中間字要顯示什麼，
   跟首頁/Index這些中性頁面不同，進某個世界觀的頁面時色塊就用那個
   世界觀的代表色（跟 Co-creation 選單、body.theme-* 同一份顏色），
   讓轉場本身就先「預告」你要去哪裡。 */
function getRouteAccent(hash){
  const parts = (hash||'').replace(/^#\//,'').split('/').filter(Boolean);
  if(parts[0]==='grid' && parts[1]==='coop' && parts[2]) return WORLD_COLORS[parts[2]] || null;
  if(parts[0]==='random' && parts[1]==='coop' && parts[2]) return WORLD_COLORS[parts[2]] || null;
  if(parts[0]==='timeline' && parts[1]==='coop' && parts[2]) return WORLD_COLORS[parts[2]] || null;
  if(parts[0]==='relations' && parts[1]==='coop' && parts[2]) return WORLD_COLORS[parts[2]] || null;
  if(parts[0]==='char' && parts[1]){
    const id = parts[1];
    if(/^coop-/i.test(id)){
      const w = id.split('-')[1];
      if(WORLD_COLORS[w]) return WORLD_COLORS[w];
    }
  }
  return null;
}
function getRouteLabel(hash){
  const parts = (hash||'').replace(/^#\//,'').split('/').filter(Boolean);
  if(parts.length===0) return 'MONDAY’S MOOD';
  if(parts[0]==='index') return 'INDEX';
  if(parts[0]==='coop' && parts.length===1) return 'CO-CREATION';
  if(parts[0]==='grid' && parts[1]==='original') return 'PLURK PROJECT';
  if(parts[0]==='grid' && parts[1]==='coop' && parts[2]) return (WORLD_META[parts[2]] && WORLD_META[parts[2]].name) || parts[2].toUpperCase();
  if(parts[0]==='random') return 'RANDOM';
  if(parts[0]==='timeline' && parts[2]) return ((WORLD_META[parts[2]] && WORLD_META[parts[2]].name) || parts[2].toUpperCase()) + ' TIMELINE';
  if(parts[0]==='relations' && parts[2]) return ((WORLD_META[parts[2]] && WORLD_META[parts[2]].name) || parts[2].toUpperCase()) + ' RELATIONS';
  if(parts[0]==='about') return 'ABOUT';
  if(parts[0]==='char' && parts[1]){
    const ch = (typeof CHARACTERS!=='undefined' ? CHARACTERS.find(c=>c.id===parts[1]) : null);
    return (ch && (ch.codename || ch.realname)) || 'RECORD';
  }
  return 'MONDAY’S MOOD';
}

function runWipe(renderFn){
  if(wiping) return;
  wiping = true;

  const nextHash = location.hash;
  const accent = getRouteAccent(nextHash);
  if(accent) wipe.style.setProperty('--wipe-color', accent);
  else wipe.style.removeProperty('--wipe-color');

  const label = getRouteLabel(nextHash) || 'MONDAY’S MOOD';
  wipeLabelEl.innerHTML = label.split('').map(ch=>`<span class="wl-ch">${ch===' '?'&nbsp;':ch}</span>`).join('');
  const chars = wipeLabelEl.querySelectorAll('.wl-ch');
  chars.forEach((c,i)=>{ c.style.transitionDelay = Math.min(i,20)*16+'ms'; });

  wipe.classList.remove('run','label-in','label-out'); void wipe.offsetWidth;
  wipe.classList.add('run');
  setTimeout(()=>{ wipe.classList.add('label-in'); }, 90);
  setTimeout(()=>{ wipe.classList.remove('label-in'); wipe.classList.add('label-out'); }, 300);
  setTimeout(()=>{
    renderFn();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
    initPageEnterStagger();
  }, wipe.getAnimationDuration ? 0 : 300); /* mid-wipe swap */
  setTimeout(()=>{ wiping=false; wipe.classList.remove('run','label-in','label-out'); }, 640);
}

/* 換頁之後讓新內容依序浮現，而不是一次整頁彈出來：抓新頁面 .view
   底下的區塊（卡片、清單列...），每一個標上第幾個（--enter-i），
   CSS 再依這個數字給不同的延遲時間。角色頁自己已經有捲動淡入，
   這裡就跳過不重複處理。 */
function initPageEnterStagger(){
  const view = app.querySelector('.view');
  if(!view || view.classList.contains('profile-view')) return;
  /* 角色列表頁（.arc-stage 那種橫向疊卡）本身已經有一套持續用行內樣式
     即時計算透明度的「置中淡出」效果（捲動時哪張卡在正中間最清楚），
     這裡再疊一層用 class 控制的進場動畫，兩邊都在搶同一個 opacity，
     會互相蓋掉、卡片變成卡在奇怪的透明度，所以這種頁面跳過不處理。 */
  if(view.querySelector('.arc-stage')) return;
  let kids = Array.from(view.children);
  if(kids.length<=1 && kids[0] && kids[0].children && kids[0].children.length>1){
    kids = Array.from(kids[0].children);
  }
  if(kids.length===0) return;
  kids.forEach((el,i)=>{
    el.classList.add('enter-stagger-item');
    el.style.setProperty('--enter-i', Math.min(i,14));
  });
  view.classList.add('enter-stagger');
  void view.offsetWidth;
  /* 用兩層 rAF 而不是一層：只排一次 rAF 的話，瀏覽器常常會把「設成透明」
     跟「變回不透明」這兩個狀態合併成同一張畫面一次畫完，等於沒有真的播放
     到淡入動畫，必須等瀏覽器先畫出一次「透明」的畫面，下一輪再切回來，
     動畫才會確實播出來。 */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ view.classList.add('enter-run'); });
  });
}

window.addEventListener('hashchange', ()=> runWipe(route));
/* 視窗太窄、導覽列收進漢堡選單時：只要真的換頁（hash 改變），不管是點了
   選單裡哪個連結、或是上一頁按鈕，選單跟 Index 子選單都要一起收起來，
   不用去分辨是哪個元素觸發的，比較不會漏掉某種點法忘記收合 */
window.addEventListener('hashchange', ()=>{
  const panel = document.getElementById('nav-links');
  const burger = document.getElementById('nav-burger');
  const navIndex = document.getElementById('nav-index');
  if(panel) panel.classList.remove('open');
  if(burger){ burger.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }
  if(navIndex) navIndex.classList.remove('open');
});
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('foot-time').textContent = 'REV. ' + new Date().toISOString().slice(0,10);
  window.__dataReady = Promise.all([loadWorldMeta(), loadImageManifest(), loadGateSlides()]).then(()=>loadCharacters()).then(populateIndexDropdown);
  runIntroSplash();
  initIndexNav();
  initNavBurger();
});

/* Index 下拉選單：把「共構」底下每個世界觀都列出來，滑鼠移到 Index 就能直接跳過去，
   不用先進 Collab 選單頁再點一次 */
function populateIndexDropdown(){
  const col = document.getElementById('index-dd-coop');
  if(!col) return;
  /* 還沒有角色的世界觀一樣列出來，但變淡、標 SOON、不能點 */
  const links = Object.entries(WORLD_META).map(([key,w])=>{
    const name = w.name || key.toUpperCase();
    const count = CHARACTERS.filter(c=>c.category==='coop' && c.world===key).length;
    return count
      ? `<a href="#/grid/coop/${key}">${name}</a>`
      : `<span class="index-dd-soon" aria-disabled="true">${name}<small>SOON</small></span>`;
  }).join('');
  col.innerHTML = `<div class="index-dd-label">共構</div>${links}`;
}

/* 觸控裝置沒有滑鼠移過去（hover）這件事，所以點第一下先展開選單，
   點選單以外的地方或選了項目之後再收起來。導覽列收進漢堡選單的寬度
   （<=860px）也要用同一套點擊展開的邏輯——這個寬度下 Index 子選單
   是靠 .open 這個 class 顯示／隱藏，不是用 :hover，用滑鼠的桌機使用者
   只要把視窗縮窄到這個寬度，一樣要能點開，所以每次點擊都即時檢查目前
   是不是在這個寬度，而不是只在網頁載入的當下判斷一次 */
function initIndexNav(){
  const nav = document.getElementById('nav-index');
  if(!nav) return;
  const link = nav.querySelector('.index-link');
  link.addEventListener('click', (e)=>{
    const isTouch = window.matchMedia('(hover:none)').matches;
    const isCollapsed = window.matchMedia('(max-width:860px)').matches;
    if(!isTouch && !isCollapsed) return; /* 桌機寬螢幕：維持原本 hover 展開、點擊直接前往 Index 頁 */
    if(!nav.classList.contains('open')){
      e.preventDefault();
      nav.classList.add('open');
      const closeOnce = (ev)=>{
        if(!nav.contains(ev.target)){ nav.classList.remove('open'); document.removeEventListener('click', closeOnce); }
      };
      setTimeout(()=> document.addEventListener('click', closeOnce), 0);
    }
  });
}

/* 漢堡選單：點了展開／收起「← Back / Index / Random / About」這個下拉卡片，
   點選單以外的地方也會自動收起來 */
function initNavBurger(){
  const burger = document.getElementById('nav-burger');
  const panel = document.getElementById('nav-links');
  if(!burger || !panel) return;
  const closePanel = ()=>{
    panel.classList.remove('open');
    burger.classList.remove('open');
    burger.setAttribute('aria-expanded','false');
  };
  /* 點到目前就在的那一頁的連結時網址不會變、hashchange 不會觸發，
     所以選單裡除了 Index 本身（它是用來展開子選單的）以外，點任何連結都直接收起來 */
  panel.addEventListener('click', (ev)=>{
    const t = ev.target.closest('a, .back-btn');
    if(t && !t.classList.contains('index-link')) closePanel();
  });
  burger.addEventListener('click', (e)=>{
    e.stopPropagation();
    const willOpen = !panel.classList.contains('open');
    panel.classList.toggle('open', willOpen);
    burger.classList.toggle('open', willOpen);
    burger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    if(willOpen){
      const closeOnce = (ev)=>{
        if(!panel.contains(ev.target) && ev.target!==burger){
          panel.classList.remove('open');
          burger.classList.remove('open');
          burger.setAttribute('aria-expanded','false');
          document.removeEventListener('click', closeOnce);
        }
      };
      setTimeout(()=> document.addEventListener('click', closeOnce), 0);
    }
  });
}

/* 開場動畫（說明見 CSS 的 #intro-splash 那段） */
function runIntroSplash(){
  const el = document.getElementById('intro-splash');
  if(!el) return;
  const skip = document.documentElement.classList.contains('no-intro');
  if(skip){ el.remove(); return; }
  try{ sessionStorage.setItem('mm-intro-seen', '1'); }catch(e){}

  /* LOGO 直接沿用導覽列那顆的圖形，每一筆依序描線 */
  const svg = el.querySelector('.intro-logo');
  const src = document.querySelector('.topbar .brand-logo');
  if(src){ svg.setAttribute('viewBox', src.getAttribute('viewBox')); svg.innerHTML = src.innerHTML; }
  /* 每一筆的描線時間依實際長度決定：長的筆畫（MON、MOOD）慢一點，短的（S 跟上面那一小條）快一點，
     看起來每一筆的筆速差不多，不會有哪一筆特別拖 */
  const strokes = [...svg.querySelectorAll('path, rect')];
  const lens = strokes.map(p=>{ try{ return p.getTotalLength(); }catch(e){ return 0; } });
  const maxLen = Math.max(1, ...lens);
  const durs = lens.map(l=>0.35 + 0.5 * l / maxLen);
  /* 填色：MON、MOOD 這兩筆長的各自畫完就填；短的 S（和上面的小直條）畫得快，
     但填色排在 MON 跟 MOOD 中間，才不會比旁邊的字先亮起來 */
  const ends = durs.map((d,k)=>k * 0.06 + d - 0.1);
  const longest = [...ends.keys()].sort((a,b)=>lens[b] - lens[a]).slice(0, 2);
  const mid = (ends[longest[0]] + ends[longest[1]]) / 2;
  strokes.forEach((p,k)=>{
    p.setAttribute('pathLength', '1');
    p.style.setProperty('--k', k);
    p.style.setProperty('--dur', durs[k].toFixed(2) + 's');
    p.style.setProperty('--fill', (longest.includes(k) ? ends[k] : mid).toFixed(2) + 's');
  });

  const topbar = document.querySelector('.topbar');
  const appEl = document.getElementById('app');
  if(topbar) topbar.style.opacity = '0';

  /* 進度：時間（LOGO 畫完至少 1.3 秒）跟資料讀取兩者取比較慢的那個，
     資料讀完前最多停在 90；最長 6 秒一定結束，避免網路有問題時卡住 */
  const MIN = 1300, MAX = 6000, t0 = performance.now();
  let ready = false, shown = 0, done = false, skipWait = false;
  (window.__dataReady || Promise.resolve()).then(()=>{ ready = true; }, ()=>{ ready = true; });
  const countEl = el.querySelector('.intro-count');
  const tick = (now)=>{
    if(done) return;
    const t = now - t0;
    const timeP = skipWait ? 1 : Math.min(1, t / MIN);
    const target = (ready ? 1 : Math.min(.9, timeP)) * Math.min(1, timeP / .98) * 100;
    shown += (Math.max(shown, target) - shown) * .18;
    if(target >= 100 && shown > 99.4) shown = 100;
    countEl.textContent = String(Math.floor(shown)).padStart(3, '0');
    if((shown >= 100 && ready) || t > MAX){ done = true; setTimeout(leave, 160); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  el.addEventListener('click', ()=>{ skipWait = true; });

  function leave(){
    if(appEl){ appEl.style.removeProperty('transition'); appEl.style.opacity = '1'; }
    const gateLogo = document.querySelector('.gate-bottom-logo svg');
    const from = svg.getBoundingClientRect();
    if(gateLogo){
      /* 首頁：LOGO 移到底部大 LOGO 的位置、顏色換成它的顏色，落地的瞬間換成真的那顆 */
      const holder = gateLogo.parentElement;
      holder.style.animation = 'none';
      holder.style.visibility = 'hidden';
      const to = gateLogo.getBoundingClientRect();
      const color = getComputedStyle(gateLogo.querySelector('path')).fill;
      svg.style.transform = `translate(${from.left}px, ${from.top}px)`;
      svg.style.left = svg.style.top = '0';
      svg.getBoundingClientRect();
      svg.style.transition = 'transform .75s cubic-bezier(.76,0,.24,1)';
      svg.style.transform = `translate(${to.left}px, ${to.top}px) scale(${to.width / from.width})`;
      svg.querySelectorAll('path, rect').forEach(p=>{ p.style.animation = 'none'; p.style.fillOpacity = '1'; p.style.strokeOpacity = '0'; p.style.transition = 'fill .4s ease .3s'; p.style.fill = color; }); /* 先維持白色，等藍色收到一半、底下露出白底了才換顏色，不然會跟藍底融在一起看不見 */
      setTimeout(()=>{ holder.style.visibility = ''; }, 790);
    } else {
      /* 其他頁面（例如直接打開某個角色的分享網址）：LOGO 往上淡出 */
      svg.style.transition = 'opacity .5s ease, transform .8s cubic-bezier(.76,0,.24,1)';
      svg.style.opacity = '0'; svg.style.transform = 'translate(-50%, -70%)';
    }
    el.classList.add('is-out');
    setTimeout(()=>{
      el.remove();
      /* 導覽列的 inline opacity 拿掉，交回 CSS 判斷（入口頁本來就要藏起導覽列） */
      if(topbar){ topbar.style.transition = 'opacity .8s ease'; topbar.style.removeProperty('opacity'); }
    }, 850);
  }
}

/* 角色資料現在拆成 4 個檔案，對應後台的分類/世界觀資料夾，
   category 跟 world 不再存在 JSON 裡面，而是依照「這筆角色放在哪個檔案」自動決定——
   這樣在後台把角色移到不同的資料夾，分類就會自動改變，不用另外選欄位。
     characters-original.json → category: original
     characters-mafia.json    → category: coop, world: mafia
     characters-ancient.json  → category: coop, world: ancient
     characters-hero.json     → category: coop, world: hero
   注意：如果你是直接雙擊 index.html 打開（file:// 開頭的網址），瀏覽器基於安全性考量
   通常會擋掉這個讀取動作。這種情況下請改用下面兩種方式測試：
   1. 把整包檔案上傳到任何免費靜態網站空間（例如 GitHub Pages、Netlify、Vercel 都是免費的），
      用網址打開就不會有這個問題。
   2. 或在這個資料夾裡開終端機執行 `python3 -m http.server`，然後瀏覽器打開
      http://localhost:8000 來本機測試。
   讀取失敗時，畫面會顯示提示，並先用少量內建範例資料頂著，不會整頁空白。 */
const CHARACTER_SOURCES = [
  { file: './characters-original.json',  category: 'original', world: null },
  { file: './characters-mafia.json',     category: 'coop', world: 'mafia' },
  { file: './characters-ancient.json',   category: 'coop', world: 'ancient' },
  { file: './characters-hero.json',      category: 'coop', world: 'hero' },
  { file: './characters-fantasy.json',   category: 'coop', world: 'fantasy' },
  { file: './characters-football.json',  category: 'coop', world: 'football' },
  { file: './characters-victorian.json', category: 'coop', world: 'victorian' },
  { file: './characters-other.json',     category: 'coop', world: 'other' },
];

async function loadCharacters(){
  try{
    const results = await Promise.all(CHARACTER_SOURCES.map(async src=>{
      const res = await fetch(src.file, {cache:'no-cache'});
      if(!res.ok) throw new Error('HTTP '+res.status+' — '+src.file);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.characters || []);
      return list.map(ch=>({ ...ch, category: src.category, ...(src.world?{world:src.world}:{}) }));
    }));
    const merged = results.flat();
    if(!merged.length) throw new Error('All character files loaded but were empty.');
    CHARACTERS = merged;
  }catch(err){
    console.warn('無法讀取角色資料檔案，改用內建範例資料。', err);
    CHARACTERS = FALLBACK_CHARACTERS;
    showDataWarning();
  }
  route();
}

function showDataWarning(){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed; left:0; right:0; bottom:0; z-index:300; background:var(--ink); color:#fff; font-family:var(--font-mono); font-size:12px; padding:12px 20px; text-align:center;';
  bar.innerHTML = 'Could not load character data files — showing sample data instead. Host this site or run a local server to load your real data. <span style="text-decoration:underline; cursor:pointer; margin-left:8px;" onclick="this.parentElement.remove()">dismiss</span>';
  document.body.appendChild(bar);
}

function setCrumb(parts, opts){
  opts = opts || {};
  const el = document.getElementById('crumb');
  el.innerHTML = parts.map((p,i)=>{
    const isLast = i===parts.length-1;
    return `<span class="seg" ${p.hash?`onclick="location.hash='${p.hash}'"`:''} style="${isLast?'color:var(--ink)':''}">${p.label}</span>` + (isLast?'':'<span class="sep">/</span>');
  }).join('');
  el.scrollLeft = el.scrollWidth; /* 手機版麵包屑可以左右滑，預設停在最右邊顯示目前頁面 */
  el.classList.toggle('is-scrolled', el.scrollLeft > 0);
  if(!el.dataset.fadeBound){
    el.dataset.fadeBound = '1';
    el.addEventListener('scroll', ()=>el.classList.toggle('is-scrolled', el.scrollLeft > 0), {passive:true});
    /* 視窗縮放時麵包屑的寬度會變，重新捲到最右邊，讓「目前這一頁」一直看得到 */
    window.addEventListener('resize', ()=>{ el.scrollLeft = el.scrollWidth; el.classList.toggle('is-scrolled', el.scrollLeft > 0); }, {passive:true});
  }

  /* 上一頁按鈕：除了首頁，其他頁面都會顯示，回到麵包屑往前一個有連結的層級 */
  const backBtn = document.getElementById('back-btn');
  let backHash = null;
  if(opts.showBack !== false){
    for(let i=parts.length-2; i>=0; i--){
      if(parts[i].hash){ backHash = parts[i].hash; break; }
    }
  }
  if(backHash){
    backBtn.style.display = 'inline-flex';
    backBtn.onclick = ()=>{ location.hash = backHash; };
  } else {
    backBtn.style.display = 'none';
    backBtn.onclick = null;
  }
  updateToTopButton();
}

function setWorldTheme(world){
  document.body.classList.toggle('theme-mafia', world==='mafia');
  document.body.classList.toggle('theme-ancient', world==='ancient');
  document.body.classList.toggle('theme-fantasy', world==='fantasy');
  document.body.classList.toggle('theme-football', world==='football');
  document.body.classList.toggle('theme-victorian', world==='victorian');
  document.body.classList.toggle('theme-hero', world==='hero');
  document.body.classList.toggle('theme-other', world==='other');

  /* 後台改過代表色（跟內建預設色不一樣）時，用新的顏色蓋過這個世界觀的強調色；
     沒改過就完全沿用上面 body.theme-* 原本設計好的整套配色。
     沒有內建配色的新世界觀，只要在後台填了代表色，也會套用成強調色。 */
  const bodyStyle = document.body.style;
  const custom = world && WORLD_META[world] && WORLD_META[world].color;
  const isOverride = custom && custom.toLowerCase() !== (WORLD_COLORS_DEFAULT[world]||'').toLowerCase();
  if(isOverride){
    bodyStyle.setProperty('--accent', custom);
    bodyStyle.setProperty('--brand', custom);
    bodyStyle.setProperty('--logo-color', custom);
    bodyStyle.setProperty('--accent-soft', `color-mix(in srgb, ${custom} 22%, var(--bg))`);
  } else {
    ['--accent','--brand','--logo-color','--accent-soft'].forEach(v=>bodyStyle.removeProperty(v));
  }
}

/* Co-creation 選單卡片要在「還沒進入那個世界觀」的狀態下，就先用上它的代表色，
   跟 body.theme-* 是同一套顏色，這裡另外存一份給選單直接讀，不用為了讀顏色
   就先把整個頁面套上那個世界觀的主題 */
const WORLD_COLORS_DEFAULT = {
  mafia:'#e0293e', ancient:'#6b7a66', hero:'#c6811f', fantasy:'#72636e',
  football:'#619e69', victorian:'#60373e', other:'#5b6472',
};
/* 後台「世界觀 Worlds」裡每個世界觀可以填「代表色 Color」（見 loadWorldMeta），
   有填就蓋過上面的預設值；沒填就沿用預設 */
const WORLD_COLORS = { ...WORLD_COLORS_DEFAULT };
const COLOR_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;

function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);

  if(parts.length===0){ document.body.classList.add('is-gate'); document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderGate(); }
  document.body.classList.remove('is-gate');
  if(parts[0]==='index'){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderHome(); }
  if(parts[0]==='coop' && parts.length===1){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderCoopWorlds(); }
  if(parts[0]==='grid' && parts[1]==='original'){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderGrid('original'); }
  if(parts[0]==='grid' && parts[1]==='coop' && parts[2]){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(parts[2]); return renderGrid('coop', parts[2]); }
  if(parts[0]==='random' && parts.length===1){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderRandomPage('all'); }
  if(parts[0]==='random' && parts[1]==='original'){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderRandomPage('original'); }
  if(parts[0]==='random' && parts[1]==='coop' && parts[2]){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(parts[2]); return renderRandomPage('coop', parts[2]); }
  if(parts[0]==='timeline' && parts[1]==='coop' && parts[2]){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(parts[2]); return renderTimeline(parts[2]); }
  if(parts[0]==='relations' && parts[1]==='coop' && parts[2]){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(parts[2]); return renderWorldRelations(parts[2]); }
  if(parts[0]==='about'){ document.body.classList.remove('is-profile'); hideFullbodyBackground(); setWorldTheme(null); return renderAbout(); }
  if(parts[0]==='char' && parts[1]){ document.body.classList.add('is-profile'); return renderProfile(parts[1]); }
  document.body.classList.remove('is-profile');
  hideFullbodyBackground();
  setWorldTheme(null);
  return renderHome();
}

/* ---------------- GATE (首頁入口) ---------------- */
/* ============================================================
   首頁入口往下捲動後、滿版淡出淡入的完稿大圖。
   圖片清單放在 gate.json（後台「首頁 Gate」可以新增／換圖），每張可以另外
   上傳一張手機版的直圖，手機上就會用直圖，不會被裁掉一大半。
   下面這份只是 gate.json 讀取失敗時的備援。清單是空的話會先顯示彩色漸層的
   佔位畫面。每次重新整理頁面，圖片出現的順序都會重新隨機排列一次。 */
let GATE_SHOWCASE = [
  { image:'./gate-art/01.jpg' },
  { image:'./gate-art/02.jpg' },
  { image:'./gate-art/03.jpg' },
  { image:'./gate-art/04.jpg' },
  { image:'./gate-art/05.jpg' },
  { image:'./gate-art/06.jpg' },
];
async function loadGateSlides(){
  try{
    const res = await fetch('./gate.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    GATE_SHOWCASE = (data.slides || []).filter(s=>s && s.image);
  }catch(err){
    console.warn('無法讀取 gate.json，改用內建的首頁圖片。', err);
  }
}

function buildGatePhotos(){
  const useReal = GATE_SHOWCASE.length > 0;
  const n = useReal ? GATE_SHOWCASE.length : 6;
  const order = Array.from({length:n}, (_,i)=>i);
  for(let i=order.length-1;i>0;i--){ /* Fisher–Yates，隨機打亂出場順序 */
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  let html = '';
  order.forEach(srcIdx=>{
    if(useReal){
      const s = GATE_SHOWCASE[srcIdx];
      const mobile = s.mobileImage ? ` --img-m:url('${heroSrc(s.mobileImage)}');` : '';
      html += `<div class="gate-photo-layer" data-i="${srcIdx}" style="--img-d:url('${heroSrc(s.image)}');${mobile}"></div>`;
    } else {
      const hue = (srcIdx*63) % 360;
      html += `<div class="gate-photo-layer is-placeholder" style="--ph-a:hsl(${hue},70%,55%); --ph-b:hsl(${(hue+40)%360},70%,36%);">
        <span class="gate-photo-caption">作品預留位置 PLACEHOLDER ${srcIdx+1}</span>
      </div>`;
    }
  });
  return { html, count:n };
}

/* 第一屏小資訊：角色數、有角色的世界觀數（從資料自動算）、今天的日期 */
function gateStatsText(){
  const worlds = new Set(CHARACTERS.filter(c=>c.category==='coop' && c.world).map(c=>c.world)).size;
  return `<b>${CHARACTERS.length}</b> CHARACTERS · <b>${worlds}</b> WORLDS`;
}
function gateDateText(){
  const d = new Date();
  if(d.getDay() === 1) return `<b>IT'S MONDAY.</b>`; /* 呼應網站名字 */
  const day = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  const mon = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
  return `${day} <b>${String(d.getDate()).padStart(2,'0')}</b> ${mon}`;
}
/* 大圖說明的連結：填角色 ID 或角色名字會連到那個角色頁；填 # 或 http 開頭就照填的網址 */
function gateCapHref(link){
  const v = String(link||'').trim();
  if(!v) return '';
  if(/^(#|https?:)/.test(v)) return v;
  const ch = CHARACTERS.find(c=>c.id===v) || CHARACTERS.find(c=>normName(c.codename)===normName(v));
  return ch ? '#/char/' + ch.id : '';
}

/* 首頁入口捲動效果：往下捲會把 #gate-bg-fixed 的顏色從白色即時漸變成
   品牌藍，並讓右下角常駐的小 ENTER 按鈕淡入淡出。掛在全域的 scroll
   監聽上（跟 to-top 按鈕那組做法一樣），一離開首頁就直接跳出不做事。 */
function updateGateScroll(){
  if(!document.body.classList.contains('is-gate')) return;
  const bgFixed = document.getElementById('gate-bg-fixed');
  const heroScene = document.getElementById('gate-scene-hero');
  const fixedEnter = document.getElementById('gate-fixed-enter');
  const scrollHint = document.getElementById('gate-scroll-hint');
  if(!bgFixed || !heroScene) return;
  const heroH = heroScene.offsetHeight || window.innerHeight;
  const y = window.scrollY || 0;
  heroScene.style.setProperty('--p', Math.min(1, Math.max(0, y / heroH)).toFixed(3));
  heroScene.classList.toggle('is-scrolling', y > 4);
  if(fixedEnter) fixedEnter.classList.toggle('show', y > heroH*0.62); /* 等大圖淡入了才出現：它是白字玻璃按鈕，太早出現會在白底上變成看不到字的白色膠囊 */
  if(scrollHint) scrollHint.classList.toggle('hide', y > 40);

  /* 離開第一屏之後，每捲過一個畫面高度就淡出上一張、淡入下一張大圖；
     最後一張淡入之後就固定留在畫面上，不會再淡出變回空白 */
  const layers = bgFixed.querySelectorAll('.gate-photo-layer');
  const n = layers.length;
  if(n){
    const zoneH = window.innerHeight || 800;
    const raw = (y - heroH) / zoneH; /* 0 = 剛捲離第一屏，1 = 再捲過一個畫面高度…以此類推 */
    const FADE = 0.3; /* 淡入/淡出各佔一個畫面高度的 30% */
    /* 第一張大圖提早一點開始淡入，跟第一屏的淡出重疊，變成交叉淡化 */
    layers.forEach((layer,i)=>{
      const isLast = i === n-1;
      const inStart = i === 0 ? -0.55 : i - FADE, inEnd = i + FADE;
      let op;
      if(raw <= inStart) op = 0;
      else if(raw < inEnd) op = (raw - inStart) / (inEnd - inStart);
      else if(isLast) op = 1;
      else{
        const outStart = i+1-FADE, outEnd = i+1+FADE;
        if(raw > outEnd) op = 0;
        else if(raw > outStart) op = 1 - (raw-outStart)/(outEnd-outStart);
        else op = 1;
      }
      layer.style.opacity = op.toFixed(3);
      /* 淡入的過程中，圖從 106% 慢慢縮回 100%，像鏡頭緩慢推近 */
      const s = raw < inEnd ? 1 + 0.06 * (1 - op) : 1;
      layer.style.transform = s > 1.0005 ? `scale(${s.toFixed(4)})` : ''; /* 推近結束就拿掉 transform，讓瀏覽器用原解析度重新繪製 */
    });
    /* 說明＋頁碼：顯示目前最清楚的那一張 */
    const ui = document.getElementById('gate-photo-ui');
    if(ui){
      const cur = Math.max(0, Math.min(n - 1, Math.floor(raw))); /* 兩張交叉淡化到一半時切換 */
      ui.classList.toggle('show', raw > -0.35);
      document.getElementById('gate-count-cur').textContent = String(cur + 1).padStart(2, '0');
      document.getElementById('gate-count-bar').style.setProperty('--fill', ((cur + 1) / n * 100).toFixed(1) + '%');
      const cap = document.getElementById('gate-cap');
      if(cap.dataset.cur !== String(cur)){
        cap.dataset.cur = String(cur);
        const slide = GATE_SHOWCASE[+layers[cur].dataset.i] || {};
        cap.classList.add('swap');
        setTimeout(()=>{
          const href = gateCapHref(slide.link);
          cap.querySelector('.gate-cap-no').textContent = 'NO.' + String(cur + 1).padStart(2, '0');
          cap.querySelector('.gate-cap-text').textContent = slide.caption || '';
          cap.style.display = slide.caption ? '' : 'none';
          if(href) cap.setAttribute('href', href); else cap.removeAttribute('href');
          cap.classList.remove('swap');
        }, 180);
      }
    }
  }
}
let gateScrollTicking = false;
window.addEventListener('scroll', ()=>{
  if(gateScrollTicking) return;
  gateScrollTicking = true;
  requestAnimationFrame(()=>{ updateGateScroll(); gateScrollTicking = false; });
}, {passive:true});

/* ---------------- 生日提醒 ----------------
   讀角色的「生日 Birthday」欄位（6.6、6/6、6-6、6月6日 這些寫法都可以），
   在 Index 頁顯示：今天有人生日 → 「今天是 ○○ 的生日」；
   沒有 → 這個月的壽星；這個月也沒有 → 下一位壽星還有幾天。日期用看網頁的人自己的時區。 */
function parseBirthday(s){
  const m = String(s||'').match(/(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})/);
  if(!m) return null;
  const month = +m[1], day = +m[2];
  return (month >= 1 && month <= 12 && day >= 1 && day <= 31) ? { month, day } : null;
}
function isBirthdayToday(ch){
  const b = parseBirthday(ch.birthday); const t = new Date();
  return !!b && b.month === t.getMonth() + 1 && b.day === t.getDate();
}
function birthdayBanner(){
  const t = new Date(); t.setHours(0,0,0,0);
  const list = CHARACTERS.map(ch=>({ ch, b:parseBirthday(ch.birthday) })).filter(x=>x.b);
  if(!list.length) return '';
  const chip = (x, extra='') => `<a class="bday-chip${extra}" href="#/char/${x.ch.id}"><span class="bday-av">${avatarBlock(x.ch)}</span><span>${x.ch.codename}</span><em>${x.b.month}.${x.b.day}</em></a>`;
  const today = list.filter(x=>x.b.month === t.getMonth()+1 && x.b.day === t.getDate());
  if(today.length){
    return `<div class="bday is-today"><span class="bday-spark" aria-hidden="true">✦</span><div class="bday-title">🎂 HAPPY BIRTHDAY</div>
      <div class="bday-chips">${today.map(x=>chip(x)).join('')}</div><div class="bday-sub">今天是${today.map(x=>x.ch.codename).join('、')}的生日！</div></div>`;
  }
  const month = list.filter(x=>x.b.month === t.getMonth()+1).sort((a,b)=>a.b.day-b.b.day);
  if(month.length){
    return `<div class="bday"><div class="bday-title">🎂 ${t.getMonth()+1} 月壽星</div>
      <div class="bday-chips">${month.map(x=>chip(x, x.b.day < t.getDate() ? ' is-past' : '')).join('')}</div></div>`;
  }
  const daysUntil = b => { let d = new Date(t.getFullYear(), b.month-1, b.day); if(d < t) d = new Date(t.getFullYear()+1, b.month-1, b.day); return Math.round((d - t) / 864e5); };
  const next = list.map(x=>({ ...x, n:daysUntil(x.b) })).sort((a,b)=>a.n-b.n);
  const first = next.filter(x=>x.n === next[0].n);
  return `<div class="bday"><div class="bday-title">🎂 下一位壽星 · 還有 ${first[0].n} 天</div>
    <div class="bday-chips">${first.map(x=>chip(x)).join('')}</div></div>`;
}

/* 兩個分類節點的漂浮動畫：位置用 sine 波動計算，line 座標每一影格重新畫，
   讓連接線始終準確跟著兩個圓圈移動。離開這頁時透過 field 是否還在畫面上自動停止。 */
function initNodeField(){
  const field = document.getElementById('node-field');
  const svg = document.getElementById('node-svg');
  const line = svg.querySelector('.line-base');
  const lineGlow = svg.querySelector('.line-glow');
  const nodes = [
    { el:document.getElementById('node-a'),
      baseXPct:32, baseYPct:40, ampX:26, ampY:18, speed:0.00033, phase:0,
      breathSpeed:0.0009, breathPhase:0, hoverT:0, hoverC:0,
      pullX:0, pullY:0 },
    { el:document.getElementById('node-b'),
      baseXPct:68, baseYPct:60, ampX:20, ampY:24, speed:0.00026, phase:2.4,
      breathSpeed:0.0007, breathPhase:1.8, hoverT:0, hoverC:0,
      pullX:0, pullY:0 },
  ];
  nodes.forEach(n=>{
    n.el.addEventListener('mouseenter', ()=>{ n.hoverT = 1; });
    n.el.addEventListener('mouseleave', ()=>{ n.hoverT = 0; });
  });
  /* 磁吸半徑：滑鼠進到這個範圍內，節點會被「輕輕吸過去」一點點，
     越靠近吸力越強，離開範圍就放掉、回到原本漂浮的軌跡上，
     滑鼠座標沿用全站共用的游標座標（mouseX/mouseY，定義在檔案別處）。 */
  const PULL_RADIUS = 170;
  const PULL_MAX = 22;
  function tick(t){
    if(!document.body.contains(field)) return; /* 已離開此頁，停止動畫 */
    const rect = field.getBoundingClientRect();
    const localMouseX = mouseX - rect.left;
    const localMouseY = mouseY - rect.top;
    nodes.forEach(n=>{
      const baseX = rect.width * n.baseXPct/100;
      const baseY = rect.height * n.baseYPct/100;
      const floatX = baseX + Math.sin(t*n.speed + n.phase) * n.ampX;
      const floatY = baseY + Math.cos(t*n.speed*1.35 + n.phase) * n.ampY;

      const dx = localMouseX - floatX, dy = localMouseY - floatY;
      const dist = Math.hypot(dx, dy);
      let targetPullX = 0, targetPullY = 0;
      if(dist < PULL_RADIUS && dist > 0.01){
        const strength = (1 - dist/PULL_RADIUS) * PULL_MAX;
        targetPullX = (dx/dist) * strength;
        targetPullY = (dy/dist) * strength;
      }
      n.pullX += (targetPullX - n.pullX) * 0.12;
      n.pullY += (targetPullY - n.pullY) * 0.12;

      const x = floatX + n.pullX, y = floatY + n.pullY;
      n.el.style.left = x+'px';
      n.el.style.top = y+'px';
      n._x = x; n._y = y;

      /* 呼吸感：緩慢的縮放 + 些微透明度變化，兩個節點頻率/相位不同，不會同步呼吸 */
      const breath = Math.sin(t*n.breathSpeed + n.breathPhase);
      n.hoverC += (n.hoverT - n.hoverC) * 0.15; /* 平滑地放大／縮回 */
      const scale = 1 + breath*0.05 + n.hoverC*0.30;
      const opacity = 0.9 + (breath+1)/2*0.1;
      n.el.style.transform = `translate(-50%,-50%) scale(${scale.toFixed(3)})`;
      n.el.style.opacity = opacity.toFixed(3);
    });
    line.setAttribute('x1', nodes[0]._x);
    line.setAttribute('y1', nodes[0]._y);
    line.setAttribute('x2', nodes[1]._x);
    line.setAttribute('y2', nodes[1]._y);
    /* 連接線也有自己的呼吸節奏，比節點慢一些、幅度更小 */
    line.style.opacity = (0.55 + (Math.sin(t*0.00045)+1)/2*0.25).toFixed(3);

    /* 流動的能量線：跟底線同座標疊在上面，用 stroke-dashoffset 持續推進，
       造出一段段光點沿線移動的感覺。hover 任一節點時，流動變快、變亮、
       線也變粗一點，像是被啟動了一樣；兩個節點共用這條線，用 max 取較大值。 */
    lineGlow.setAttribute('x1', nodes[0]._x);
    lineGlow.setAttribute('y1', nodes[0]._y);
    lineGlow.setAttribute('x2', nodes[1]._x);
    lineGlow.setAttribute('y2', nodes[1]._y);
    const glowT = Math.max(nodes[0].hoverC, nodes[1].hoverC);
    const flowSpeed = 0.012 + glowT*0.05;
    lineGlow.style.strokeDashoffset = (-(t*flowSpeed) % 28).toFixed(2);
    lineGlow.style.opacity = (0.4 + glowT*0.6).toFixed(3);
    lineGlow.setAttribute('stroke-width', (2.2 + glowT*1.1).toFixed(2));

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* 清單文字的磁吸效果：呼應首頁節點圖的磁吸手感。滑過每一列時，
   名字裡的每個字母會各自偵測跟游標的距離，距離夠近就被輕輕吸過去，
   游標離開那個字母的範圍又會鬆開彈回來，整排字像活的一樣跟著游標走，
   不是單純的顏色色塊而已。用 rAF 迴圈 + lerp 讓動作平滑，不用 CSS transition
   （避免跟每一幀都在變的 transform 互相打架）。 */
function initMagneticRowText(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const RADIUS = 60, MAX_PULL = 6, EASE = 0.22, Y_DAMP = 0.4;
  document.querySelectorAll('.world-row .wr-name').forEach(nameEl=>{
    if(nameEl.dataset.magInit) return;
    nameEl.dataset.magInit = '1';
    const text = nameEl.textContent;
    nameEl.innerHTML = text.split('').map(ch=>`<span class="wr-char">${ch===' '?'&nbsp;':ch}</span>`).join('');
    const row = nameEl.closest('.world-row');
    const chars = Array.from(nameEl.querySelectorAll('.wr-char'));
    const state = chars.map(()=>({x:0,y:0,tx:0,ty:0}));
    let raf = null, hovering = false;

    function onMove(e){
      chars.forEach((c,i)=>{
        const r = c.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const dist = Math.hypot(dx,dy);
        if(dist < RADIUS){
          const strength = (1 - dist/RADIUS) * MAX_PULL;
          state[i].tx = (dx/(dist||1)) * strength;
          state[i].ty = (dy/(dist||1)) * strength * Y_DAMP;
        } else {
          state[i].tx = 0; state[i].ty = 0;
        }
      });
    }
    function loop(){
      let moving = false;
      state.forEach((s,i)=>{
        s.x += (s.tx - s.x) * EASE;
        s.y += (s.ty - s.y) * EASE;
        if(Math.abs(s.x)>0.05 || Math.abs(s.y)>0.05 || Math.abs(s.tx)>0.05 || Math.abs(s.ty)>0.05) moving = true;
        chars[i].style.transform = `translate(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px)`;
      });
      if(hovering || moving) raf = requestAnimationFrame(loop);
      else raf = null;
    }
    row.addEventListener('mouseenter', ()=>{
      hovering = true;
      row.addEventListener('mousemove', onMove);
      if(!raf) raf = requestAnimationFrame(loop);
    });
    row.addEventListener('mouseleave', ()=>{
      hovering = false;
      row.removeEventListener('mousemove', onMove);
      state.forEach(s=>{ s.tx = 0; s.ty = 0; });
      if(!raf) raf = requestAnimationFrame(loop);
    });
  });
}

function initRandomPage(pool){
  const dice = document.getElementById('random-dice');
  const btn = document.getElementById('dice-roll-btn');
  const resultBox = document.getElementById('dice-result');
  if(!dice || !btn || !resultBox) return;
  let rotX = -20, rotY = 25;
  let rolling = false;
  let lastId = null;

  function showResult(ch){
    resultBox.innerHTML = `
      <div class="dice-result-avatar">${avatarBlock(ch)}</div>
      <div class="dice-result-name">${ch.codename}</div>
      <div class="dice-result-role">${ch.role||''}</div>
      <a class="dice-result-go" href="#/char/${ch.id}">前往角色頁面 →</a>
    `;
    requestAnimationFrame(()=> resultBox.classList.add('show'));
  }

  function roll(){
    if(rolling) return;
    rolling = true;
    btn.disabled = true;
    resultBox.classList.remove('show');
    /* 每次都多轉個幾整圈，再加一點隨機角度，看起來才會像真的骰子滾出去、慢慢停下來 */
    rotX += 360*(2+Math.floor(Math.random()*2)) + Math.floor(Math.random()*360);
    rotY += 360*(2+Math.floor(Math.random()*2)) + Math.floor(Math.random()*360);
    dice.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    const onEnd = (e)=>{
      if(e.propertyName !== 'transform') return;
      dice.removeEventListener('transitionend', onEnd);
      rolling = false;
      btn.disabled = false;
      let pick;
      if(pool.length===1){ pick = pool[0]; }
      else { do{ pick = pool[Math.floor(Math.random()*pool.length)]; } while(pick.id===lastId); }
      lastId = pick.id;
      showResult(pick);
    };
    dice.addEventListener('transitionend', onEnd);
  }

  btn.addEventListener('click', roll);
  /* 骰子是剛插進畫面的新元素，瀏覽器還沒真的畫出「轉動前」的樣子就馬上改
     transform 的話，等於起點跟終點在同一格畫面內發生，瀏覽器會直接跳過
     轉場動畫、也就不會觸發 transitionend，結果就是骰子沒有在轉、
     結果卡也不會跳出來。用兩次 requestAnimationFrame 確保瀏覽器至少畫過
     一次「轉動前」的樣子，再開始轉，動畫才會確實播出來。 */
  requestAnimationFrame(()=> requestAnimationFrame(roll));
}

/* 角色列表恢復成橫向重疊卡片牆，但取消弧線起伏：
   每張卡片統一寬度／高度排成一直線，中間淡出效果改成即時算「目前哪張在舞台正中間」 */
function buildArcStage(list){
  if(!list.length){ return `<div class="empty-note">No characters recorded yet.</div>`; }

  const isMobile = window.innerWidth <= 820;
  const n = list.length;
  const peakIdx = (n-1)/2;
  const OVERLAP = isMobile ? 0.22 : 0.46;
  const w = isMobile ? 26 : 12; // vw，統一寬度／高度，不再有弧線起伏

  let html = '';
  list.forEach((ch,i)=>{
    const dist = Math.abs(i - peakIdx);
    const z = Math.round(100 - dist*10);
    const fade = Math.max(0, 1 - dist*0.09);
    const sat = Math.max(35, 100 - dist*13);

    const cardStyle = [
      `width:${w}vw`, `z-index:${z}`, `opacity:${fade.toFixed(2)}`, `filter:saturate(${sat}%)`,
      `margin-left:${i===0 ? 0 : '-'+(w*OVERLAP).toFixed(2)+'vw'}`,
    ].join('; ');

    html += `
    <a class="arc-card" href="#/char/${ch.id}" style="${cardStyle}">
      <div class="arc-card-media">
        ${avatarBlock(ch)}
        <div class="name-bar">
          <div class="cn">${ch.codename}</div>
          <div class="role">${ch.role}</div>
        </div>
      </div>
      <div class="name-caption">
        <div class="cn">${ch.codename}</div>
      </div>
    </a>`;
  });

  const hintLabel = isMobile ? 'SWIPE TO BROWSE' : 'SCROLL OR DRAG TO BROWSE';
  return `
  <div class="arc-stage" id="arc-stage"><div class="arc-track" id="arc-track">${html}</div></div>
  <div class="arc-hint"><span class="dot"></span> ${hintLabel}</div>`;
}

/* 即時算「目前哪張在舞台正中間」，動態更新透明度/飽和度──
   z-index 也要跟著一起動態算，不然卡片是「建立當下」算好、固定不變的
   （只認初始的正中間那張），捲動之後畫面上看起來在最前面、最清楚的那張，
   實際疊層順序卻可能還是別張卡片比較高，滑鼠點下去點到的會是那張疊在
   上面、視覺上已經退到旁邊的舊卡片——點了卻沒反應（或跳去別的角色），
   就是這個原因。改成每次都重新按目前的置中距離算 z-index，畫面看起來
   最前面的，滑鼠/觸控實際點到的保證就是同一張。 */
function updateArcFocus(stage){
  const cards = stage.querySelectorAll('.arc-card');
  if(!cards.length) return;
  const stageRect = stage.getBoundingClientRect();
  const centerX = stageRect.left + stageRect.width/2;
  const half = stageRect.width/2 || 1;
  cards.forEach(card=>{
    const r = card.getBoundingClientRect();
    const cardCenter = r.left + r.width/2;
    const dist = Math.abs(cardCenter - centerX) / half;
    const fade = Math.max(0.32, 1 - dist*1.15);
    const sat = Math.max(35, 100 - dist*115);
    card.style.opacity = fade.toFixed(2);
    card.style.filter = `saturate(${sat.toFixed(0)}%)`;
    card.style.zIndex = Math.round(1000 - dist*100);
  });
}

function initArcStage(){
  const stage = document.getElementById('arc-stage');
  if(!stage) return;
  const track = document.getElementById('arc-track');
  /* 讓第一張／最後一張卡片也能被捲到正中間 */
  const sidePad = Math.max(24, stage.clientWidth/2);
  track.style.paddingLeft = sidePad + 'px';
  track.style.paddingRight = sidePad + 'px';
  /* 一般滑鼠滾輪只會送出一段一段的 deltaY，直接加到 scrollLeft 上會很卡、
     一格一格跳。改成「慣性」：滾輪只負責加一點速度，實際捲動靠 rAF
     每一格慢慢把速度用掉（乘上摩擦力），滑起來才會像觸控板/手機那樣
     滑順地衝出去再慢慢停下來。停下來之後改由我們自己算「最近的卡片」
     並用 rAF 慢慢動畫過去，取代 CSS scroll-snap——因為讓瀏覽器原生吸附
     跟我們自己的慣性動畫同時搶著改 scrollLeft，會讓畫面「看起來停了」
     但其實還在偷偷位移，點擊會因此踩不準卡片中間的頭像。自己算的話，
     動畫跑完那一刻的位置就是最終停下來的位置，點哪裡看到的就是哪裡。
     觸控板本身送出的 deltaX（左右滑）已經很滑順，直接放行給瀏覽器原生處理，
     結束後一樣交給我們的「捲動停止後自動吸附」邏輯去對齊置中。 */
  let momentum = 0;
  let momentumRAF = null;
  let snapRAF = null;
  let scrollEndTimer = null;

  function cancelSnap(){
    if(snapRAF){ cancelAnimationFrame(snapRAF); snapRAF = null; }
  }

  function getNearestCardTarget(){
    const cards = stage.querySelectorAll('.arc-card');
    if(!cards.length) return null;
    const stageRectC = stage.getBoundingClientRect();
    const centerX = stageRectC.left + stageRectC.width/2;
    let best = null, bestDist = Infinity;
    cards.forEach(card=>{
      const r = card.getBoundingClientRect();
      const cardCenter = r.left + r.width/2;
      const dist = Math.abs(cardCenter - centerX);
      if(dist < bestDist){ bestDist = dist; best = card; }
    });
    if(!best) return null;
    const cardRect = best.getBoundingClientRect();
    const cardCenter = (cardRect.left - stageRectC.left) + stage.scrollLeft + cardRect.width/2;
    return cardCenter - stage.clientWidth/2;
  }

  function snapToNearest(){
    cancelSnap();
    const target = getNearestCardTarget();
    if(target == null) return;
    const start = stage.scrollLeft;
    const dist = target - start;
    if(Math.abs(dist) < 0.5) return;
    const duration = 300;
    const startTime = performance.now();
    function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
    function tick(now){
      const t = Math.min(1, (now - startTime) / duration);
      stage.scrollLeft = start + dist * easeOutCubic(t);
      updateArcFocus(stage);
      if(t < 1){ snapRAF = requestAnimationFrame(tick); }
      else { snapRAF = null; }
    }
    snapRAF = requestAnimationFrame(tick);
  }

  function scheduleSnap(){
    if(scrollEndTimer) clearTimeout(scrollEndTimer);
    scrollEndTimer = setTimeout(()=>{
      if(!momentumRAF && !snapRAF){ snapToNearest(); }
    }, 130);
  }

  function stepMomentum(){
    stage.scrollLeft += momentum;
    momentum *= 0.9;
    if(Math.abs(momentum) < 0.5){
      momentum = 0; momentumRAF = null;
      snapToNearest();
      return;
    }
    momentumRAF = requestAnimationFrame(stepMomentum);
  }

  /* 某一張卡片置中時，stage 應該捲到的 scrollLeft */
  function cardTarget(card){
    const stageRectC = stage.getBoundingClientRect();
    const r = card.getBoundingClientRect();
    return (r.left - stageRectC.left) + stage.scrollLeft + r.width/2 - stage.clientWidth/2;
  }
  function nearestCardIndex(cards){
    const center = stage.getBoundingClientRect().left + stage.clientWidth/2;
    let best = 0, bestDist = Infinity;
    cards.forEach((card,i)=>{
      const r = card.getBoundingClientRect();
      const d = Math.abs(r.left + r.width/2 - center);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }
  /* 平滑捲到指定 scrollLeft（跟 snapToNearest 同一套緩動，共用 snapRAF，
     新的捲動一開始就會接手、取代還沒跑完的舊動畫） */
  let stepTargetIdx = null;
  function animateScrollTo(target, duration){
    cancelSnap();
    const start = stage.scrollLeft;
    const dist = target - start;
    const startTime = performance.now();
    function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
    function tick(now){
      const t = Math.min(1, (now - startTime) / duration);
      stage.scrollLeft = start + dist * easeOutCubic(t);
      updateArcFocus(stage);
      if(t < 1){ snapRAF = requestAnimationFrame(tick); }
      else { snapRAF = null; stepTargetIdx = null; }
    }
    snapRAF = requestAnimationFrame(tick);
  }

  if(window.innerWidth > 820){
    /* 滑鼠滾輪：每滾一格只移動「一張」卡片，不再用慣性一口氣衝過好幾張。
       觸控板會送出很多很小的 deltaY，所以先累積，累積到一定量才算一格；
       連續快速滾動時，從「正要前往的那張」繼續往下算，不會吃掉滾動的格數。 */
    const WHEEL_STEP = 60;      // 累積多少 deltaY 算一格（一般滑鼠滾一格約 100）
    const WHEEL_COOLDOWN = 110; // 兩次換卡之間最短間隔（毫秒），避免觸控板一甩就飛過整排
    let wheelAcc = 0;
    let lastStepTime = 0;
    stage.addEventListener('wheel', (e)=>{
      if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; // 觸控板橫滑，交給原生捲動
      e.preventDefault();
      if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; momentum = 0; }
      const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY; // 以「行」為單位的滑鼠換算成像素
      if(wheelAcc && Math.sign(dy) !== Math.sign(wheelAcc)) wheelAcc = 0;
      wheelAcc += dy;
      const now = performance.now();
      if(Math.abs(wheelAcc) < WHEEL_STEP || now - lastStepTime < WHEEL_COOLDOWN) return;
      const dir = Math.sign(wheelAcc);
      wheelAcc = 0;
      lastStepTime = now;
      const cards = stage.querySelectorAll('.arc-card');
      if(!cards.length) return;
      const from = stepTargetIdx != null ? stepTargetIdx : nearestCardIndex(cards);
      const to = Math.max(0, Math.min(cards.length-1, from + dir));
      stepTargetIdx = to;
      animateScrollTo(cardTarget(cards[to]), 320);
    }, {passive:false});

    /* 滑鼠按住拖曳：按住卡片往左右拉就能捲動，放開後依照甩動的速度
       再滑一小段，最後一樣自動對齊到最近的卡片。只處理滑鼠，
       手機／觸控板維持瀏覽器原生的滑動。拖過之後放開不會被當成「點擊」，
       不會不小心跳進角色頁；沒有拖動（單純點一下）則照常進入角色頁。 */
    let drag = null;
    let suppressClick = false;
    stage.addEventListener('pointerdown', (e)=>{
      if(e.pointerType !== 'mouse' || e.button !== 0) return;
      cancelSnap();
      stepTargetIdx = null;
      if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; momentum = 0; }
      drag = { startX:e.clientX, startScroll:stage.scrollLeft, lastX:e.clientX, lastT:performance.now(), v:0, moved:false, id:e.pointerId };
    });
    stage.addEventListener('pointermove', (e)=>{
      if(!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.startX;
      if(!drag.moved){
        if(Math.abs(dx) < 6) return; // 小於 6px 視為點擊，不算拖曳
        drag.moved = true;
        stage.setPointerCapture(e.pointerId);
        stage.classList.add('is-dragging');
      }
      stage.scrollLeft = drag.startScroll - dx;
      const now = performance.now();
      const dt = Math.max(1, now - drag.lastT);
      /* 速度換算成「每一影格（約 16ms）移動幾 px」，給放開後的慣性用 */
      drag.v = drag.v*0.6 + ((drag.lastX - e.clientX) / dt * 16) * 0.4;
      drag.lastX = e.clientX; drag.lastT = now;
      updateArcFocus(stage);
    });
    function endDrag(e){
      if(!drag || (e && e.pointerId !== drag.id)) return;
      const d = drag; drag = null;
      stage.classList.remove('is-dragging');
      if(!d.moved) return;
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; }, 0);
      /* 放開前停住超過 0.1 秒就不給慣性，直接對齊 */
      const v = performance.now() - d.lastT > 100 ? 0 : d.v;
      momentum = Math.max(-40, Math.min(40, v));
      if(Math.abs(momentum) > 1){ momentumRAF = requestAnimationFrame(stepMomentum); }
      else { momentum = 0; snapToNearest(); }
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('click', (e)=>{
      if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick = false; }
    }, true);
    /* 不讓瀏覽器把圖片／連結當成「拖出去」的檔案，不然拉一下就變成拖曳圖片 */
    stage.addEventListener('dragstart', (e)=>e.preventDefault());
  }
  let ticking = false;
  stage.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ updateArcFocus(stage); ticking = false; });
    if(!momentumRAF && !snapRAF && !stage.classList.contains('is-dragging')){ scheduleSnap(); }
  }, {passive:true});
  requestAnimationFrame(()=>{
    const cardsEls = track.querySelectorAll('.arc-card');
    if(!cardsEls.length) return;
    /* 預設置中的角色是每個世界編號 01 的角色，找不到才退回陣列正中間 */
    let peakEl = null;
    cardsEls.forEach(el=>{
      const href = el.getAttribute('href') || '';
      if(/-01$/.test(href)){ peakEl = el; }
    });
    if(!peakEl){ peakEl = cardsEls[Math.round((cardsEls.length-1)/2)]; }
    const stageRect = stage.getBoundingClientRect();
    const cardRect = peakEl.getBoundingClientRect();
    const cardCenter = (cardRect.left - stageRect.left) + stage.scrollLeft + cardRect.width/2;
    const target = cardCenter - stage.clientWidth/2;
    stage.scrollLeft = Math.max(0, target);
    updateArcFocus(stage);
  });
}

/* 視窗寬度跨過手機/電腦的門檻（820px）時，角色列表頁要重新排版
   （橫向排列 vs 直向排列的算法不一樣），其他頁面不受影響 */
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(!lastGridArgs) return;
    const nowMobile = window.innerWidth <= 820;
    if(nowMobile !== lastGridIsMobile && location.hash.startsWith('#/grid/')){
      renderGrid(...lastGridArgs);
    }
  }, 200);
});

/* ---------------- 世界觀關係圖 #/relations/coop/<world> ----------------
   把同一個世界觀裡每個角色在後台「關係 Relationships」填的對象全部畫成一張網絡圖：
   - 網站上的角色：用頭像，點了進角色頁
   - 不在網站上、但被兩個以上角色提到的人（例如共同的上司）：虛線圓圈
     （只被一個人提到的就不畫，不然圖會太亂；那些在個別角色頁的關係圖看得到）
   - 線的樣式依關係稱呼自動分類：愛情（主題色粗線）、家人（虛線）、其他（細線）
   所有人排成一圈、同家族的排在一起（見 layoutRing），每次打開結果都一樣，不用另外設定。
   滑鼠移到（手機點一下）某個人，只亮出跟他有關的線，對方名字下面會出現「是他的什麼人」。 */
const REL_LOVE_RE = /愛人|戀人|摯愛|妻|丈夫|老公|老婆|伴侶|未婚|情人|曖昧|婚/;
const REL_FAMILY_RE = /父|母|兄|弟|姐|姊|妹|子|女兒|養|叔|伯|舅|姨|嫂|孫|家人|親/;
function relKind(label){
  if(REL_LOVE_RE.test(label)) return 'love';
  if(REL_FAMILY_RE.test(label)) return 'family';
  return 'other';
}
/* 「馬拉斯家族→坎圖家族」這種寫法，取最後（現在）的所屬來分群 */
const affGroup = a => String(a||'').split(/→|->/).pop().replace(/\(.*?\)|（.*?）/g,'').trim();

function buildWorldGraph(world){
  const chars = CHARACTERS.filter(c=>c.category==='coop' && c.world===world);
  const byId = new Map(chars.map(c=>[c.id, c]));
  const byName = new Map(chars.map(c=>[normName(c.codename), c]));
  const resolve = t => byId.get(t) || byName.get(normName(t)) || null;
  /* 先數每個站外名字被幾個角色提到 */
  const extCount = new Map();
  chars.forEach(c=>{
    const seen = new Set();
    (c.relationships||[]).forEach(r=>{
      if(!r || !r.target || resolve(r.target)) return;
      const k = normName(r.target); if(seen.has(k)) return; seen.add(k);
      extCount.set(k, { name:r.target.trim(), n:(extCount.get(k)?.n || 0) + 1 });
    });
  });
  const nodes = new Map();
  const nodeFor = (target)=>{
    const c = resolve(target);
    if(c){ if(!nodes.has(c.id)) nodes.set(c.id, { key:c.id, ch:c, name:c.codename, group:affGroup(c.affiliation), deg:0 }); return nodes.get(c.id); }
    const k = normName(target), e = extCount.get(k);
    if(!e || e.n < 2) return null;
    const key = 'ext:'+k;
    if(!nodes.has(key)) nodes.set(key, { key, ch:null, name:e.name, group:'', deg:0 });
    return nodes.get(key);
  };
  const edges = new Map();
  chars.forEach(c=>{
    (c.relationships||[]).forEach(r=>{
      if(!r || !r.target) return;
      const a = nodeFor(c.id), b = nodeFor(r.target);
      if(!a || !b || a === b) return;
      const key = [a.key, b.key].sort().join('|');
      if(!edges.has(key)) edges.set(key, { a, b, labels:[] });
      const label = (r.label||'').trim();
      if(label) edges.get(key).labels.push({ from:a, text:label });
    });
  });
  edges.forEach(e=>{
    e.a.deg++; e.b.deg++;
    const all = e.labels.map(l=>l.text).join('、');
    e.kind = relKind(all);
  });
  return { nodes:[...nodes.values()], edges:[...edges.values()] };
}

/* 排版：所有人排成一個橢圓圈，同一個家族／組織的人排在一起（群組之間留一格空隙），
   線一律從圈的內側彎過去，不會穿過任何人的頭像或名字。
   群組內的順序會調整成「盡量靠近跟他有關係的人」，讓線短一點、交叉少一點。
   排法只看資料，所以每次打開結果都一樣。 */
function layoutRing(nodes, edges){
  const nb = new Map(nodes.map(v=>[v, []]));
  edges.forEach(e=>{ nb.get(e.a).push(e.b); nb.get(e.b).push(e.a); });
  /* 不在網站上的人、沒填所屬的人：歸到跟他有關係的人最多的那一群 */
  nodes.forEach(v=>{
    if(v.group) return;
    const cnt = new Map();
    nb.get(v).forEach(o=>{ if(o.group) cnt.set(o.group, (cnt.get(o.group)||0) + 1); });
    v.group = [...cnt].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))[0]?.[0] || '~';
  });
  const groupsMap = new Map();
  nodes.forEach(v=>{ if(!groupsMap.has(v.group)) groupsMap.set(v.group, []); groupsMap.get(v.group).push(v); });
  /* 群組的順序：從最大的群開始，下一個接「跟上一群關係最多」的群，相關的群就會相鄰 */
  const link = (g, h)=>edges.filter(e=>(e.a.group===g && e.b.group===h) || (e.a.group===h && e.b.group===g)).length;
  const left = [...groupsMap.keys()].sort((a,b)=>groupsMap.get(b).length - groupsMap.get(a).length || a.localeCompare(b));
  const order = [left.shift()];
  while(left.length){
    const last = order[order.length-1];
    left.sort((a,b)=>link(last,b) - link(last,a) || groupsMap.get(b).length - groupsMap.get(a).length);
    order.push(left.shift());
  }
  order.forEach(g=>groupsMap.get(g).sort((a,b)=>b.deg - a.deg || a.key.localeCompare(b.key)));
  const gaps = order.length > 1 ? order.length : 0;
  const slots = nodes.length + gaps;
  const place = ()=>{
    let s = 0;
    order.forEach(g=>{ groupsMap.get(g).forEach(v=>{ v.t = s++ / slots; v.ang = -Math.PI/2 + v.t * Math.PI * 2; }); if(gaps) s++; });
  };
  place();
  /* 群組內依「鄰居的平均角度」重新排序幾輪 */
  for(let it = 0; it < 12; it++){
    order.forEach(g=>{
      const list = groupsMap.get(g);
      const base = list.reduce((m,v)=>m + v.ang, 0) / list.length;
      list.forEach(v=>{
        const ns = nb.get(v);
        if(!ns.length){ v.want = v.ang - base; return; }
        let sx = 0, sy = 0; ns.forEach(o=>{ sx += Math.cos(o.ang); sy += Math.sin(o.ang); });
        const target = Math.atan2(sy, sx);
        let d = target - base; d = Math.atan2(Math.sin(d), Math.cos(d));
        v.want = (v.ang - base) * 0.4 + d * 0.6;
      });
      list.sort((a,b)=>a.want - b.want);
    });
    place();
  }
}

function renderWorldRelations(world){
  const w = WORLD_META[world];
  const name = w ? w.name : world.toUpperCase();
  setCrumb([{label:'Home',hash:'#/index'},{label:'Co-creation',hash:'#/coop'},{label:name, hash:`#/grid/coop/${world}`},{label:'關係圖'}]);
  const { nodes, edges } = buildWorldGraph(world);
  if(!edges.length){
    app.innerHTML = `<div class="view"><div class="section-head"><h2 class="brand-title">${name} · 關係圖</h2></div><div class="empty-note">這個世界觀的角色還沒有填「關係」。到後台角色資料的「關係 Relationships」新增，關係圖就會自動出現。</div></div>`;
    return;
  }
  const isMobile = window.innerWidth <= 640;
  const maxDeg = Math.max(...nodes.map(n=>n.deg));
  const W = Math.min(1040, (app.clientWidth || window.innerWidth) - (isMobile ? 32 : 120));
  const H = Math.round(isMobile ? W * 1.2 : Math.min(W * 0.72, 760));
  /* 圈的大小：左右要留位置給名字 */
  const rx = W/2 - (isMobile ? 54 : 100), ry = H/2 - (isMobile ? 30 : 44);
  const cx = W/2, cy = H/2;
  nodes.forEach(n=>{
    n.size = n.ch ? Math.round(isMobile ? 18 + (n.deg / maxDeg) * 8 : 30 + (n.deg / maxDeg) * 14) : (isMobile ? 9 : 12);
    n.label = shortName(n.name);
  });
  layoutRing(nodes, edges);
  /* 沿著橢圓的「周長」平均分配位置（直接用角度平均分的話，橢圓比較尖的那一頭會擠在一起） */
  const STEPS = 720, arc = [0];
  for(let i = 1; i <= STEPS; i++){
    const a0 = -Math.PI/2 + (i-1) / STEPS * Math.PI*2, a1 = -Math.PI/2 + i / STEPS * Math.PI*2;
    arc.push(arc[i-1] + Math.hypot(rx * (Math.cos(a1) - Math.cos(a0)), ry * (Math.sin(a1) - Math.sin(a0))));
  }
  const font = isMobile ? 9.5 : 11;
  nodes.forEach(n=>{
    const target = n.t * arc[STEPS];
    let i = 1; while(i < STEPS && arc[i] < target) i++;
    n.ang = -Math.PI/2 + (i - 1 + (target - arc[i-1]) / ((arc[i] - arc[i-1]) || 1)) / STEPS * Math.PI*2;
    const c = Math.cos(n.ang), s = Math.sin(n.ang);
    n.x = cx + rx * c; n.y = cy + ry * s;
    /* 名字往圈外的方向放：右半邊靠左對齊、左半邊靠右對齊、正上／正下方置中 */
    const nx = c / rx, ny = s / ry, nl = Math.hypot(nx, ny);
    n.nx = nx / nl; n.ny = ny / nl;
    n.side = n.nx > 0.3 ? 'right' : n.nx < -0.3 ? 'left' : 'mid';
    n.top = n.ny < 0;
    n.off = n.size / 2 + (isMobile ? 4 : 7);
    n.bw = n.label.length * font * 1.08; n.bh = font * 1.35;
  });
  /* 名字互相重疊的話，把其中一個再往外推一點（多半發生在圈的正上方／正下方） */
  const box = n=>{
    const lx = n.x + n.nx * n.off, ly = n.y + n.ny * n.off;
    const x0 = n.side === 'right' ? lx : n.side === 'left' ? lx - n.bw : lx - n.bw/2;
    const y0 = n.side === 'mid' ? (n.top ? ly - n.bh : ly) : ly - n.bh/2;
    return [x0, y0, x0 + n.bw, y0 + n.bh];
  };
  for(let pass = 0; pass < 40; pass++){
    let moved = false;
    for(let i = 0; i < nodes.length; i++) for(let j = i + 1; j < nodes.length; j++){
      const A = box(nodes[i]), B = box(nodes[j]);
      if(A[0] < B[2] + 3 && B[0] < A[2] + 3 && A[1] < B[3] + 1 && B[1] < A[3] + 1){
        const m = nodes[i].off <= nodes[j].off ? nodes[j] : nodes[i];
        m.off += 4; moved = true;
      }
    }
    if(!moved) break;
  }
  nodes.forEach(n=>{ n.lx = n.x + n.nx * n.off; n.ly = n.y + n.ny * n.off; });
  const f = v => v.toFixed(1);
  const curve = e=>{
    /* 兩人在圈上離越遠，線越往圓心彎；相鄰的人只微微往內彎 */
    const mx = (e.a.x + e.b.x)/2, my = (e.a.y + e.b.y)/2;
    let d = Math.abs(e.a.ang - e.b.ang); if(d > Math.PI) d = Math.PI*2 - d;
    const k = 0.45 + 0.55 * Math.pow(Math.cos(d/2), 3);
    const qx = cx + (mx - cx) * k, qy = cy + (my - cy) * k;
    return `M${f(e.a.x)} ${f(e.a.y)} Q${f(qx)} ${f(qy)} ${f(e.b.x)} ${f(e.b.y)}`;
  };
  const lines = edges.map((e,i)=>`<path class="rg-edge is-${e.kind}" data-i="${i}" d="${curve(e)}"/>`).join('');
  const nodeHtml = nodes.map((n,i)=>{
    const inner = n.ch ? avatarBlock(n.ch) : '';
    const tag = n.ch ? 'a' : 'div';
    const href = n.ch ? ` href="#/char/${n.ch.id}" aria-label="${n.name}"` : '';
    const d = `--d:${Math.round(i * 22)}ms`;
    const pos = n.side === 'right' ? `left:${f(n.lx)}px; top:${f(n.ly)}px; transform:translateY(-50%);`
      : n.side === 'left' ? `right:${f(W - n.lx)}px; top:${f(n.ly)}px; transform:translateY(-50%);`
      : `left:${f(n.lx)}px; top:${f(n.ly)}px; transform:translate(-50%, ${n.top ? '-100%' : '0'});`;
    return `<${tag} class="rg-node${n.ch ? '' : ' is-external'}" data-n="${i}"${href} style="left:${f(n.x)}px; top:${f(n.y)}px; --s:${n.size}px; ${d}"><span class="rg-avatar">${inner}</span></${tag}>`
      + `<div class="rg-label is-${n.side}${n.ch ? '' : ' is-external'}" data-n="${i}" style="${pos} ${d}"><span class="rg-name">${n.label}</span><span class="rg-tag"></span></div>`;
  }).join('');
  app.innerHTML = `
  <div class="view rg-view">
    <div class="section-head">
      <h2 class="brand-title">${name} · 關係圖</h2>
      <div class="section-head-right">
        <a class="pill-link" href="#/grid/coop/${world}">← 角色列表</a>
        <div class="section-count">${nodes.length} PEOPLE · ${edges.length} LINKS</div>
      </div>
    </div>
    <div class="rg-legend">
      <span><i class="rg-key is-love"></i>愛情</span>
      <span><i class="rg-key is-family"></i>家人</span>
      <span><i class="rg-key"></i>其他</span>
      <span><i class="rg-key-node"></i>不在網站上的人物</span>
      <span class="rg-hint">${isMobile ? '點一下人物看關係，再點一下進入角色頁' : '滑鼠移到人物上看關係，點擊進入角色頁'}</span>
    </div>
    <div class="rg-stage" id="rg-stage" style="width:${W}px; height:${H}px;">
      <svg class="rg-lines" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <ellipse class="rg-ring" cx="${cx}" cy="${cy}" rx="${f(rx)}" ry="${f(ry)}"/>
        ${lines}
      </svg>
      ${nodeHtml}
    </div>
  </div>`;
  initWorldRelations(nodes, edges);
}

function initWorldRelations(nodes, edges){
  const stage = document.getElementById('rg-stage');
  if(!stage) return;
  const nodeEls = [...stage.querySelectorAll('.rg-node')];
  const labelEls = [...stage.querySelectorAll('.rg-label')];
  const lineEls = [...stage.querySelectorAll('.rg-edge')];
  let focused = null;
  const focus = (idx)=>{
    focused = idx;
    stage.classList.toggle('has-focus', idx != null);
    const node = idx != null ? nodes[idx] : null;
    /* 對方是「他的什麼人」：優先用這個人自己填的稱呼，沒有的話才用對方填的 */
    const tagOf = new Map();
    edges.forEach((e,i)=>{
      const on = !!node && (e.a === node || e.b === node);
      lineEls[i].classList.toggle('is-on', on);
      if(!on) return;
      const o = e.a === node ? e.b : e.a;
      const mine = e.labels.filter(l=>l.from === node).map(l=>l.text);
      const theirs = e.labels.filter(l=>l.from !== node).map(l=>l.text);
      tagOf.set(o, [...new Set(mine.length ? mine : theirs)].join(' ／ '));
    });
    nodes.forEach((n,i)=>{
      const near = i === idx || tagOf.has(n);
      nodeEls[i].classList.toggle('is-near', near); nodeEls[i].classList.toggle('is-focus', i === idx);
      labelEls[i].classList.toggle('is-near', near); labelEls[i].classList.toggle('is-focus', i === idx);
            labelEls[i].querySelector('.rg-tag').textContent = tagOf.get(n) || '';
    });
  };
  const touch = window.matchMedia('(hover:none)').matches;
  nodeEls.forEach((el,i)=>{
    if(!touch){
      el.addEventListener('mouseenter', ()=>focus(i));
      el.addEventListener('mouseleave', ()=>focus(null));
    }
    el.addEventListener('click', (e)=>{
      /* 手機：第一下先亮出關係，第二下才進入角色頁（不在網站上的人只會亮出關係） */
      if(touch && focused !== i){ e.preventDefault(); focus(i); }
    });
  });
  if(touch) stage.addEventListener('click', (e)=>{ if(!e.target.closest('.rg-node')) focus(null); });
  requestAnimationFrame(()=>stage.classList.add('is-ready'));
}

/* ---------------- 全站搜尋 ----------------
   選單的「Search」（手機版是右上角的放大鏡）或按鍵盤 / 打開。
   名字、本名、所屬、身分、專長、CP、世界觀名稱都搜得到，空白和「·」不影響比對；
   名字開頭符合的排最前面。上下鍵選擇、Enter 進入角色頁、Esc 關閉。 */
const searchNorm = s => String(s||'').toLowerCase().replace(/[\s·・•‧･.\-_]/g, '');
let searchHits = [], searchActive = 0;
function charWorldLabel(ch){
  if(ch.category === 'original') return 'PLURK';
  return (WORLD_META[ch.world] && WORLD_META[ch.world].name) || String(ch.world||'').toUpperCase();
}
function searchCharacters(q){
  const nq = searchNorm(q);
  if(!nq) return [];
  const scored = [];
  CHARACTERS.forEach(ch=>{
    const name = searchNorm(ch.codename), real = searchNorm(ch.realname);
    let score = 0;
    if(name.startsWith(nq)) score = 100;
    else if(name.includes(nq)) score = 80;
    else if(real.includes(nq)) score = 60;
    else if([ch.affiliation, ch.role, ch.skill, ch.cp, charWorldLabel(ch)].some(v=>searchNorm(v).includes(nq))) score = 30;
    if(score) scored.push({ ch, score });
  });
  return scored.sort((a,b)=>b.score - a.score || a.ch.codename.localeCompare(b.ch.codename, 'zh-Hant')).slice(0, 30).map(s=>s.ch);
}
const escHtml = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 把名字裡符合的那一段標成主題色（比對時忽略空白和「·」，所以逐字對回原本的名字） */
function highlightName(name, q){
  const nq = searchNorm(q); if(!nq) return escHtml(name);
  const chars = [...name]; const map = [];
  chars.forEach((c,i)=>{ if(searchNorm(c)) map.push(i); });
  const flat = map.map(i=>searchNorm(chars[i])).join('');
  const at = flat.indexOf(nq); if(at < 0) return escHtml(name);
  const from = map[at], to = map[at + nq.length - 1];
  return escHtml(chars.slice(0, from).join('')) + '<mark>' + escHtml(chars.slice(from, to + 1).join('')) + '</mark>' + escHtml(chars.slice(to + 1).join(''));
}
function renderSearchResults(){
  const q = document.getElementById('search-input').value;
  const box = document.getElementById('search-results');
  searchHits = searchCharacters(q); searchActive = 0;
  if(!q.trim()){
    box.innerHTML = `<div class="search-empty">輸入角色名字、本名、所屬或身分<small>${CHARACTERS.length} CHARACTERS · ↑↓ 選擇 · ENTER 開啟</small></div>`;
    return;
  }
  if(!searchHits.length){
    box.innerHTML = `<div class="search-empty">找不到「${escHtml(q.trim())}」<small>試試看只打名字的一部分</small></div>`;
    return;
  }
  box.innerHTML = searchHits.map((ch,i)=>{
    const sub = [ch.role, ch.affiliation].filter(v=>v && v !== '—').join(' · ');
    const color = ch.category === 'coop' ? (WORLD_COLORS[ch.world] || '') : '';
    return `<a class="search-item${i===0?' is-active':''}" href="#/char/${ch.id}" data-i="${i}">
      <span class="search-av">${avatarBlock(ch)}</span>
      <span style="min-width:0"><div class="search-name">${highlightName(ch.codename, q)}</div>${sub ? `<div class="search-sub">${escHtml(sub)}</div>` : ''}</span>
      <span class="search-tag"${color ? ` style="--tag:${color}"` : ''}>${escHtml(charWorldLabel(ch))}</span>
    </a>`;
  }).join('');
}
function setSearchActive(i){
  const items = document.querySelectorAll('#search-results .search-item');
  if(!items.length) return;
  searchActive = (i + items.length) % items.length;
  items.forEach((el,k)=>el.classList.toggle('is-active', k === searchActive));
  items[searchActive].scrollIntoView({ block:'nearest' });
}
function openSearch(){
  const modal = document.getElementById('search-modal');
  if(modal.classList.contains('open')) return;
  document.getElementById('nav-links')?.classList.remove('open');
  modal.classList.add('open'); document.body.classList.add('search-open');
  const input = document.getElementById('search-input');
  input.value = ''; renderSearchResults();
  setTimeout(()=>input.focus(), 30);
}
function closeSearch(){
  document.getElementById('search-modal').classList.remove('open');
  document.body.classList.remove('search-open');
  document.getElementById('search-input').blur(); /* 不然游標還停在隱藏的搜尋框裡，下一次按 / 會被當成在打字 */
}
(function initSearch(){
  const input = document.getElementById('search-input');
  input.addEventListener('input', renderSearchResults);
  input.addEventListener('keydown', e=>{
    if(e.key === 'ArrowDown'){ e.preventDefault(); setSearchActive(searchActive + 1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setSearchActive(searchActive - 1); }
    else if(e.key === 'Enter'){ const ch = searchHits[searchActive]; if(ch){ e.preventDefault(); closeSearch(); location.hash = '#/char/' + ch.id; } }
  });
  document.getElementById('search-results').addEventListener('mousemove', e=>{
    const it = e.target.closest('.search-item'); if(it && +it.dataset.i !== searchActive) setSearchActive(+it.dataset.i);
  });
  document.getElementById('search-results').addEventListener('click', e=>{ if(e.target.closest('.search-item')) closeSearch(); });
  document.addEventListener('keydown', e=>{
    const open = document.getElementById('search-modal').classList.contains('open');
    if(open && e.key === 'Escape'){ closeSearch(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if(!open && !typing && (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'))){ e.preventDefault(); openSearch(); }
  });
  window.addEventListener('hashchange', closeSearch);
})();

/* ---------------- PROFILE ---------------- */
function bioParagraphs(text){
  /* 簡介文字支援分段落：CMS 的文字框裡，空一行代表分段，這裡會自動轉成一個一個 <p> */
  return text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

function renderProfile(id){
  const ch = CHARACTERS.find(c=>c.id===id);
  if(!ch){ app.innerHTML = `<div class="view empty-note">Character record not found.</div>`; setCrumb([{label:'Home',hash:'#/index'}]); setWorldTheme(null); return; }

  setWorldTheme(ch.category==='coop' ? ch.world : null);

  const crumbParts = [{label:'Home',hash:'#/index'}];
  if(ch.category==='original'){ crumbParts.push({label:'Plurk Project',hash:'#/grid/original'}); }
  else{ crumbParts.push({label:'Co-creation',hash:'#/coop'}, {label:(WORLD_META[ch.world] && WORLD_META[ch.world].name) || String(ch.world||'').toUpperCase(), hash:`#/grid/coop/${ch.world}`}); }
  crumbParts.push({label:ch.codename});
  setCrumb(crumbParts);

     共構角色照同一個世界觀的列表排序）同一順序前後移動，首尾相接（最後一位
     的「下一位」繞回第一位），這樣不用每次都先 Back 回列表頁再點下一個 */
  const siblingList = ch.category==='original'
    ? CHARACTERS.filter(c=>c.category==='original')
    : CHARACTERS.filter(c=>c.category==='coop' && c.world===ch.world);
  const siblingIdx = siblingList.findIndex(c=>c.id===ch.id);
  const prevCh = siblingList.length>1 ? siblingList[(siblingIdx-1+siblingList.length)%siblingList.length] : null;
  const nextCh = siblingList.length>1 ? siblingList[(siblingIdx+1)%siblingList.length] : null;
  const charNav = (prevCh && nextCh) ? `
    <div class="pf-reveal pf-char-nav">
      <a class="pf-nav-btn pf-nav-prev" href="#/char/${prevCh.id}">
        <span class="pf-nav-arrow" aria-hidden="true">←</span>
        <span class="pf-nav-text"><span class="pf-nav-label">PREV</span><span class="pf-nav-name">${prevCh.codename}</span></span>
      </a>
      <a class="pf-nav-btn pf-nav-next" href="#/char/${nextCh.id}">
        <span class="pf-nav-text"><span class="pf-nav-label">NEXT</span><span class="pf-nav-name">${nextCh.codename}</span></span>
        <span class="pf-nav-arrow" aria-hidden="true">→</span>

  const fields = [

    ['Birthday', (ch.birthday||'—') + (isBirthdayToday(ch) ? ' <span class="bday-badge">🎂 今天生日！</span>' : '')],
    ['Age', ch.age||'—'],
    ['CP', cpFieldValue(ch)],
    ['Status', `${STATUS_LABEL[ch.status]||ch.status}`],
  ].map(([k,v])=>`<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  /* 沒有填任何文章連結的角色，Articles 整個區塊（標題＋空狀態提示）都不顯示，
     不是顯示一個「No articles yet.」的空區塊——沒資料就乾脆不要佔頁面空間 */
  const articles = ch.articles && ch.articles.length ? ch.articles.map(a=>`
    <a class="article-row" href="${a.url}" target="_blank" rel="noopener">
      <div class="a-main"><div class="a-title">${a.title}</div>${a.src ? `<div class="a-src">${a.src}</div>` : ''}</div>
      <div class="a-go">↗</div>

  `).join('') : '';

  const gallery = ch.gallery && ch.gallery.length ? ch.gallery.map((g,i)=>`
    <div class="gallery-thumb${g.sensitive ? ' is-sensitive' : ''}" style="--i:${Math.min(i, 18)}" onclick="handleGalleryThumbClick(this, '${ch.id}', ${i})">
      ${galleryThumb(g, ch, i)}
      ${g.sensitive ? `<div class="sensitive-badge"><div class="icon">⚠</div>敏感內容<br>點擊查看</div>` : ''}
    </div>
  `).join('') : `<div class="empty-note">No images yet.</div>`;

  app.innerHTML = `
  <div class="view profile-view">
    <div class="pf-avatar-wrap">
      <div class="pf-avatar-circle">${avatarBlock(ch)}</div>
    </div>

    <div class="pf-reveal pf-basic">
      <div class="p-code">${ch.id.toUpperCase()} · ${STATUS_LABEL[ch.status]||ch.status}</div>
      <h1>${ch.codename}</h1>
      <div class="p-role">${ch.role}</div>
      ${shareButtons(ch)}
