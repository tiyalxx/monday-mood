      ${ch.bio ? `<div class="pf-bio">${bioParagraphs(ch.bio)}</div>` : ''}
    </div>

    ${ch.fullbodyImg ? `
    <div class="pf-reveal pf-fullbody-mobile">
      <img ${imgSrcAttr(ch.fullbodyImg,'large')} alt="${ch.codename} full body art" decoding="async">
    </div>` : ''}

    ${buildCharRelations(ch)}

    ${ch.articles && ch.articles.length ? `
    <div class="pf-reveal">
      <div class="section-head"><h2>Articles</h2><div class="section-count">ARTICLES</div></div>
      <div class="article-list">${articles}</div>
    </div>` : ''}

    ${ch.gallery && ch.gallery.length ? `
    <div class="pf-reveal">
      <div class="section-head"><h2>Gallery</h2><div class="section-count">${ch.gallery.length} FILES</div></div>
      <div class="gallery-grid">${gallery}</div>
    </div>` : ''}

    ${charNav}
  </div>`;

  initProfileReveal();
  setupFullbodyBackground(ch);
  initGalleryParallax();
}

/* ---------------- 角色頁面：CP 介紹小視窗 ----------------
   後台每個角色的「CP」欄位下面有「CP 介紹 cpIntro」「CP 圖片 cpImage」，以及兩份
   「CP 特質量表 cpTraitsMine（這個角色 → 對方）／cpTraitsTheirs（對方 → 這個角色）」選填欄位。有填其中一個，角色頁上的 CP 名字就會變成可以點的樣子，點了跳出小視窗。
   如果這個角色沒填、但 CP 對象剛好也是這個網站上的角色而且那邊有填，就沿用對方的介紹，
   同一對 CP 只要在其中一邊寫一次就好。 */
const normName = s => String(s||'').replace(/[\s·・•‧･.]/g, '');
function cpPartner(ch){
  if(!ch.cp) return null;
  const target = normName(ch.cp);
  return CHARACTERS.find(c => c.id !== ch.id && normName(c.codename) === target) || null;
}
/* 特質量表：固定五個項目，「這個角色 → 對方」跟「對方 → 這個角色」各一份，每項 0～5 個點 */
const CP_TRAITS = [['affection','感情強度'],['loyalty','忠誠度'],['possessive','獨佔欲'],['dependence','依存度'],['desire','性慾強度']];
const traitVal = (obj, k) => { const v = obj && obj[k]; return (v === '' || v == null || isNaN(v)) ? null : Math.max(0, Math.min(5, Math.round(Number(v)))); };
const hasTraits = obj => CP_TRAITS.some(([k]) => traitVal(obj, k) != null);
const hasCpInfo = c => !!(c.cpIntro || c.cpImage || hasTraits(c.cpTraitsMine) || hasTraits(c.cpTraitsTheirs));
function cpInfo(ch){
  if(!ch.cp || ch.cp === '—') return null;
  if(hasCpInfo(ch)) return { intro:ch.cpIntro, image:ch.cpImage, mine:ch.cpTraitsMine, theirs:ch.cpTraitsTheirs };
  const p = cpPartner(ch);
  /* 沿用對方的資料時，「我 → 對方」跟「對方 → 我」要左右對調 */
  if(p && hasCpInfo(p) && normName(p.cp) === normName(ch.codename)) return { intro:p.cpIntro, image:p.cpImage, mine:p.cpTraitsTheirs, theirs:p.cpTraitsMine };
  return null;
}
/* 名字太長時量表欄位只放「·」前面那一段（例如 拉涅里·桑托魯姆 → 拉涅里） */
const shortName = n => String(n||'').split(/[·・•‧･]/)[0].trim().split(/\s*\(/)[0] || n;
function cpDots(v){
  if(v == null) return '<span class="cp-dots is-empty">—</span>';
  return `<span class="cp-dots" role="img" aria-label="${v} / 5">${[0,1,2,3,4].map(i=>`<i class="${i < v ? 'on' : ''}"></i>`).join('')}</span>`;
}
function cpTraitsTable(ch, info){
  if(!hasTraits(info.mine) && !hasTraits(info.theirs)) return '';
  const rows = CP_TRAITS.map(([k,label])=>`
    <div class="cp-trait-row">
      ${cpDots(traitVal(info.mine, k))}
      <span class="cp-trait-label">${label}</span>
      ${cpDots(traitVal(info.theirs, k))}
    </div>`).join('');
  return `<div class="cp-traits">
    <div class="cp-traits-head">
      <span>${shortName(ch.codename)} <em>→</em></span>
      <span class="cp-traits-title">特質量表</span>
      <span><em>←</em> ${shortName(ch.cp)}</span>
    </div>${rows}
  </div>`;
}
/* 名字太長時把標題字縮小，盡量排在同一行；縮到最小還放不下才換行 */
function fitCpTitle(){
  const el = document.getElementById('cp-modal-title');
  if(!el) return;
  el.style.fontSize = ''; el.classList.remove('is-wrapped');
  let size = parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth > el.clientWidth + 1 && size > 13){
    size -= 1; el.style.fontSize = size + 'px';
  }
  if(el.scrollWidth > el.clientWidth + 1) el.classList.add('is-wrapped');
}
function cpFieldValue(ch){
  if(!ch.cp) return '—';
  if(!cpInfo(ch)) return ch.cp;
  return `<button type="button" class="cp-link" onclick="openCpModal('${ch.id}')">${ch.cp}<span class="cp-link-icon" aria-hidden="true">♡</span></button>`;
}
function openCpModal(id){
  const ch = CHARACTERS.find(c=>c.id===id);
  const info = ch && cpInfo(ch);
  if(!info) return;
  const partner = cpPartner(ch);
  document.getElementById('cp-modal-body').innerHTML = `
    <div class="cp-label">CP</div>
    <h2 class="cp-title" id="cp-modal-title"><span>${ch.codename}</span><span class="cp-x">×</span><span>${ch.cp}</span></h2>
    <div class="cp-divider" aria-hidden="true">♡</div>
    ${info.image ? `<div class="cp-image"><img ${imgSrcAttr(info.image,'large')} alt="${ch.codename} × ${ch.cp}" decoding="async"></div>` : ''}
    ${cpTraitsTable(ch, info)}
    ${info.intro ? `<div class="cp-intro">${bioParagraphs(info.intro)}</div>` : ''}
    ${partner ? `<a class="pill-link cp-partner" href="#/char/${partner.id}" onclick="closeCpModal()">查看 ${partner.codename} 的檔案 →</a>` : ''}`;
  const modal = document.getElementById('cp-modal');
  modal.classList.add('open');
  document.body.classList.add('cp-modal-open');
  fitCpTitle();
  document.addEventListener('keydown', cpKeyHandler);
  modal.querySelector('.cp-close').focus({preventScroll:true});
}
function closeCpModal(){
  document.getElementById('cp-modal').classList.remove('open');
  document.body.classList.remove('cp-modal-open');
  document.removeEventListener('keydown', cpKeyHandler);
}
function cpKeyHandler(e){ if(e.key === 'Escape') closeCpModal(); }
/* 換頁時（例如按上一頁）小視窗要跟著關掉 */
window.addEventListener('hashchange', ()=>{ if(document.getElementById('cp-modal').classList.contains('open')) closeCpModal(); });

/* ---------------- 角色頁面：分享按鈕 ----------------
   分享出去的不是網址列上的 /#/char/xxx（X、Plurk 抓不到 # 後面，預覽會變成首頁），
   而是部署時 scripts/build-share.mjs 幫每個角色產生的 /char/xxx/ 分享頁：
   那一頁有這個角色自己的標題、簡介跟預覽圖，真人點進去會自動跳回角色頁。 */
function shareUrlFor(ch){
  return `${location.origin}/char/${encodeURIComponent(ch.id)}/`;
}
function shareButtons(ch){
  const url = shareUrlFor(ch);
  const title = `${ch.codename} — Monday's Mood`;
  const xHref = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
  /* Plurk 的「網址 (文字)」格式會變成一個有標題的連結 */
  const plurkHref = `https://www.plurk.com/?qualifier=shares&status=${encodeURIComponent(`${url} (${title})`)}`;
  return `<div class="pf-share">
    <button type="button" class="pill-link" onclick="copyShareLink(this, '${ch.id}')">🔗 複製分享連結</button>
    <a class="pill-link" href="${xHref}" target="_blank" rel="noopener">分享到 X</a>
    <a class="pill-link" href="${plurkHref}" target="_blank" rel="noopener">分享到 Plurk</a>
  </div>`;
}
async function copyShareLink(btn, id){
  const ch = CHARACTERS.find(c=>c.id===id);
  if(!ch) return;
  const url = shareUrlFor(ch);
  let ok = false;
  try{ await navigator.clipboard.writeText(url); ok = true; }
  catch(e){
    /* 舊瀏覽器／沒有權限時的備援：用隱藏的文字框複製 */
    const ta = document.createElement('textarea');
    ta.value = url; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed; opacity:0;';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(err){}
    ta.remove();
  }
  if(!ok){ window.prompt('複製這個連結：', url); return; }
  const label = btn.textContent;
  btn.textContent = '✓ 已複製';
  btn.classList.add('is-done');
  setTimeout(()=>{ btn.textContent = label; btn.classList.remove('is-done'); }, 1600);
}

/* ---------------- 角色頁面：這個角色的關係 ---------------- */
/* 只顯示「這個角色自己」在後台「關係 Relationships」欄位填出來的對象——
   原創、共構世界的角色都適用，只要有填就會顯示，不限世界。
   本人頭像固定在正中間，填過的關係人平均分散在四周一圈（不是全部擠在同一邊），
   人數少的時候（大部分情況）看起來會很像「幾個人頭從中間拉出去」。
   跟世界關係圖一樣用 % 座標＋SVG viewBox 對齊，容器是正方形、隨螢幕寬度縮放，
   不用另外寫 resize 邏輯。 */
function buildCharRelations(ch){
  const links = (ch.relationships||[]).map(r=>{
    if(!r || !r.target) return null;
    const idMatch = CHARACTERS.find(c=>c.id===r.target && c.id!==ch.id);
    if(idMatch) return { target: idMatch, label: (r.label||'').trim(), external: false };
    /* 對方不是資料庫裡的角色（沒有 ID）：直接把填的文字當作名字顯示，
       頭像用名字第一個字當預設圖、不能點進去（因為沒有角色頁可以連） */
    return { target: { codename: r.target, avatarImg: null }, label: (r.label||'').trim(), external: true };
  }).filter(Boolean);

  if(!links.length) return '';

  const n = links.length;
  const sizeClass = n > 8 ? 'is-dense' : n > 5 ? 'is-medium' : '';
  const R = 42; /* 圓的半徑，單位是 % ——比之前（38）再往外推一點，給名字跟關係標籤多一點呼吸空間 */

  const nodePos = links.map((l,i)=>{
    const angle = (i/n) * Math.PI*2 - Math.PI/2; /* 從正上方開始，順時針平均分佈 */
    return { x: 50 + R*Math.cos(angle), y: 50 + R*Math.sin(angle) };
  });

  const linesSvg = links.map((l,i)=>{
    const p = nodePos[i];
    return `<line x1="50" y1="50" x2="${p.x}" y2="${p.y}" class="pf-rel-line"/>`;
  }).join('');

  const labelsHtml = links.map((l,i)=>{
    if(!l.label) return '';
    const p = nodePos[i];
    /* 標籤放在連線靠近本人頭像的那一段（0.4，比之前的 0.6 更靠近中心）——
       越靠近對方頭像，越容易跟對方的名字（在頭像正下方）疊在一起，
       往中心挪一點可以空出對方名字的位置 */
    const mx = 50 + (p.x-50)*0.4;
    const my = 50 + (p.y-50)*0.4;
    return `<div class="pf-rel-edge-label" style="left:${mx}%; top:${my}%;">${l.label}</div>`;
  }).join('');

  const nodesHtml = links.map((l,i)=>{
    const p = nodePos[i];
    const tag = l.external ? 'div' : 'a';
    const hrefAttr = l.external ? '' : ` href="#/char/${l.target.id}"`;
    /* 不在資料庫裡的角色，頭像圈就留空白，不放名字縮寫 */
    const avatarInner = l.external ? '' : avatarBlock(l.target);
    /* 名字預設排在頭像下方，但對方在本人頭像「上半圈」時，下方剛好是朝向
       中心（本人頭像）的方向，容易跟連線中段的關係標籤疊在一起；這種情況
       把名字改放到頭像上方（遠離中心那一側），兩邊才不會互相打架 */
    const flip = p.y < 50 ? ' pf-rel-node-flip' : '';
    return `
    <${tag} class="pf-rel-node${l.external ? ' is-external' : ''}${flip}"${hrefAttr} style="left:${p.x}%; top:${p.y}%;">
      <div class="pf-rel-avatar">${avatarInner}</div>
      <div class="pf-rel-name">${l.target.codename}</div>
    </${tag}>`;
  }).join('');

  /* 手機版關係人多（超過 5 個）的時候，圓形圖會擠成一團、字也太小，
     改用一行一個人的清單（電腦版照舊顯示圓形圖） */
  const listHtml = links.map(l=>{
    const tag = l.external ? 'div' : 'a';
    const hrefAttr = l.external ? '' : ` href="#/char/${l.target.id}"`;
    return `<${tag} class="pf-rel-row${l.external ? ' is-external' : ''}"${hrefAttr}>
      <span class="pf-rel-avatar">${l.external ? '' : avatarBlock(l.target)}</span>
      <span class="pf-rel-row-name">${l.target.codename}</span>
      <span class="pf-rel-row-label">${l.label || ''}</span>
    </${tag}>`;
  }).join('');

  return `
  <div class="pf-reveal">
    <div class="section-head"><h2>Relationships</h2><div class="section-count">${n} LINKED</div></div>
    <div class="pf-rel-stage ${sizeClass}${n > 5 ? ' has-list' : ''}">
      <svg class="pf-rel-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${linesSvg}</svg>
      ${labelsHtml}
      <div class="pf-rel-hub">${avatarBlock(ch)}</div>
      ${nodesHtml}
    </div>
    ${n > 5 ? `<div class="pf-rel-list">${listHtml}</div>` : ''}
  </div>`;
}

/* 立繪固定背景：貼在畫面左側、疊在內容下方，換頁時如果沒有立繪或離開角色頁就隱藏 */
function setupFullbodyBackground(ch){
  let bg = document.getElementById('pf-bg-fullbody');
  if(!bg){
    bg = document.createElement('div');
    bg.id = 'pf-bg-fullbody';
    bg.className = 'pf-bg-fullbody';
    document.body.appendChild(bg);
  }
  bg.classList.remove('in-view');
  /* 用頭像小圖當作立繪還沒載入完成前的模糊預覽——檔案通常小很多，
     幾乎是秒開，讓等待時至少看得出是哪個角色 */
  let placeholder = bg.querySelector('.pf-bg-placeholder');
  if(!placeholder){
    placeholder = document.createElement('div');
    placeholder.className = 'pf-bg-placeholder';
    bg.insertBefore(placeholder, bg.firstChild);
  }
  placeholder.style.backgroundImage = ch.avatarImg ? `url("${thumbSrc(ch.avatarImg)}")` : 'none';
  if(ch.fullbodyImg){
    const targetSrc = ch.fullbodyImg;
    /* 切換角色時，直接改舊 <img> 的 src 有兩個問題：
       1) 畫面會先繼續顯示「上一個角色」的舊圖，看起來像先閃一下錯的立繪才切換過來。
       2) 就算先在背景用一個獨立的 Image() 物件把新圖片完整載入完，
          再把同一個網址設回舊的 <img> 標籤，瀏覽器不一定會直接沿用剛剛
          已經下載好的內容，有機會等於又重新要求下載一次，反而更慢。
       改成：讓這個獨立載入的 Image() 物件（載入完成、瀏覽器已經解碼好內容的
       那一個）直接就是最後顯示用的 <img> 標籤本身，載入完成後把它整個接到
       畫面上、把舊的移除——不用再指定第二次 src，也就不會有重複下載的問題。
       bg.dataset.pendingSrc 用來記錄「目前應該顯示哪張圖」，避免使用者切換得
       很快時，比較慢載入完的舊請求反而蓋掉後來才點的新角色。 */
    bg.dataset.pendingSrc = targetSrc;
    delete bg.dataset.natW;
    delete bg.dataset.natH;
    /* 立刻把「目前畫面上舊角色的立繪」整個拿掉，不要等新的載入完才處理：
       不然新角色的文字內容都已經換過去了，舊角色的立繪卻還留在畫面上，
       看起來就會像是「先跑出別人的立繪，才切回正確的」——這正是先前修過、
       這裡絕對不能再犯的問題。拿掉之後底下留白的區塊，交給下面的
       ::before 骨架閃光去墊著，而不是空白或錯的圖。 */
    const existingImg = document.getElementById('pf-bg-fullbody-img');
    if(existingImg) existingImg.remove();
    const preload = new Image();
    preload.id = 'pf-bg-fullbody-img';
    preload.alt = ch.codename + ' full body art';
    /* 提示瀏覽器優先下載這張圖（部分瀏覽器支援，沒支援也不影響其他功能） */
    try{ preload.fetchPriority = 'high'; }catch(e){}
    preload.onload = ()=>{
      if(bg.dataset.pendingSrc !== targetSrc) return; // 使用者已經切到別的角色，這張圖過期了
      /* 用這個 Image() 物件本身剛剛量到的原始尺寸，存起來給
         updateFullbodyParallax() 用，避免有任何時間差風險。 */
      bg.dataset.natW = preload.naturalWidth;
      bg.dataset.natH = preload.naturalHeight;
      preload.style.transform = 'translateY(0)';
      bg.appendChild(preload);
      updateFullbodyParallax();
      requestAnimationFrame(()=>{ preload.classList.add('loaded'); });
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bg.classList.add('in-view'); }); });
    };
    /* 優先載入壓縮過的大圖；萬一讀取失敗就退回原圖。這個 Image() 還沒接到畫面上，
       所以 document 上的 revealImg 抓不到它的 error，要在這裡自己處理 */
    const largeTarget = largeSrc(targetSrc);
    preload.onerror = ()=>{ preload.onerror = null; if(largeTarget !== targetSrc) preload.src = targetSrc; };
    preload.src = largeTarget;
    bg.classList.add('show');
    document.body.classList.add('has-fullbody-bg');
  } else {
    bg.classList.remove('show');
    document.body.classList.remove('has-fullbody-bg');
    bg.dataset.pendingSrc = '';
    delete bg.dataset.natW;
    delete bg.dataset.natH;
    const leftover = document.getElementById('pf-bg-fullbody-img');
    if(leftover) leftover.remove();
  }
}
function hideFullbodyBackground(){
  const bg = document.getElementById('pf-bg-fullbody');
  if(bg){ bg.classList.remove('show','in-view'); }
  document.body.classList.remove('has-fullbody-bg');
}

/* 立繪固定撐滿盒子寬度（扣掉四周留白），絕對不裁切——整張圖永遠都在畫面上：
   如果圖片本身比較瘦長（撐滿寬度後比盒子還高），就用捲動位置把多出來的
   部分往上平移，做出「頭到腳」的效果；如果圖片比較寬扁／偏方（撐滿寬度
   後反而沒有盒子高），就直接把它上下置中，兩側/上下都不會留白過頭，
   也不需要再捲動——寧可留一點空白，也不會有任何一小塊角色圖被切掉。
   四周留一點點固定的留白（INSET），這樣角色伸出去的手腳/披風邊緣不會
   剛好貼在盒子邊界上，看起來才不會有「好像還是被切到」的錯覺。 */
function updateFullbodyParallax(){
  if(!document.body.classList.contains('has-fullbody-bg')) return;
  const bg = document.getElementById('pf-bg-fullbody');
  const img = document.getElementById('pf-bg-fullbody-img');
  if(!bg || !img) return;
  const natW = Number(bg.dataset.natW) || img.naturalWidth;
  const natH = Number(bg.dataset.natH) || img.naturalHeight;
  if(!natW || !natH) return;
  const INSET = 22;
  const boxW = bg.clientWidth - INSET*2, boxH = bg.clientHeight - INSET*2;
  const naturalRatio = natW / natH; // 寬/高
  img.style.width = boxW.toFixed(1) + 'px';
  img.style.height = 'auto';
  img.style.left = INSET + 'px';
  const renderedH = boxW / naturalRatio;
  if(renderedH > boxH){
    // 瘦長立繪：撐滿寬度後比盒子高，捲動時往上平移露出頭到腳
    img.style.top = INSET + 'px';
    const maxTranslate = renderedH - boxH;
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const progress = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
    img.style.transform = `translateY(${(-progress * maxTranslate).toFixed(1)}px)`;
  } else {
    // 寬扁／偏方立繪：撐滿寬度後比盒子矮，直接整張置中，不裁切也不用捲動
    img.style.top = (INSET + (boxH - renderedH) / 2).toFixed(1) + 'px';
    img.style.transform = 'translateY(0)';
  }
  updateFullbodyDim(bg);
}
/* 捲到 Gallery（沒有 Gallery 就是頁尾的上一位／下一位）附近時，立繪慢慢變淡、
   微微模糊，融進背景裡，不會跟縮圖、按鈕疊在一起搶畫面；但不會完全消失，
   往回捲又會慢慢變回來。用 CSS 變數 --fb-dim 控制（1 = 原本，FULLBODY_MIN_DIM = 最淡） */
const FULLBODY_MIN_DIM = 0.16;
function updateFullbodyDim(bg){
  const target = document.querySelector('.profile-view .gallery-grid') || document.querySelector('.profile-view .pf-char-nav');
  if(!target){ bg.style.setProperty('--fb-dim', 1); return; }
  const vh = window.innerHeight;
  const top = target.getBoundingClientRect().top;
  /* 目標區塊的頂端從畫面 90% 高度往上捲到 30% 的這段距離內，從 1 漸變到最淡 */
  const t = Math.min(1, Math.max(0, (vh*0.9 - top) / (vh*0.6)));
  const eased = t * t * (3 - 2*t); // smoothstep，開始跟結束都比較柔和
  bg.style.setProperty('--fb-dim', (1 - eased * (1 - FULLBODY_MIN_DIM)).toFixed(3));
}
let fullbodyParallaxTicking = false;
window.addEventListener('scroll', ()=>{
  if(fullbodyParallaxTicking) return;
  fullbodyParallaxTicking = true;
  requestAnimationFrame(()=>{ updateFullbodyParallax(); fullbodyParallaxTicking = false; });
}, {passive:true});

/* 角色頁往下捲動一段距離後才出現「回到最頂」按鈕，點下去平滑捲回頂端 */
const TO_TOP_SHOW_AFTER = 480;
function updateToTopButton(){
  const btn = document.getElementById('to-top-btn');
  if(!btn) return;
  const show = document.body.classList.contains('is-profile') && window.scrollY > TO_TOP_SHOW_AFTER;
  btn.classList.toggle('show', show);
}
document.getElementById('to-top-btn').addEventListener('click', ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
});
let toTopTicking = false;
window.addEventListener('scroll', ()=>{
  if(toTopTicking) return;
  toTopTicking = true;
  requestAnimationFrame(()=>{ updateToTopButton(); toTopTicking = false; });
}, {passive:true});

/* 角色頁的捲動淡入：進入畫面的區塊才觸發淡入＋上移，觸發過一次就不再重複 */
function initProfileReveal(){
  const els = document.querySelectorAll('.pf-reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in-view')); return; }
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:0.15, rootMargin:'0px 0px -60px 0px'});
  els.forEach(el=>obs.observe(el));
}

/* ============================================================
   燈箱 Lightbox
============================================================ */
/* 敏感縮圖第一次點擊只是解除模糊、看清楚縮圖本身，
   不會直接跳出大圖；已經解除模糊了再點一次，才會真的打開大圖 */
function handleGalleryThumbClick(el, charId, index){
  /* 圖片載入失敗時，點一下先試著重新載入，不要直接跳出空白的大圖 */
  if(el.classList.contains('img-error')){
    const img = el.querySelector('img');
    if(img){
      el.classList.remove('img-error');
      const src = img.getAttribute('src');
      img.src = '';
      img.src = src;
    }
    return;
  }
  if(el.classList.contains('is-sensitive') && !el.classList.contains('revealed')){
    el.classList.add('revealed');
    return;
  }
  openLightbox(charId, index, el);
}
let lbState = { charId:null, index:0 };
function openLightbox(charId, index, originEl){
  lbState = { charId, index };
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', lbKeyHandler);
  if(originEl) playLightboxExpand(originEl);
  preloadLightboxNeighbors();
}
/* 點縮圖開大圖：圖片不是憑空淡入疊上去，而是先瞬間「貼」在縮圖原本的
   位置跟大小（用 translate+scale 算出跟最終置中大小的落差），逼瀏覽器
   畫出這一幀，下一影格再把 transform 放開、用 transition 滑到正常的
   置中大小——視覺上就像縮圖自己原地展開變成大圖，而不是另一層東西蓋上來。
   用 FLIP 技巧（記錄起點→量終點→反推落差→播放）做，不用等圖片真的
   載入完成也能先播動畫，圖片本身另外有自己的淡入。 */
function playLightboxExpand(originEl){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const img = document.getElementById('lb-img');
  if(!img || img.style.display==='none') return;
  const originRect = originEl.getBoundingClientRect();
  requestAnimationFrame(()=>{
    const finalRect = img.getBoundingClientRect();
    if(!finalRect.width || !finalRect.height) return;
    const scaleX = originRect.width / finalRect.width;
    const scaleY = originRect.height / finalRect.height;
    const dx = (originRect.left + originRect.width/2) - (finalRect.left + finalRect.width/2);
    const dy = (originRect.top + originRect.height/2) - (finalRect.top + finalRect.height/2);

    img.style.transition = 'none';
    img.style.transform = `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`;
    void img.offsetWidth;
    img.style.transition = 'transform .55s cubic-bezier(.16,.84,.24,1), opacity .5s ease';
    requestAnimationFrame(()=>{ img.style.transform = 'translate(0,0) scale(1,1)'; });
  });
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKeyHandler);
  const img = document.getElementById('lb-img');
  if(img){ img.style.transition = ''; img.style.transform = ''; img.style.opacity = ''; }
  lbNavToken++;
}
let lbNavToken = 0;
function lbNav(dir){
  const ch = CHARACTERS.find(c=>c.id===lbState.charId);
  const len = ch.gallery.length;
  lbState.index = (lbState.index + dir + len) % len;
  const img = document.getElementById('lb-img');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const token = ++lbNavToken;
  if(!img || img.style.display === 'none' || reduce){ renderLightbox(); preloadLightboxNeighbors(); return; }
  /* 1) 舊圖往反方向滑一小段並淡出 */
  img.style.transition = 'opacity .18s ease, transform .2s ease';
  img.style.opacity = '0';
  img.style.transform = `translateX(${-dir * 28}px)`;
  setTimeout(()=>{
    if(token !== lbNavToken) return; // 連續快速點擊時，只處理最後一次
    renderLightbox();
    /* 2) 新圖先放在另一側、透明，等載入好再滑進來 */
    img.style.transition = 'none';
    img.style.transform = `translateX(${dir * 28}px)`;
    const slideIn = ()=>{
      if(token !== lbNavToken) return;
      requestAnimationFrame(()=>{
        img.style.transition = 'opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1)';
        img.style.opacity = '';
        img.style.transform = '';
      });
    };
    if(img.complete && img.naturalWidth) slideIn();
    else { img.addEventListener('load', slideIn, {once:true}); img.addEventListener('error', slideIn, {once:true}); }
  }, 170);
  preloadLightboxNeighbors();
}
/* 先在背景下載前一張、後一張大圖，切換時幾乎不用等 */
function preloadLightboxNeighbors(){
  const ch = CHARACTERS.find(c=>c.id===lbState.charId);
  if(!ch || !ch.gallery) return;
  const len = ch.gallery.length;
  [1, -1].forEach(d=>{
    const it = ch.gallery[(lbState.index + d + len) % len];
    const src = it && (it.full || it.image);
    if(src){ const im = new Image(); im.src = largeSrc(src); }
  });
}
function lbKeyHandler(e){
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
}
/* 手機：在燈箱裡左右滑動就能切換上一張／下一張（上下滑或滑動距離太短不算） */
(function initLightboxSwipe(){
  const lb = document.getElementById('lightbox');
  let sx = null, sy = null;
  lb.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1){ sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  lb.addEventListener('touchend', (e)=>{
    if(sx == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) lbNav(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
function renderLightbox(){
  const ch = CHARACTERS.find(c=>c.id===lbState.charId);
  const item = ch.gallery[lbState.index];
  const full = item.full || item.image;
  const img = document.getElementById('lb-img');
  if(full){
    img.style.display='block';
    const large = largeSrc(full);
    if(large !== full) img.dataset.orig = full; else delete img.dataset.orig;
    img.src = large;
  } else {
    img.style.display='none';
  }
  const cap = document.getElementById('lb-cap');
  cap.textContent = `${ch.codename} · IMG_${String(lbState.index+1).padStart(2,'0')}${item.caption ? ' · '+item.caption : ''}  (${lbState.index+1}/${ch.gallery.length})`;

  /* 若無真實圖片，顯示放大版佔位色塊 */
  let ph = document.getElementById('lb-placeholder');
  if(ph) ph.remove();
  if(!full){
    ph = document.createElement('div');
    ph.id='lb-placeholder';
    ph.style.cssText = `width:min(70vw,640px); height:min(70vh,640px); ${placeholderStyle(ch.id+'g'+lbState.index,24,68,84)} display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:14px;`;
    ph.textContent = `IMG_${String(lbState.index+1).padStart(2,'0')} full image not uploaded`;
    img.insertAdjacentElement('afterend', ph);
  }
}
/* ============================================================
   自訂游標：主圓圈緊貼滑鼠，後面拖著一串會漸漸變小、變透明的
   殘影圓圈，製造圓形殘影拖曳感。移到連結上主圓圈會變實心。
============================================================ */
const cursor = document.createElement('div');
cursor.id = 'cursor';
cursor.innerHTML = '<span class="cursor-label">VIEW</span>';
document.body.appendChild(cursor);

/* ---------------- 圖片淡入 ---------------- */
/* img 的 load / error 事件不會冒泡，但在 capture 階段還是會一路往下傳到 document，
   所以在最外層用 capture:true 監聽一次，就能抓到之後任何時間點（包含頁面切換後
   innerHTML 重新產生）新插入的每一張圖片，不用每次 render 都手動重新綁定事件。
   載入完成（或失敗）才把 img-loaded 加上去，讓 CSS 的透明度轉場觸發，
   圖片是「淡入」出現，而不是網路一慢就整張生硬地彈出來。 */
function revealImg(e){
  const el = e.target;
  if(!el || el.tagName !== 'IMG') return;
  if(e.type === 'error'){
    /* 壓縮版圖片讀取失敗：退回原圖再試一次，原圖也失敗才算真的載入失敗 */
    if(el.dataset.orig){
      const orig = el.dataset.orig;
      delete el.dataset.orig;
      el.src = orig;
      return;
    }
    const thumb = el.closest('.gallery-thumb');
    if(thumb) thumb.classList.add('img-error');
  }
  el.classList.add('img-loaded');
}
document.addEventListener('load', revealImg, true);
document.addEventListener('error', revealImg, true);

const TRAIL_COUNT = 2;
const TRAIL_SIZES    = [11, 7];
const TRAIL_OPACITY  = [.38, .22];
const trailDots = Array.from({length:TRAIL_COUNT}, (_, i)=>{
  const d = document.createElement('div');
  d.className = 'cursor-trail';
  d.style.width = d.style.height = TRAIL_SIZES[i]+'px';
  d.style.marginLeft = d.style.marginTop = (-TRAIL_SIZES[i]/2)+'px';
  d.style.opacity = TRAIL_OPACITY[i];
  document.body.appendChild(d);
  return { el:d, x:window.innerWidth/2, y:window.innerHeight/2 };
});

let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let curX = mouseX, curY = mouseY;

const HOVER_SELECTOR = 'a, button, .gallery-thumb, .crumb .seg, .brand';
/* 角色卡片／世界觀卡片：滑過去游標會放大成實心圓，中間浮出「VIEW」字樣，
   跟一般連結的小圓點區分開來，強調「這是可以點進去瀏覽的卡片」 */
const VIEW_SELECTOR = '.arc-card, .world-row';

window.addEventListener('mousemove', (e)=>{
  mouseX = e.clientX; mouseY = e.clientY;
  wakeCursor();
});
/* 滑鼠沒動，但畫面在捲動／換頁（游標底下的東西變了）時也要重新判斷 */
window.addEventListener('scroll', ()=>wakeCursor(), {capture:true, passive:true});
window.addEventListener('wheel', ()=>wakeCursor(), {passive:true});
window.addEventListener('mousedown', ()=>wakeCursor());
window.addEventListener('mouseup', ()=>wakeCursor());
window.addEventListener('hashchange', ()=>wakeCursor());

/* 用 mouseover/mouseout 事件判斷游標該不該變成 hover 樣式，
   在 SPA 換頁（點卡片跳轉、innerHTML 整塊換掉）時會有問題：
   滑鼠正停在卡片上時按下去，卡片所在的 DOM 節點瞬間被移除，
   瀏覽器不一定會補送 mouseout，游標就會卡在放大／VIEW 的狀態出不來。
   改成每一影格用 elementFromPoint 直接重新判斷滑鼠底下現在是什麼元素，
   狀態每一影格都重新算一次，就不會有「卡住忘記還原」的問題。 */
function currentHoverState(){
  const el = document.elementFromPoint(mouseX, mouseY);
  if(!el) return {state:null, target:null};
  const viewEl = el.closest(VIEW_SELECTOR);
  if(viewEl) return {state:'view', target:viewEl};
  if(el.closest(HOVER_SELECTOR)) return {state:'hover', target:null};
  return {state:null, target:null};
}

/* 游標磁吸：滑到卡片（角色卡／世界觀清單列）上時，游標不是單純疊在滑鼠
   正下方，而是朝卡片中心被輕輕吸過去——跟首頁節點圖、Co-creation 清單
   文字同一套「磁吸」手感，讓游標停在卡片上時有種被吸住定住的感覺，
   而不是一個圓圈生硬地蓋在滑鼠上。只在 VIEW 狀態（卡片）發生，一般
   連結的小圓點維持原本緊貼滑鼠。 */
const CURSOR_PULL_STRENGTH = 0.38;

/* 游標動畫只在需要時才跑：滑鼠移動、捲動、換頁時喚醒，
   游標跟殘影都追上滑鼠、而且懸停狀態連續一段時間沒變，就自動暫停，
   不會在滑鼠完全沒動的時候還每秒重算 60 次（筆電比較省電）。 */
let cursorRAF = null;
let cursorIdleFrames = 0;
let lastCursorState = null;
let cursorEasing = false; /* 剛離開卡片時，被磁吸偏掉的位置也要滑順地回到滑鼠上 */
function wakeCursor(){
  cursorIdleFrames = 0;
  if(!cursorRAF) cursorRAF = requestAnimationFrame(cursorLoop);
}
function cursorLoop(){
  const { state, target } = currentHoverState();

  let targetX = mouseX, targetY = mouseY;
  if(state==='view' && target){
    const r = target.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    targetX = mouseX + (cx - mouseX) * CURSOR_PULL_STRENGTH;
    targetY = mouseY + (cy - mouseY) * CURSOR_PULL_STRENGTH;
  }
  /* 主圓圈直接貼在滑鼠位置，不做追趕（追趕會有一點延遲感）；
     只有在卡片上被「磁吸」的時候才滑順地移過去，免得一碰到卡片就瞬間跳位 */
  if(state==='view') cursorEasing = true;
  if(cursorEasing){
    curX += (targetX - curX) * 0.5;
    curY += (targetY - curY) * 0.5;
    if(state!=='view' && Math.abs(targetX - curX) + Math.abs(targetY - curY) < 1) cursorEasing = false;
  }else{
    curX = targetX; curY = targetY;
  }
  cursor.style.transform = `translate(${curX}px, ${curY}px)`;

  cursor.classList.toggle('is-view', state==='view');
  cursor.classList.toggle('is-hover', state==='hover');

  let prevX = curX, prevY = curY;
  let maxGap = Math.abs(targetX - curX) + Math.abs(targetY - curY);
  trailDots.forEach((t, i)=>{
    const lerp = 0.42 - i*0.12; /* 越後面跟得越慢，自然拉開間距 */
    t.x += (prevX - t.x) * lerp;
    t.y += (prevY - t.y) * lerp;
    t.el.style.transform = `translate(${t.x}px, ${t.y}px)`;
    maxGap = Math.max(maxGap, Math.abs(prevX - t.x) + Math.abs(prevY - t.y));
    prevX = t.x; prevY = t.y;
  });

  /* 位置都追上了（差距不到 0.1px）、懸停狀態也沒變，連續 30 影格（約半秒）就暫停 */
  if(maxGap < 0.1 && state === lastCursorState) cursorIdleFrames++;
  else cursorIdleFrames = 0;
  lastCursorState = state;
  if(cursorIdleFrames > 30){ cursorRAF = null; return; }
  cursorRAF = requestAnimationFrame(cursorLoop);
}
wakeCursor();
</script>

        });
      }
