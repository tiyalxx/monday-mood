/* ====================================================
   DESIGN TOKENS
   bg        #FFFFFF  純白主體
   panel     #F6F6F4  淺灰面板（卡片/區塊底）
   line      #E3E3E0  分隔線
   ink       #2A2A2E  主要深灰字
   ink-soft  #6B6B70  次要灰字
   accent    #46545C  霧藍灰（狀態點/強調，極少量使用）
   accent-soft #D8DEE0
==================================================== */
:root{
  --bg:#ffffff;
  --panel:#f6f6f4;
  --panel2:#efefec;
  --line:#e3e3e0;
  --ink:#2a2a2e;
  --ink-soft:#6b6b70;
  --ink-faint:#a9a9ac;
  --accent:#46545c;
  --accent-soft:#d8dee0;
  --brand:#404aff;
  --logo-color:#404aff;
  --font-cjk:'Noto Sans TC', sans-serif;
  --font-disp:'Space Grotesk', 'Noto Sans TC', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --wipe-dur: 620ms;
  --wipe-default:#2a2a2e; /* 換頁色塊沒有對應世界觀顏色時的預設深色，固定不隨 body 的世界觀主題變動 */
  --radius:10px;
  --radius-sm:6px;
}

/* 黑手黨世界觀專屬紅黑配色：進到 MAFIA 底下的頁面時，body 會加上這個 class，
   透過重新定義同一套 CSS 變數，整個頁面自動變成紅黑主題，離開後恢復原本白色系 */
body.theme-mafia{
  --bg:#100d0d;
  --panel:#1c1414;
  --panel2:#221818;
  --line:#3a1e20;
  --ink:#f3e9e7;
  --ink-soft:#b98a8c;
  --ink-faint:#7a5456;
  --accent:#e0293e;
  --accent-soft:#5c1f26;
  --brand:#e0293e;
  --logo-color:#e0293e;
}

/* 古風世界觀專屬配色：進到 ANCIENT 底下的頁面時，body 會加上這個 class */
body.theme-ancient{
  --bg:#808f7c;
  --panel:#76846f;
  --panel2:#6d7b67;
  --line:#96a290;
  --ink:#ffffff;
  --ink-soft:#e5e9e2;
  --ink-faint:#c1cabc;
  --accent:#ffffff;
  --accent-soft:#9aa696;
  --brand:#ffffff;
  --logo-color:#808f7c;
}

/* 西方奇幻世界觀專屬配色：白底，強調色換成霧紫色 */
body.theme-fantasy{
  --accent:#72636e;
  --accent-soft:#e6e3e5;
  --brand:#72636e;
  --logo-color:#72636e;
}

/* 足球世界觀專屬配色：白底，強調色換成草地綠 */
body.theme-football{
  --accent:#619e69;
  --accent-soft:#e3eee4;
  --brand:#619e69;
  --logo-color:#619e69;
}

/* 西方古典世界觀專屬配色：淺灰紫底，強調色換成暗酒紅 */
body.theme-victorian{
  --bg:#edebed;
  --panel:#e5e3e5;
  --panel2:#dfdddf;
  --line:#d5d4d5;
  --accent:#60373e;
  --accent-soft:#d4cbce;
  --brand:#60373e;
  --logo-color:#60373e;
}

/* 英雄世界觀專屬配色：白底，強調色換成琥珀金（原本沒有獨立配色，
   跟其他世界觀共用預設藍色，現在補上屬於自己的顏色） */
body.theme-hero{
  --accent:#c6811f;
  --accent-soft:#f1e3cc;
  --brand:#c6811f;
  --logo-color:#c6811f;
}

/* 其他／未分類世界觀：白底，強調色換成低調石板藍灰，當作「其餘」的中性色 */
body.theme-other{
  --accent:#5b6472;
  --accent-soft:#dfe2e6;
  --brand:#5b6472;
  --logo-color:#5b6472;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-cjk);
  font-weight:400;
  letter-spacing:.01em;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background-color .5s ease, color .5s ease;
}
/* faint dot-grid texture, near-future terminal feel */
body::before{
  content:'';
  position:fixed; inset:0;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--accent-soft);}

@media (prefers-reduced-motion: reduce){
  *:not(.pf-avatar-circle):not(.pf-reveal):not(.node-circle):not(.node-svg line):not(#wipe):not(#wipe-bg):not(#wipe-label):not(.wl-ch){
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px clamp(20px,4vw,56px);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  transition:opacity .4s ease;
  /* 導覽列的背景永遠是白色霧面，不管底下的頁面套用哪個世界觀主題，
     所以這裡把顏色變數重新鎖定回預設值，避免文字/Logo 因為主題變成白色系而看不見 */
  --bg:#ffffff;
  --panel:#f6f6f4;
  --panel2:#efefec;
  --line:#e3e3e0;
  --ink:#2a2a2e;
  --ink-soft:#6b6b70;
  --ink-faint:#a9a9ac;
  --brand:#404aff;
}
/* 進站首頁（gate）不要有導覽列，之前只把它變透明（opacity:0），
   但 sticky 定位的元素就算看不見還是會在版面裡佔住原本的高度，
   等於整頁內容都被往下擠了快 90px——這是手機上「捲到最後才看得到
   LOGO」的真正原因。改成 position:fixed 把它整個移出正常版面流，
   才不會偷偷佔位。 */
body.is-gate .topbar{opacity:0; pointer-events:none; position:fixed;}
body.is-gate footer{display:none;}
body.is-gate{overflow-x:hidden;}
/* 導覽列收合成選單：視窗變窄到放不下「← Back / Index / Random / About」
   這一整排的時候（縮放視窗過程中最容易看到字擠在一起、換行換得很醜的
   就是這個中間地帶），不要讓它們硬擠成好幾行，改成收進一個漢堡選單按鈕，
   點開再用下拉的方式一條一條列出來，麵包屑單獨留在下面一行 */
.nav-burger{
  display:none;
  width:32px; height:32px; flex:none;
  align-items:center; justify-content:center; flex-direction:column; gap:5px;
  background:none; border:none; padding:0; cursor:pointer;
}
.nav-burger span{
  display:block; width:19px; height:1.5px; background:var(--ink-soft);
  transition:transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
}
.nav-burger.open span:nth-child(1){ transform:translateY(6.5px) rotate(45deg); }
.nav-burger.open span:nth-child(2){ opacity:0; }
.nav-burger.open span:nth-child(3){ transform:translateY(-6.5px) rotate(-45deg); }

@media (max-width:860px){
  /* .topbar-right 在這個寬度下不當容器（display:contents），裡面的漢堡按鈕、
     麵包屑直接變成 .topbar 的排版項目：第一行＝Logo（左）＋漢堡按鈕（右），
     第二行＝麵包屑。選單卡片從右上角的漢堡按鈕正下方展開，
     按鈕在哪邊、選單就在哪邊，不會「按左邊、跳右邊」 */
  .topbar{ flex-wrap:wrap; align-items:center; row-gap:6px; padding:12px 20px; }
  .topbar .topbar-right{ display:contents; }
  .nav-burger{ display:flex; order:1; margin-left:auto; margin-right:-6px; }
  /* 第二行：← Back 在左、麵包屑接在後面。Back 放在選單外面——它是「回上一層」
     的動作，不是選單項目，要隨時按得到。.topbar::after 是一個高度 0、佔滿整行的
     隱形項目，用來把第一行（Logo＋漢堡）跟第二行隔開 */
  .topbar{ row-gap:0; }
  .topbar::after{ content:''; order:2; flex:0 0 100%; height:0; }
  .back-btn{ order:3; flex:none; margin:0 4px -8px -8px; padding:8px 12px 8px 8px; border-right:none; font-size:11px; } /* 字的位置不變，只把可以點的範圍往四周放大，手指比較好按 */
  .crumb{ order:4; flex:1 1 0; min-width:0; margin-top:8px; width:auto; }
  /* 平常橫排的那一排連結，收合狀態下變成貼在漢堡按鈕下方的卡片選單，
     預設不顯示，點漢堡按鈕才用 .open 切出來（JS 控制） */
  .topbar .nav-links{
    display:none;
    position:absolute; top:calc(100% + 6px); right:20px;
    flex-direction:column; align-items:stretch; gap:2px;
    min-width:200px;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 22px 48px rgba(42,42,46,.16);
    padding:8px; z-index:70;
  }
  .topbar .nav-links.open{ display:flex; }
  /* 選單項目：不用分隔線，統一成滿版、左對齊的一列，滑過去用淡淡的底色提示 */
  .nav-links .about-link, .nav-links .nav-index .index-link{
    display:block; width:100%; box-sizing:border-box; text-align:left;
    padding:11px 12px; font-size:13px; border-radius:8px;
    border:none !important;
  }
  .nav-links .about-link:hover, .nav-links .nav-index .index-link:hover{ background:var(--panel); }
  .nav-links .nav-index{ display:block; border:none; padding:0; }
  /* 世界觀清單（原本桌機版是滑過去才浮出來的卡片）收合狀態下改成直接往下
     展開成選單裡的一個子區塊，不要再疊成一張浮動在外面的卡片 */
  .nav-links .index-dropdown{
    position:static; opacity:1; transform:none; pointer-events:auto;
    padding-top:0; display:none;
    --dd-x:0px; /* 收在漢堡選單裡時不用置中位移（見下方 max-width:640px 那段），不然會往左歪出選單外 */
  }
  .nav-links .nav-index.open .index-dropdown{ display:block; }
  .nav-links .index-dropdown-card{
    box-shadow:none; border:none; border-radius:0; padding:4px 10px 10px;
    flex-direction:column; gap:14px;
  }
  .crumb{
    justify-content:flex-start;
    overflow-x:auto; white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    font-size:11px;
  }
  .crumb .seg, .crumb .sep{white-space:nowrap; flex:none;}
  /* 麵包屑太長、左邊被捲出去的時候，左側淡出，看得出還有前面的層級，不是字被切斷 */
  .crumb.is-scrolled{ -webkit-mask-image:linear-gradient(90deg, transparent, #000 28px); mask-image:linear-gradient(90deg, transparent, #000 28px); }
}
@media (max-width:640px){
  .topbar{ padding:9px 18px; }
  .topbar .nav-links{ right:18px; }
  .brand small{display:none;}
  .brand-logo{height:14px;}
}

/* ================= GATE / 首頁入口 ================= */
.gate{
  position:relative; z-index:5;
  color:var(--ink);
  overflow-x:hidden;
  /* #app 平常有 max-width + 左右內距，這裡用滿版技巧讓入口頁還是
     整個畫面滿版（跟改版前一樣），不被 #app 的排版限制縮在中間一小條 */
  width:100vw;
  margin-left:calc(50% - 50vw);
}
/* 固定在畫面最底層的圖層：裡面疊放著一張張作品大圖（.gate-photo-layer），
   往下捲動時 JS 會即時算出每張圖的透明度，讓畫面「捲一捲淡出隨機的完稿大圖」，
   跟上面的內容（第一屏文字等）各自獨立捲動 */
#gate-bg-fixed{
  position:fixed; inset:0; z-index:0;
  background:var(--bg);
  overflow:hidden;
}
.gate-scene{position:relative; z-index:2;}
/* 往下捲時第一屏整個慢慢淡出（白底、ENTER、LOGO 一起），底下固定的大圖接著淡入，
   不會再出現「白底在 LOGO 下面一刀切斷、大圖從下面冒出來」的硬邊。
   ENTER 同時以比較慢的速度往下沉（視差），有種退到後面去的層次感。
   --p 是第一屏捲了多少（0～1），由 updateGateScroll() 即時更新；
   用 translate/scale 屬性而不是 transform，才不會跟 LOGO 原本的進場動畫打架。 */
.gate-scene-hero{ opacity:calc(1 - clamp(0, (var(--p, 0) - .12) / .62, 1)); }
/* 第一屏的白底在最下緣漸層變透明，跟底下大圖之間不會有一條橫線（只在開始捲動之後才套用，免得一進站 LOGO 下緣被淡掉） */
.gate-scene-hero.is-scrolling .gate-media{ -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
.gate-scene-hero .gate-center{ translate:0 calc(var(--p, 0) * 24vh); }
.gate-scene-hero .gate-bottom-logo{ scale:calc(1 - var(--p, 0) * .06); transform-origin:50% 100%; } /* LOGO 不往下移（會被第一屏的邊界切掉），只微微縮小、跟著淡出 */
.gate-scene-hero{
  min-height:100vh;
  /* 手機瀏覽器（Safari、LINE 內建瀏覽器）的 100vh 是「網址列收起來時」的高度，
     比剛打開時實際看得到的畫面高，底部 LOGO 就會被擠到畫面外；svh 是網址列
     還在時的可見高度，支援的瀏覽器會用這個，不支援的照舊用上面的 100vh */
  min-height:100svh;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.gate-media{position:absolute; inset:0; overflow:hidden;}
.gate-media video, .gate-media .gate-fallback{
  width:100%; height:100%; object-fit:cover; display:block;
}
.gate-media .gate-fallback{
  background:
    radial-gradient(circle at 30% 18%, #ffffff, transparent 60%),
    linear-gradient(160deg,#ffffff,#f2f2ef 55%,#ffffff);
  position:relative; overflow:hidden;
}
/* 淺灰點狀紋理，與全站底色的質感呼應 */
.gate-fallback::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.6;
}
.gate-media::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.5) 78%, rgba(255,255,255,.82));
}
.gate-center{
  position:relative; z-index:2;
  flex:1; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:44px;
  padding:24px;
}
.gate-bottom-logo{
  position:relative; z-index:1;
  width:90%; margin:0 auto; line-height:0; overflow:hidden;
  padding-bottom:22px;
  animation:logoReveal 1.5s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes logoReveal{
  from{ opacity:0; filter:blur(22px); transform:translateY(30px) scale(.96); }
  to  { opacity:1; filter:blur(0); transform:translateY(0) scale(1); }
}
.gate-bottom-logo svg{
  display:block;
  width:100%;
}
/* 手機螢幕比較矮，第一屏內容（引言卡片＋ENTER＋底部大LOGO）原本的間距
   在小螢幕上會整個超出一個畫面高度，導致 LOGO 被擠到螢幕外、要先往下滑
   才看得到。這裡把手機版的間距、字級、LOGO 尺寸都縮小一點，
   讓整組內容確實收在第一屏以內，不用滑動就能看到完整 LOGO。 */
@media (max-width:640px){
  .gate-center{ gap:20px; padding:16px 20px 10px; }
  .gate-enter{ padding:10px 24px; font-size:12px; }
  /* 手機版 LOGO 撐滿整個寬度，左右只留一點點邊 */
  .gate-bottom-logo{ width:auto; margin:0 12px; padding-bottom:16px; }
}
@media (max-height:700px) and (max-width:640px){
  .gate-center{ gap:12px; padding:10px 20px 6px; }
}

/* 提醒訪客這頁可以捲動的小提示，固定在左下角（避開底部的 logo 圖案），
   一開始滾動就淡出，跟右下角的常駐 ENTER 按鈕左右呼應 */
.gate-scroll-hint{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; color:var(--ink-faint);
  animation:gateHintBob 1.8s ease-in-out infinite;
  transition:opacity .3s ease;
}
.gate-scroll-hint span:last-child{font-size:13px;}
.gate-scroll-hint.hide{opacity:0;}
@keyframes gateHintBob{
  0%,100%{ transform:translate(0,0); }
  50%{ transform:translate(0,7px); }
}
/* 第一屏的雜誌式小資訊：左上角刊頭、LOGO 正上方一排（角色數／捲動提示／今天日期） */
.gate-corner-tl{
  position:absolute; top:32px; left:clamp(20px,4vw,56px); z-index:2;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.18em; color:var(--ink-soft);
}
.gate-corner-tl b{ font-weight:400; color:var(--brand); }
.gate-meta{
  position:relative; z-index:2; width:90%; margin:0 auto 10px;
  display:flex; justify-content:space-between; align-items:flex-end;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; color:var(--ink-soft);
}
.gate-meta > span:first-child, .gate-meta > span:last-child{ flex:1; }
.gate-meta > span:last-child{ text-align:right; }
.gate-meta b{ font-weight:400; color:var(--ink); }
@media (max-width:640px){
  .gate-corner-tl{ top:30px; left:16px; font-size:9.5px; letter-spacing:.14em; }
  .gate-meta{ width:auto; margin:0 12px 8px; font-size:9px; letter-spacing:.1em; }
}

/* 第一屏捲完之後，直接淡出淡入一張張滿版的完稿大圖（不會先變藍色），
   每張圖各佔一個畫面高度的捲動距離，捲到誰、誰就淡入蓋滿整個畫面，
   捲過去之後換下一張淡入、上一張淡出，是疊在 #gate-bg-fixed 裡的固定圖層，
   彼此用 opacity 交叉淡化，不是卡片、不會滑動位移。 */
.gate-scene-photos{position:relative;}
.gate-photo-layer{
  position:absolute; inset:0;
  background-image:var(--img-d);
  background-size:cover; background-position:center;
  opacity:0; will-change:opacity;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:4vh;
}
/* 直的畫面（手機）：有另外上傳手機版直圖就用直圖，沒有的話照舊用電腦版的圖裁切 */
@media (max-aspect-ratio:1/1){
  .gate-photo-layer{ background-image:var(--img-m, var(--img-d)); }
}
.gate-photo-layer{ will-change:opacity; } /* 不加 will-change:transform：加了瀏覽器會沿用放大前的點陣圖，推近結束後圖會糊糊的 */
/* 大圖的說明＋頁碼：固定在畫面上，跟著目前看到的那張圖切換（不跟著捲動） */
#gate-photo-ui{
  position:fixed; inset:0; z-index:7; pointer-events:none;
  opacity:0; transition:opacity .4s ease;
}
#gate-photo-ui.show{ opacity:1; }
.gate-cap{
  position:absolute; left:clamp(20px,4vw,56px); bottom:clamp(22px,5vh,48px); max-width:min(46vw, 420px);
  color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.45); text-decoration:none; pointer-events:auto;
  transition:opacity .35s ease, transform .35s ease;
}
.gate-cap.swap{ opacity:0; transform:translateY(6px); }
.gate-cap-no{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2em; opacity:.8; margin-bottom:6px; }
.gate-cap-text{ font-family:var(--font-cjk); font-size:15px; line-height:1.5; }
a.gate-cap .gate-cap-text::after{ content:' →'; font-family:var(--font-mono); opacity:.75; }
a.gate-cap:hover .gate-cap-text{ text-decoration:underline; text-underline-offset:4px; }
.gate-count{
  position:absolute; right:clamp(20px,4vw,56px); top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.4);
}
.gate-count i{ display:block; width:1px; height:56px; background:rgba(255,255,255,.35); position:relative; overflow:hidden; }
.gate-count i::after{ content:''; position:absolute; left:0; right:0; top:0; height:var(--fill, 0%); background:#fff; transition:height .3s ease; }
@media (max-width:640px){
  .gate-cap{ max-width:62vw; bottom:calc(16% + 70px); }
  .gate-cap-text{ font-size:13.5px; }
  .gate-count{ right:14px; }
  .gate-count i{ height:40px; }
}
.gate-photo-layer.is-placeholder{
  background-image:linear-gradient(155deg, var(--ph-a), var(--ph-b));
}
.gate-photo-caption{
  /* 故意貼在畫面偏下的位置，避開正中央的 ENTER 按鈕（正式圖片上線後就不會有這行字了） */
  font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; color:rgba(255,255,255,.75);
  border:1px dashed rgba(255,255,255,.42); padding:10px 20px; border-radius:999px;
}

/* 捲離第一屏之後，右下角常駐一顆小的 ENTER，讓整個捲動過程隨時可以進站 */
.gate-fixed-enter{
  position:fixed; left:50%; bottom:16%; z-index:8;
  transform:translateX(-50%) scale(.96);
  display:inline-flex; align-items:center; gap:12px;
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,.55); border-radius:999px;
  color:#fff; padding:15px 34px; font-family:var(--font-mono); font-size:13px; letter-spacing:.08em;
  opacity:0; pointer-events:none;
  transition:opacity .35s ease, transform .35s ease, background .2s ease;
  box-shadow:0 20px 44px rgba(10,10,30,.22);
}
.gate-fixed-enter.show{opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto;}
.gate-fixed-enter:hover{background:rgba(255,255,255,.28);}
@media (max-width:640px){
  .gate-fixed-enter{padding:13px 28px;}
}

/* 首頁角色縮圖預覽（moodboard 風格，仿 offforum：小尺寸、間距寬鬆）。
   只會有 8 張縮圖（在 JS 端就已經裁到 8 張），所以這裡不需要用固定高度＋overflow 去裁切，
   直接讓 grid 自然換行就好：桌機 8 欄一排、手機（<=820px）4 欄兩排。 */
.gate-thumbs{
  display:grid; grid-template-columns:repeat(8, 48px);
  gap:22px 30px; margin-bottom:40px;
  justify-content:center;
}
.thumb-tile{
  width:48px; aspect-ratio:1/1; overflow:hidden; position:relative;
  background:var(--panel2);
  border-radius:var(--radius-sm);
}
.thumb-tile img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(55%) blur(1px) brightness(1.02);
  transform:scale(1);
  transition:filter .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
}
.thumb-tile:hover img{
  filter:grayscale(0%) blur(0) brightness(1);
  transform:scale(1.09);
}
@media (max-width:820px){
  .gate-thumbs{
    grid-template-columns:repeat(4, 48px); gap:16px;
  }
}

.gate-sub{
  font-size:14.5px; color:var(--ink-soft); max-width:38ch; margin:0 0 40px;
}
.gate-enter{
  display:inline-flex; align-items:center; gap:14px;
  background:transparent; border:1px solid var(--ink);
  border-radius:999px;
  color:var(--ink); padding:14px 32px; font-family:var(--font-mono); font-size:13px; letter-spacing:.08em;
  position:relative; overflow:hidden; isolation:isolate;
  transition:color .35s ease .05s;
}
/* 滑過去：底色由左往右刷滿（跟換頁的掃色轉場同一種手法），箭頭往右滑一下 */
.gate-enter::before{
  content:''; position:absolute; inset:0; z-index:-1; background:var(--ink);
  transform:scaleX(0); transform-origin:left center;
  transition:transform .45s cubic-bezier(.76,0,.24,1);
}
.gate-enter span{ display:inline-block; transition:transform .45s cubic-bezier(.76,0,.24,1); }
.gate-enter:hover{ color:#fff; }
.gate-enter:hover::before{ transform:scaleX(1); }
.gate-enter:hover span{ transform:translateX(5px); }

.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-disp);
  font-size:16px; font-weight:600;
  letter-spacing:.04em;
  color:var(--brand);
  cursor:pointer;
}
.brand-logo{
  height:18px; width:auto; display:block;
}
.logo-mark path, .logo-mark rect{
  fill:var(--logo-color);
  transition:fill .25s ease;
}
.brand:hover .logo-mark path, .brand:hover .logo-mark rect{
  fill:var(--ink);
}
.gate-bottom-logo:hover .logo-mark path, .gate-bottom-logo:hover .logo-mark rect{
  fill:var(--ink);
}
.brand small{
  font-family:var(--font-mono);
  font-size:11px; color:var(--ink-soft); font-weight:400;
}
.crumb{
  font-family:var(--font-mono);
  font-size:12.5px; color:var(--ink-soft);
  display:flex; align-items:center; gap:8px;
}
.crumb .seg{cursor:pointer;}
.crumb .seg:hover{color:var(--ink);}
.crumb .sep{color:var(--ink-faint);}

.topbar-right{
  display:flex; align-items:center; gap:22px;
  min-width:0; flex:1 1 auto; justify-content:flex-end; margin-left:24px;
}
/* 視窗縮小時導覽列的字不要換行（不然會變成上下兩行、歪七扭八），
   空間不夠時由麵包屑讓位：它會縮短，左邊被擠掉的部分淡出、可以左右滑 */
.topbar .brand, .back-btn, .nav-links > *, .crumb .seg, .crumb .sep{ white-space:nowrap; flex:none; }
@media (min-width:861px){ .topbar .crumb{ min-width:0; flex:0 1 auto; overflow-x:auto; } }
.topbar .crumb{ scrollbar-width:none; }
.topbar .crumb::-webkit-scrollbar{ display:none; }
.crumb.is-scrolled{ -webkit-mask-image:linear-gradient(90deg, transparent, #000 28px); mask-image:linear-gradient(90deg, transparent, #000 28px); }
@media (max-width:1240px){ .brand small{ display:none; } }
.nav-links{
  display:flex; align-items:center; gap:22px;
}
.about-link{
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--ink-soft);
  padding-right:20px; border-right:1px solid var(--line);
  transition:color .2s ease;
}
.about-link:hover{color:var(--ink);}

/* Index 導覽：滑鼠移過去會出現下拉選單，列出所有分類（世界觀／企劃底下每個世界），
   這樣瀏覽的時候可以直接跳到別的分類，不用一直按「上一頁」回去 */
.nav-index{
  position:relative;
  padding-right:20px; border-right:1px solid var(--line);
}
.index-link{
  /* 這裡故意不用 display:inline-flex——那會讓瀏覽器用另一套「置中」演算法
     計算文字的垂直位置，跟旁邊 Back／About／Home 這些普通文字的置中方式
     不一樣，兩者的文字基準線會對不齊，看起來「Index」會比其他幾個字往下偏一點。
     改成跟其他導覽文字一樣的普通行內文字，箭頭符號用 vertical-align 微調位置，
     這樣文字基準線才會跟其他項目對齊。 */
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--ink-soft);
  transition:color .2s ease;
}
.index-link::after{
  content:'▾'; font-size:9px; opacity:.7;
  display:inline-block; margin-left:4px; vertical-align:1px;
}
.nav-index:hover .index-link, .nav-index.open .index-link{color:var(--ink);}
.index-dropdown{
  position:absolute; top:100%; left:0;
  /* 這裡故意用 padding-top 而不是 margin-top 留出跟連結之間的空隙：
     margin 不算在這個元素的範圍內，滑鼠從「Index」文字往下移到選單的
     這段空隙路上，等於暫時離開了 .nav-index／.index-dropdown 的範圍，
     :hover 就會斷掉，選單也就跟著收起來，根本來不及移到選單上。
     改成 padding-top，這段空隙本身還是算在 .index-dropdown 的範圍裡，
     滑鼠全程都在「可以觸發 hover」的區域內移動，選單才不會提早收回去。
     --dd-x 是水平位移量，桌面版不用位移（0px），手機版會在下面的
     media query 改成 -50%，讓選單以「Index」文字為中心左右置中展開，
     這裡用 CSS 變數是因為淡入動畫也會動到 transform，兩處都要套用
     同一個水平位移，不然選單一展開位置就會跳掉。 */
  --dd-x:0px;
  padding-top:16px;
  opacity:0; transform:translate(var(--dd-x), -6px);
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:80;
}
.nav-index:hover .index-dropdown, .nav-index.open .index-dropdown{
  opacity:1; transform:translate(var(--dd-x), 0); pointer-events:auto;
}
.index-dropdown-card{
  background:var(--bg); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:0 22px 48px rgba(42,42,46,.14);
  padding:20px 24px; display:flex; gap:36px;
  white-space:nowrap;
}
.index-dd-label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--ink-faint);
  margin-bottom:10px;
}
.index-dd-col a{
  display:block; font-size:13px; color:var(--ink); padding:5px 0;
  transition:color .2s ease;
}
.index-dd-col a:hover{color:var(--brand);}
.index-dd-soon{
  display:block; font-size:13px; color:var(--ink-faint); padding:5px 0; cursor:default;
}
.index-dd-soon small{
  font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; margin-left:8px;
}
@media (max-width:640px){
  .nav-index{padding-right:0; border-right:none;}
  /* 手機上「Index」這個字通常在畫面偏左的位置，如果選單用 right:0 對齊，
     選單本身的寬度會往左邊撐出螢幕外，變成只看得到右邊一小截、
     左邊被切掉看不到——改成以觸發文字為中心左右置中展開，
     並限制最大寬度不超過螢幕，兩欄選單才不會超出畫面。 */
  .index-dropdown{
    left:50%; right:auto; --dd-x:-50%;
    max-width:calc(100vw - 32px);
  }
  .index-dropdown-card{
    gap:20px; padding:18px 20px;
  }
}

/* 首頁入口（ENTER 那頁）平常是把整個導覽列藏起來的，
   但 About 還是要能點到，所以另外放一個獨立的連結在右上角 */
.gate-about{
  position:fixed; top:26px; right:clamp(20px,4vw,56px); z-index:9;
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.05em;
  color:var(--ink-soft);
  background:rgba(255,255,255,.72); backdrop-filter:blur(6px);
  padding:6px 12px; border-radius:999px;
  transition:color .2s ease, background .2s ease;
}
.gate-about:hover{color:var(--ink);}

/* 上一頁按鈕：除了首頁，每個頁面都會出現，回到麵包屑上一層 */
.back-btn{
  display:none;
  align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--ink-soft); background:none; border:none; cursor:pointer;
  padding-right:20px; border-right:1px solid var(--line);
  transition:color .2s ease;
}
.back-btn:hover{color:var(--ink);}

/* 角色頁往下捲動時出現的「回到最頂」按鈕 */
.to-top-btn{
  position:fixed; right:24px; bottom:24px; z-index:60;
  width:44px; height:44px; border-radius:50%;
  background:var(--brand); color:#fff; border:none; cursor:pointer;
  font-family:var(--font-mono); font-size:17px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:translateY(12px); pointer-events:none;
  transition:opacity .3s ease, transform .3s ease, background .2s ease;
  box-shadow:0 10px 26px rgba(30,30,34,.24);
}
.to-top-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
.to-top-btn:hover{filter:brightness(1.1);}
@media (max-width:640px){
  .to-top-btn{right:16px; bottom:16px; width:40px; height:40px; font-size:15px;}
}

/* ---------------- app / view container ---------------- */
#app{
  position:relative; z-index:1;
  max-width:1180px; margin:0 auto;
  padding:0 clamp(20px,4vw,56px) 120px;
  min-height:70vh;
}
.view{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------------- wipe transition overlay ----------------
   #wipe 本身只是個不會動的容器；真正掃過去的色塊是裡面的 #wipe-bg，
   文字另外放在 #wipe-label，兩個是平輩、不是 #wipe-bg 的子元素，
   這樣文字才不會跟著色塊一起被 scaleX 擠壓變形。色塊顏色改成讀
   --wipe-color 這個 CSS 變數，由 JS 依照「要去的頁面」設定成該
   世界觀的代表色（例如要進 mafia 就先掃一塊紅色），沒有對應世界觀
   的頁面（首頁、Index、About...）就退回原本的 --ink 深色。
   文字改成置中、一個字一個字浮現（.wl-ch），比原本躺在左下角的
   小字更像是轉場的視覺焦點。 */
#wipe{
  position:fixed; inset:0; z-index:100;
  pointer-events:none;
}
#wipe-bg{
  position:absolute; inset:0;
  transform:scaleX(0);
  transform-origin:left;
  background:var(--wipe-color, var(--wipe-default));
}
#wipe.run #wipe-bg{
  animation:wipeSweep var(--wipe-dur) cubic-bezier(.77,0,.18,1) forwards;
}
#wipe-label{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:var(--font-mono); font-size:13px; letter-spacing:.24em;
  color:#fff; white-space:nowrap;
}
#wipe-label .wl-ch{
  display:inline-block;
  opacity:0; transform:translateY(14px);
  transition:opacity .38s ease, transform .5s cubic-bezier(.2,.8,.2,1);
}
#wipe.label-in #wipe-label .wl-ch{ opacity:1; transform:translateY(0); }
#wipe.label-out #wipe-label .wl-ch{
  opacity:0; transform:translateY(-10px);
  transition:opacity .25s ease, transform .3s ease;
  transition-delay:0ms !important;
}
@keyframes wipeSweep{
  0%{transform:scaleX(0); transform-origin:left;}
  48%{transform:scaleX(1); transform-origin:left;}
  52%{transform:scaleX(1); transform-origin:right;}
  100%{transform:scaleX(0); transform-origin:right;}
}

/* 換頁之後，新頁面的內容不是整塊瞬間出現，而是依序一個一個浮現
   （JS 的 initPageEnterStagger() 會幫新頁面裡每個區塊/每張卡片
   標上 --enter-i 當作第幾個，數字越大延遲越晚出現）。角色頁本身
   已經有自己捲動淡入的節奏（.pf-reveal），所以不會重複套用這層。 */
.view.enter-stagger .enter-stagger-item{
  opacity:0; transform:translateY(16px);
  transition:none; /* 先瞬間變透明，不要被這個元素自己原本就有的 opacity transition
                       （例如 .world-row 的 hover 變暗效果）捲進去，從 1 淡到 0 再淡回 1，
                       結果看起來就像完全沒動。淡入動畫只在下面 .enter-run 那段發生。 */
}
.view.enter-stagger.enter-run .enter-stagger-item{
  opacity:1; transform:translateY(0);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--enter-i,0) * 45ms);
}


/* ================= 世界觀關係圖 ================= */
/* class 名稱一律用 rg- 開頭：共構選單的世界觀清單已經用了 wr- 開頭（例如 .wr-name），
   兩邊共用名稱的話樣式會互相套到（之前 MAFIA 字樣發光就是這個原因） */
.rg-legend{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; margin:-6px 0 6px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--ink-faint);
}
.rg-legend span{ display:inline-flex; align-items:center; gap:8px; }
.rg-key{ display:inline-block; width:20px; height:0; border-top:1px solid var(--ink-faint); }
.rg-key.is-love{ border-top-color:var(--brand); }
.rg-key.is-family{ border-top-style:dashed; }
.rg-key-node{ display:inline-block; width:8px; height:8px; border-radius:50%; border:1px solid var(--ink-soft); }
.rg-hint{ margin-left:auto; }
.rg-stage{ position:relative; max-width:100%; margin:0 auto 48px; }
.rg-lines{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
.rg-ring{ fill:none; stroke:var(--line); stroke-width:1; }
.rg-edge{
  fill:none; stroke:var(--ink-faint); stroke-width:1; opacity:0;
  transition:opacity .3s ease, stroke-width .3s ease;
}
.rg-edge.is-love{ stroke:var(--brand); }
.rg-edge.is-family{ stroke-dasharray:3 4; }
.rg-stage.is-ready .rg-edge{ opacity:.28; transition:opacity 1.2s ease .4s; }
.rg-stage.is-ready .rg-edge.is-love{ opacity:.6; }
.rg-stage.is-ready.has-focus .rg-edge{ opacity:.04; transition:opacity .3s ease; }
.rg-stage.is-ready.has-focus .rg-edge.is-on{ opacity:.95; stroke-width:1.5; }
.rg-node{
  position:absolute; z-index:2; width:var(--s); height:var(--s); margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  opacity:0; transition:opacity .6s ease var(--d, 0ms);
}
.rg-stage.is-ready .rg-node{ opacity:1; }
.rg-node::before{ content:''; position:absolute; inset:-8px; border-radius:50%; } /* 隱形的放大點擊範圍：手機上頭像很小，手指比較好點到 */
.rg-avatar{
  width:100%; height:100%; border-radius:50%; overflow:hidden; display:block; position:relative;
  background:var(--panel); box-shadow:0 0 0 2px var(--bg);
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
}
.rg-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.rg-avatar .avatar-fill{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; }
.rg-node.is-external .rg-avatar{ background:var(--bg); box-shadow:none; border:1px solid var(--ink-soft); }
.rg-label{
  position:absolute; z-index:3; pointer-events:none;
  display:flex; flex-direction:column; gap:2px; white-space:nowrap;
  font-size:11px; line-height:1.3; letter-spacing:.04em; color:var(--ink-soft);
  opacity:0; transition:opacity .6s ease var(--d, 0ms), color .3s ease;
}
.rg-label.is-left{ align-items:flex-end; text-align:right; }
.rg-label.is-mid{ align-items:center; text-align:center; }
.rg-stage.is-ready .rg-label{ opacity:1; }
.rg-label.is-external{ color:var(--ink-faint); }
.rg-tag{ display:none; font-size:10px; color:var(--brand); letter-spacing:.02em; }
.rg-label.is-near .rg-tag{ display:block; }
.rg-stage.is-ready.has-focus .rg-node, .rg-stage.is-ready.has-focus .rg-label{ opacity:.15; transition:opacity .3s ease, color .3s ease; }
.rg-stage.is-ready.has-focus .rg-node.is-near, .rg-stage.is-ready.has-focus .rg-label.is-near{ opacity:1; }
.rg-label.is-near{ color:var(--ink); }
.rg-label.is-focus{ color:var(--brand); font-weight:600; }
.rg-node.is-focus{ z-index:4; }
.rg-node.is-focus .rg-avatar{ transform:scale(1.15); box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--brand); }
@media (max-width:640px){
  .rg-hint{ margin-left:0; width:100%; }
  .rg-label{ font-size:9.5px; letter-spacing:.02em; }
  .rg-tag{ font-size:9px; }
}
@media (prefers-reduced-motion: reduce){
  .rg-edge, .rg-node, .rg-label{ transition:none !important; }
}

/* ================= INDEX：兩個漂浮節點 ================= */
.node-view{
  min-height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0; position:relative;
}
.node-field{
  position:relative; width:100%; z-index:1;
  height:min(58vh, 520px);
}
.node-svg{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none;
  overflow:visible;
}
.node-svg .line-base{
  stroke:var(--line); stroke-width:1.4;
}
/* 連接線上「流動的能量」：不是疊一條固定顏色的線，而是一段段虛線＋模糊，
   靠 stroke-dashoffset 每一影格往同一方向推進，看起來像一段段光在線上
   持續往返流動（dasharray 的「虛線段」比「間隔」短很多，視覺上就是一小段
   一小段的光點在跑，不是規則的鐵路虛線）。平常就有、很淡，hover 時變亮、
   流動速度也跟著加快，給出「被喚醒」的感覺。 */
.node-svg .line-glow{
  stroke:var(--brand); stroke-width:2.2;
  stroke-linecap:round;
  stroke-dasharray:1 13;
  opacity:.4;
  filter:blur(1px);
}
.node-circle{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(96px,10vw,124px);
  aspect-ratio:1/1; border-radius:50%;
  border:1px solid var(--brand);
  background:var(--bg);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-disp); font-weight:600; font-size:13px; letter-spacing:.06em;
  color:var(--brand);
  transition:background .3s ease, color .3s ease;
  will-change:left, top, transform, opacity;
}
.node-circle:hover{background:var(--brand); color:#fff;}
/* 節點背後的呼吸光暈：用 ::before 疊一層模糊的放射狀漸層，inset 是負值讓光暈範圍
   明顯大於圓圈本身，漸層本身在 70% 就已經淡到全透明、外面還有一圈 blur 繼續柔化，
   確保光暈是自然散開、完全不會被任何邊界硬切掉（之前背景光暈被 overflow:hidden
   切出一條硬邊的問題，這次一開始就不會發生：.node-view／.node-field 都沒有設
   overflow:hidden，光暈也在很早就淡成透明，不會剩下一圈還很明顯的邊界） */
.node-circle::before{
  content:'';
  position:absolute;
  inset:-65%;
  border-radius:50%;
  background:radial-gradient(circle, var(--brand) 0%, rgba(64,74,255,0) 68%);
  opacity:.32;
  filter:blur(16px);
  pointer-events:none;
  z-index:-1;
  transition:opacity .35s ease;
}
.node-circle:hover::before{opacity:.5;}
@media (max-width:640px){
  .node-field{height:72vh;}
  .node-circle{width:82px; font-size:11.5px;}
}

/* world 選單（共構）：不用方塊卡片，改成一排可以整排點開的「清單列」，
   平常只是很安靜的一條條文字＋細線，跟全站的中性調性一致；滑鼠移到
   哪一列，那一列整條（滿版、不是一個方塊）往左往右洗出該世界觀的代表色、
   名字放大翻白，其他列同時變暗、往旁邊讓開一點點，形成「這一列被選中」
   的聚焦感。色塊是用 scaleX 從左邊展開，跟全站切換頁面用的那條 #wipe
   橫掃效果是同一種手法，算是跟網站自己的轉場語言互相呼應；拿掉了方塊、
   陰影、傾斜這些「卡片」才有的裝飾，改成更接近雜誌目錄的編排。 */
.world-list{
  width:100%; max-width:640px; margin:56px auto 0;
}
.world-row{
  position:relative; z-index:1;
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  padding:22px 6px;
  overflow:hidden;
  transition:padding .4s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
}
.world-row::before{
  content:'';
  position:absolute; inset:0;
  background:var(--tile-accent);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  z-index:-1;
}
.world-row:hover{ padding:30px 22px; }
/* 還沒有角色的世界觀：變淡、滑過去沒有任何效果 */
.world-row.is-empty,
.view.enter-stagger.enter-run .world-row.is-empty{ opacity:.38; pointer-events:none; } /* 第二行：換頁淡入動畫跑完後，不要被它的 opacity:1 蓋掉 */
.wr-soon{ letter-spacing:.12em; }
.world-row:hover::before{ transform:scaleX(1); }
.world-list:hover .world-row:not(:hover){ opacity:.42; }
.wr-name{
  font-family:var(--font-disp); font-weight:600;
  font-size:15px; letter-spacing:.1em; line-height:1;
  color:var(--ink);
  transform-origin:left center;
  transition:color .4s ease, transform .5s cubic-bezier(.2,.8,.2,1);
}
.world-row:hover .wr-name{ color:#fff; transform:translateX(6px) scale(2.3); }
.wr-char{ display:inline-block; }
.wr-meta{ display:flex; align-items:center; gap:18px; flex:none; }
.wr-code, .wr-count{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
  color:var(--ink-faint); white-space:nowrap;
  transition:color .35s ease;
}
.world-row:hover .wr-code, .world-row:hover .wr-count{ color:rgba(255,255,255,.78); }
@media (max-width:640px){
  .world-list{ margin-top:40px; }
  .world-row{ padding:15px 2px; }
  .world-row:hover{ padding:19px 14px; }
  .wr-name{ font-size:13px; }
  .world-row:hover .wr-name{ transform:translateX(4px) scale(1.9); }
  .wr-meta{ gap:10px; }
  .wr-count{ display:none; } /* 手機版位置窄，數量先讓位給名字跟代號 */
  .wr-count.wr-soon{ display:inline; font-size:10px; } /* 但 COMING SOON 還是要顯示 */
}
@media (prefers-reduced-motion: reduce){
  .world-row, .world-row::before, .wr-name{ transition:none !important; }
}

/* ---------------- 世界時間軸 Timeline ---------------- */
.timeline-view{ max-width:900px; margin:0 auto; padding-bottom:40px; }
.tl-track{ position:relative; margin-top:36px; }
.tl-track::before{
  content:''; position:absolute; left:50%; top:0; bottom:0; width:2px;
  background:var(--line); transform:translateX(-50%);
}
.tl-item{ position:relative; width:50%; box-sizing:border-box; padding:0 40px 44px; }

.tl-dot{

}

  padding:16px 18px;
}

.tl-item.tl-right .tl-card{ margin-right:auto; }

.tl-empty{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:56px 20px 36px; gap:16px;
}
.tl-empty-track{
  position:relative; width:2px; height:64px;
  background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 12px);
}
.tl-empty-dot{
  position:absolute; left:50%; bottom:-6px; transform:translateX(-50%) scale(1);
  width:11px; height:11px; border-radius:50%;
  background:var(--brand); box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--brand);
  animation:tlEmptyPulse 2.4s ease-in-out infinite;
}
@keyframes tlEmptyPulse{

  50%{ transform:translateX(-50%) scale(1.35); opacity:.5; }
}
.tl-empty-text{
  font-family:var(--font-cjk); font-size:15px; font-weight:600; color:var(--ink);
}
.tl-empty-hint{

  max-width:420px; line-height:1.85;
}
.tl-char{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  width:44px; text-decoration:none;
}
.tl-char-avatar{
  width:34px; height:34px; border-radius:50%; overflow:hidden;
  border:1.5px solid var(--line); background:var(--brand);
  transition:transform .2s ease, border-color .2s ease;
}
.tl-char-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.tl-char-avatar .avatar-fill{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-disp); font-size:13px; }
.tl-char:hover .tl-char-avatar{ transform:scale(1.12); border-color:var(--brand); }
.tl-char-name{
  font-size:10px; color:var(--ink-soft); text-align:center; max-width:56px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tl-char.is-external{ cursor:default; }
.tl-char.is-external .tl-char-avatar{ border-style:dashed; border-color:var(--ink-soft); background:transparent; }
.tl-char.is-external:hover .tl-char-avatar{ transform:none; border-color:var(--ink-soft); }
@media (max-width:820px){
  .tl-track::before{ left:14px; }
  .tl-item, .tl-item.tl-left, .tl-item.tl-right{
    width:100%; left:0; text-align:left; padding:0 0 34px 38px;
  }
  .tl-item.tl-left .tl-dot, .tl-item.tl-right .tl-dot{ left:9px; right:auto; }
  .tl-item.tl-left .tl-card, .tl-item.tl-right .tl-card{ margin-left:0; margin-right:0; max-width:none; }
  .tl-card{ display:block; } /* 手機版每張卡片都撐滿同樣寬度，排起來比較整齊 */
}

/* ---------------- 角色頁面：這個角色的關係（只顯示自己填過的對象） ---------------- */
/* 本人頭像放在正中間，填過的關係人平均分散在四周一圈，不會全部擠在同一邊 */
.pf-rel-stage{
  position:relative; width:100%; max-width:300px; aspect-ratio:1/1;
  margin:20px auto 8px;
}
.pf-rel-stage.is-medium{max-width:380px;}
.pf-rel-stage.is-dense{max-width:460px;}
.pf-rel-lines{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.pf-rel-line{stroke:var(--line); stroke-width:.4;}
.pf-rel-edge-label{
  position:absolute; transform:translate(-50%,-50%); z-index:2;
  background:var(--bg); border:1px solid var(--line);
  padding:3px 9px; border-radius:999px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em; color:var(--ink-soft);
  white-space:nowrap; pointer-events:none;
}
.pf-rel-hub{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:66px; height:66px; border-radius:50%; overflow:hidden;
  border:2px solid var(--brand); background:var(--brand);
  box-shadow:0 8px 22px rgba(30,30,34,.18);
}
.pf-rel-hub img{width:100%; height:100%; object-fit:cover; display:block;}
.pf-rel-hub .avatar-fill{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-disp); font-size:20px;}
.pf-rel-node{
  position:absolute; transform:translate(-50%,-50%); z-index:1;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  width:92px; text-decoration:none;
}
/* 對方在本人頭像上半圈時，名字改排到頭像上方，遠離中心、不跟關係標籤打架 */
.pf-rel-node-flip{ flex-direction:column-reverse; }
.pf-rel-avatar{
  width:52px; height:52px; border-radius:50%; overflow:hidden;
  border:2px solid var(--line); background:var(--brand);
  transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, border-color .25s ease;
}
.pf-rel-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.pf-rel-avatar .avatar-fill{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-disp); font-size:16px;}
.pf-rel-node:hover .pf-rel-avatar{transform:scale(1.14); box-shadow:0 12px 26px rgba(30,30,34,.2); border-color:var(--brand);}
/* 不是資料庫裡角色的對象（只打了名字、沒有 ID）：虛線頭像、不能點擊 */
.pf-rel-node.is-external{cursor:default;}
.pf-rel-node.is-external .pf-rel-avatar{border-style:dashed; border-color:var(--ink-soft); background:transparent;}
.pf-rel-node.is-external .pf-rel-avatar .avatar-fill{background:transparent !important; color:var(--ink-soft);}
.pf-rel-node.is-external:hover .pf-rel-avatar{transform:none; box-shadow:none; border-color:var(--ink-soft);}
.pf-rel-node.is-external .pf-rel-name{color:var(--ink-soft);}
.pf-rel-name{
  font-family:var(--font-cjk); font-size:11.5px; color:var(--ink); text-align:center;
  white-space:normal; line-height:1.3; max-width:92px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
/* 填的關係人比較多的時候，頭像／名字縮小一點，避免彼此疊在一起 */
.pf-rel-stage.is-medium .pf-rel-node{width:76px; gap:5px;}
.pf-rel-stage.is-medium .pf-rel-avatar{width:44px; height:44px;}
.pf-rel-stage.is-medium .pf-rel-name{font-size:10px; max-width:76px;}
.pf-rel-stage.is-medium .pf-rel-edge-label{font-size:9.5px; padding:2px 7px;}
.pf-rel-stage.is-dense .pf-rel-hub{width:56px; height:56px;}
.pf-rel-stage.is-dense .pf-rel-node{width:62px; gap:4px;}
.pf-rel-stage.is-dense .pf-rel-avatar{width:38px; height:38px; border-width:1.5px;}
.pf-rel-stage.is-dense .pf-rel-name{font-size:9px; max-width:62px;}
.pf-rel-stage.is-dense .pf-rel-edge-label{font-size:8.5px; padding:2px 6px;}
@media (max-width:640px){
  .pf-rel-stage{max-width:min(88vw,320px);}
  .pf-rel-stage.is-medium{max-width:min(94vw,380px);}
  .pf-rel-stage.is-dense{max-width:min(98vw,440px);}
  .pf-rel-hub{width:52px; height:52px;}
  .pf-rel-avatar{width:42px; height:42px; border-width:1.5px;}
  .pf-rel-node{width:76px; gap:4px;}
  .pf-rel-name{font-size:10px; max-width:76px;}
  .pf-rel-edge-label{font-size:9px; padding:2px 7px;}
  .pf-rel-stage.has-list{ display:none; }
}
.pf-rel-list{ display:none; }
@media (max-width:640px){
  .pf-rel-list{ display:flex; flex-direction:column; margin-top:8px; }
  .pf-rel-row{
    display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:12px;
    padding:10px 2px; border-bottom:1px solid var(--line); text-decoration:none;
  }
  .pf-rel-row .pf-rel-avatar{ width:40px; height:40px; border-width:1.5px; }
  .pf-rel-row.is-external .pf-rel-avatar{ border-style:dashed; border-color:var(--ink-soft); background:transparent; }
  .pf-rel-row-name{ font-family:var(--font-cjk); font-size:14px; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pf-rel-row.is-external .pf-rel-row-name{ color:var(--ink-soft); }
  .pf-rel-row-label{ font-family:var(--font-mono); font-size:11px; color:var(--brand); text-align:right; max-width:42vw; }
}

/* 角色列表：橫向重疊排列的弧形卡片牆（電腦滾輪橫向瀏覽，手機直接上下滑）。
   每張卡片的寬度／垂直位移都是 JS 算好、用 inline style 帶進來的（弧線公式），
   這裡的 class 只負責視覺樣式，不負責排版數值。 */
/* 角色列表恢復成橫向重疊卡片牆，但取消原本的弧形高低起伏：
   每張卡片統一寬度／高度，排成一直線，只靠中間淡出/降飽和＋滑鼠放大來做重點 */
/* 滑鼠按住拖曳卡片時，不要反白選到文字 */
.arc-stage.is-dragging, .arc-stage.is-dragging *{ user-select:none; -webkit-user-select:none; }
.arc-stage{
  height:clamp(380px, 56vh, 600px);
  overflow-x:auto; overflow-y:hidden;
  display:flex; align-items:center;
  -ms-overflow-style:none; scrollbar-width:none;
  max-width:800px; margin:0 auto;
  -webkit-overflow-scrolling:touch;
  /* 吸附置中改由 JS 自己算＋動畫做（見 initArcStage 的 snapToNearest），
     不用 CSS scroll-snap，避免瀏覽器原生吸附跟我們的慣性動畫互相打架，
     導致「看起來停了但其實還在偷偷滑」讓點擊踩不準頭像 */
  /* 邊緣用漸層遮罩淡出，取代生硬的裁切邊界 */
  -webkit-mask-image:linear-gradient(to right, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%);
}
.arc-stage::-webkit-scrollbar{ display:none; }
.arc-track{ display:flex; align-items:center; margin:0 auto; padding:0 6vw; }
.arc-card{
  position:relative; flex:0 0 auto;
  cursor:pointer;
  transition:filter .35s ease, opacity .35s ease;
}
.arc-card-media{
  position:relative; aspect-ratio:4/5;
  background:var(--brand); border-radius:var(--radius-sm); overflow:hidden;
  box-shadow:0 26px 50px rgba(30,30,34,.16);
  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
}
.arc-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.arc-card .avatar-fill{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-disp); font-size:26px; color:rgba(255,255,255,.9);
}
.arc-card .name-bar{
  position:absolute; left:0; right:0; bottom:0; padding:12px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,.62), transparent);
  color:#fff;
  opacity:0; transform:translateY(6px);
  transition:opacity .3s ease, transform .3s ease;
}
.arc-card .name-bar .cn{font-family:var(--font-cjk); font-weight:500; font-size:13.5px;}
.arc-card .name-bar .role{font-family:var(--font-mono); font-size:10px; opacity:.8;}
.arc-card:hover{
  filter:none !important; opacity:1 !important; z-index:2000 !important;
}
.arc-card:hover .arc-card-media{
  transform:translateY(-10px) scale(1.07) !important;
  box-shadow:0 44px 80px rgba(30,30,34,.3), 0 0 0 1px var(--brand);
}
.arc-card img{ transition:transform .7s cubic-bezier(.2,.8,.2,1); }
.arc-card:hover img{ transform:scale(1.06); }
.arc-card:hover .name-bar{opacity:1; transform:translateY(0);}
.arc-card .name-bar .cn{ position:relative; display:inline-block; padding-bottom:3px; }
.arc-card .name-bar .cn::after{
  content:''; position:absolute; left:0; bottom:0; height:1px; width:100%;
  background:var(--brand); transform:scaleX(0); transform-origin:left;
  transition:transform .45s cubic-bezier(.2,.8,.2,1) .08s;
}
.arc-card:hover .name-bar .cn::after{ transform:scaleX(1); }
/* 手機版：一直顯示在圖片「下面」的小字說明，桌機不用 */
.name-caption{ display:none; }

.arc-hint{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; color:var(--ink-soft);
  padding:14px 0 4px;
}
.arc-hint .dot{width:5px; height:5px; border-radius:50%; background:var(--brand);}

/* 世界觀簡介：放在整排卡片最下面、置中的一個小區塊 */
.world-brief{
  display:flex; justify-content:center;
  margin:6px 0 40px;
}
.world-brief-inner{
  width:100%; max-width:420px; text-align:center;
  border-top:1px solid var(--line); padding-top:16px;
}
.world-brief .wb-label{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-soft);
  letter-spacing:.1em; margin-bottom:8px;
}
.world-brief p{ margin:0; font-size:13px; line-height:1.8; color:var(--ink); }

@media (max-width:820px){
  .arc-stage{
    height:clamp(290px, 47vh, 430px);
    -webkit-overflow-scrolling:touch;
  }
  .arc-hint{ padding-top:10px; }
  .arc-card .name-bar{ display:none; }
  .name-caption{
    display:block; text-align:center; padding:6px 4px 0;
  }
  .name-caption .cn{ font-family:var(--font-cjk); font-weight:500; font-size:10.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name-caption .role{ font-family:var(--font-mono); font-size:8px; color:var(--ink-soft); }
}

/* ================= PROFILE（近未來動態捲動版面） ================= */
.pf-avatar-wrap{
  min-height:64vh;
  display:flex; align-items:center; justify-content:center;
  padding:20px 0;
}
.pf-avatar-circle{
  width:clamp(160px,22vw,220px); aspect-ratio:1/1; border-radius:50%;
  overflow:hidden; position:relative;
  box-shadow:0 22px 46px rgba(42,42,46,.09);
  animation:pfFloat 7s ease-in-out infinite;
}
@keyframes pfFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-12px) scale(1.05);}
}
.pf-avatar-circle img{width:100%; height:100%; object-fit:cover; display:block;}
.pf-avatar-circle .avatar-fill{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-disp); font-size:30px;}

/* 捲動淡入：預設隱藏＋明顯下移＋縮小一點，進入畫面後 JS 會加上 .in-view 觸發過場 */
.pf-reveal{
  opacity:0; transform:translateY(46px) scale(.96);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
}
.pf-reveal.in-view{opacity:1; transform:translateY(0) scale(1);}
/* 頭像：從微微模糊、縮小的狀態「對焦」出現 */
.profile-view .pf-avatar-wrap{ animation:pfAvatarIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pfAvatarIn{
  from{ opacity:0; transform:scale(.86); filter:blur(10px); }
  to{ opacity:1; transform:none; filter:none; }
}
/* 基本資料區塊：整塊不再一起浮上來，改成裡面每一行依序出現，像翻開檔案 */
.pf-reveal.pf-basic{ opacity:1; transform:none; }
.pf-basic > *, .pf-basic .field{
  opacity:0; transform:translateY(16px);
  transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1);
}
.pf-basic.in-view > *, .pf-basic.in-view .field{ opacity:1; transform:none; }
.pf-basic.in-view > :nth-child(1){ transition-delay:.05s; }
.pf-basic.in-view > :nth-child(2){ transition-delay:.15s; }
.pf-basic.in-view > :nth-child(3){ transition-delay:.25s; }
.pf-basic.in-view > :nth-child(4){ transition-delay:.33s; }
.pf-basic.in-view > :nth-child(5){ transition-delay:.4s; }
.pf-basic.in-view > :nth-child(6){ transition-delay:.75s; }
.pf-basic.in-view .field:nth-child(1){ transition-delay:.45s; }
.pf-basic.in-view .field:nth-child(2){ transition-delay:.5s; }
.pf-basic.in-view .field:nth-child(3){ transition-delay:.55s; }
.pf-basic.in-view .field:nth-child(4){ transition-delay:.6s; }
.pf-basic.in-view .field:nth-child(5){ transition-delay:.65s; }
.pf-basic.in-view .field:nth-child(6){ transition-delay:.7s; }
.pf-basic.in-view .field:nth-child(7){ transition-delay:.75s; }
.pf-basic.in-view .field:nth-child(8){ transition-delay:.8s; }

.pf-basic{
  text-align:center; max-width:480px; margin:0 auto 70px;
}
.pf-basic .p-code{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
.pf-basic h1{font-family:var(--font-disp); font-weight:600; font-size:clamp(26px,4vw,38px); margin:0 0 6px;}
.pf-basic .p-role{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
/* CP 名字：有介紹時可以點，點了開 CP 小視窗 */
.cp-link{
  font:inherit; color:var(--brand); background:none; border:none; padding:0; cursor:pointer;
  text-decoration:underline dotted; text-underline-offset:4px; text-align:right;
}
.cp-link:hover{ text-decoration-style:solid; }
.cp-link-icon{ font-size:.85em; margin-left:6px; }
/* ================= 全站搜尋 ================= */
.search-link{ display:inline-flex; align-items:center; gap:6px; background:none; border-top:0; border-bottom:0; border-left:0; cursor:pointer; }
.search-ico{ width:14px; height:14px; display:block; flex:none; }
.search-btn{ display:none; }
@media (max-width:860px){
  .search-link{ display:none !important; } /* 手機版改用右上角的放大鏡，不放在選單裡 */
  .search-btn{
    display:flex; align-items:center; justify-content:center; order:1; margin-left:auto;
    width:40px; height:40px; background:none; border:0; color:var(--ink-soft);
  }
  .search-btn .search-ico{ width:19px; height:19px; }
  .nav-burger{ margin-left:2px !important; }
}
#search-modal{
  position:fixed; inset:0; z-index:220;
  background:rgba(20,18,20,.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  display:none; justify-content:center; align-items:flex-start; padding:12vh 20px 20px;
}
#search-modal.open{ display:flex; animation:fadeIn .2s ease both; }
body.search-open{ overflow:hidden; }
.search-card{
  width:min(560px, 100%); max-height:76vh; display:flex; flex-direction:column;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:calc(var(--radius) + 4px);
  box-shadow:0 30px 80px rgba(0,0,0,.28); overflow:hidden;
  animation:cpCardIn .3s cubic-bezier(.2,.8,.2,1) both;
}
.search-field{
  display:flex; align-items:center; gap:12px; padding:16px 18px;
  border-bottom:1px solid var(--line); color:var(--ink-soft);
}
.search-field .search-ico{ width:18px; height:18px; }
#search-input{
  flex:1; min-width:0; border:0; outline:0; background:none; color:var(--ink);
  font-family:var(--font-cjk); font-size:16px; /* 16px 以上 iPhone 才不會自動放大畫面 */
}
#search-input::placeholder{ color:var(--ink-faint); }
#search-input::-webkit-search-cancel-button{ display:none; }
.search-esc{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; color:var(--ink-faint);
  border:1px solid var(--line); border-radius:4px; padding:3px 6px; background:none; cursor:pointer;
}
.search-results{ overflow-y:auto; padding:6px; }
.search-item{
  display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:12px;
  padding:8px 10px; border-radius:var(--radius-sm); text-decoration:none; color:var(--ink);
}
.search-item.is-active{ background:var(--panel); }
.search-av{ width:40px; height:40px; border-radius:50%; overflow:hidden; background:var(--panel); }
.search-av img{ width:100%; height:100%; object-fit:cover; display:block; }
.search-av .avatar-fill{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.search-name{ font-family:var(--font-cjk); font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-name mark{ background:none; color:var(--brand); font-weight:600; }
.search-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-tag{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--tag, var(--ink-soft));
  border:1px solid currentColor; border-radius:999px; padding:2px 8px; white-space:nowrap; opacity:.85;

.search-empty{ padding:26px 16px; text-align:center; font-size:13px; color:var(--ink-soft); line-height:1.8; }
.search-empty small{ display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:6px; letter-spacing:.04em; }
@media (max-width:640px){
  #search-modal{ padding:10px; align-items:flex-start; }
  .search-card{ max-height:calc(100svh - 20px); }
  .search-esc{ font-size:0; padding:6px 8px; }
  .search-esc::before{ content:'✕'; font-size:12px; }
}

#cp-modal{
  position:fixed; inset:0; z-index:210;
  background:rgba(20,18,20,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:20px;
}
#cp-modal.open{ display:flex; animation:fadeIn .25s ease both; }
body.cp-modal-open{ overflow:hidden; }
.cp-card{
  position:relative; width:min(460px, 100%); max-height:min(88vh, 820px); overflow-y:auto;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:calc(var(--radius) + 6px);
  box-shadow:0 30px 80px rgba(0,0,0,.28); padding:40px 30px 32px;
  text-align:center;
  animation:cpCardIn .35s cubic-bezier(.2,.8,.2,1) both;
}
/* 小卡片內側再框一圈細線，像實體卡片的邊框 */
.cp-card::before{
  content:''; position:absolute; inset:8px; border:1px solid var(--line);
  border-radius:calc(var(--radius) + 2px); pointer-events:none;
}
@keyframes cpCardIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }
.cp-close{
  position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); font-size:13px;
}
.cp-close:hover{ color:var(--brand); border-color:var(--brand); }
.cp-label{ font-family:var(--font-mono); font-size:11px; letter-spacing:.3em; color:var(--brand); margin-bottom:10px; }
.cp-title{
  font-family:var(--font-disp); font-weight:600; font-size:20px; line-height:1.4;
  margin:0 20px; white-space:nowrap; overflow:hidden;
}
.cp-title.is-wrapped{ white-space:normal; }
.cp-x{ color:var(--brand); margin:0 .5em; font-weight:400; }
.cp-divider{ color:var(--brand); font-size:12px; margin:12px 0 18px; opacity:.8; }
.cp-image{ margin:0 0 20px; border-radius:var(--radius-sm); overflow:hidden; background:var(--panel); }
.cp-image img{ display:block; width:100%; height:auto; max-height:42vh; object-fit:contain; }
/* 特質量表：左邊是「這個角色 → 對方」、右邊是「對方 → 這個角色」，中間是項目名稱，
   每項 0～5 個圓點，跟網站其他地方（狀態點、捲動提示點）同一種小圓點語言 */
.cp-traits{
  display:inline-block; margin:0 auto 22px; padding:12px 18px 10px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
}
.cp-traits-head{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px;
  font-size:11.5px; color:var(--ink-soft); padding-bottom:8px; margin-bottom:4px;
  border-bottom:1px solid var(--line);
}
.cp-traits-head span:first-child{ text-align:right; }
.cp-traits-head span:last-child{ text-align:left; }
.cp-traits-head em{ font-style:normal; color:var(--brand); }
.cp-traits-title{ font-family:var(--font-mono); font-size:10px; letter-spacing:.25em; color:var(--ink-faint); }
.cp-trait-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:4px 0; }
.cp-trait-label{ font-size:12px; letter-spacing:.06em; color:var(--ink); min-width:4.5em; }
.cp-dots{ display:inline-flex; gap:4px; }
.cp-trait-row .cp-dots:first-child{ justify-self:end; flex-direction:row-reverse; } /* 左邊那份從中間往外長，左右對稱 */
.cp-trait-row .cp-dots:last-child{ justify-self:start; }
.cp-dots i{ width:7px; height:7px; border-radius:50%; border:1px solid var(--ink-faint); box-sizing:border-box; }
.cp-dots i.on{ background:var(--brand); border-color:var(--brand); }
.cp-dots.is-empty{ font-size:11px; color:var(--ink-faint); }
.cp-intro{ text-align:left; }
.cp-intro p{ margin:0 0 1em; line-height:1.9; font-size:14.5px; }
.cp-intro p:last-child{ margin-bottom:0; }
.cp-partner{ display:inline-block; margin-top:22px; }
@media (max-width:640px){
  #cp-modal{ align-items:flex-end; padding:0; }
  .cp-card{ width:100%; max-height:88vh; border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0; padding:36px 22px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .cp-card::before{ bottom:0; border-bottom:none; border-radius:calc(var(--radius) + 2px) calc(var(--radius) + 2px) 0 0; }
  .cp-title{ font-size:18px; }
}
.pf-share{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:26px; }
.pf-share .pill-link{ background:none; cursor:pointer; }
.pf-share .pill-link.is-done{ color:var(--brand); border-color:var(--brand); }
.pf-basic .field-list{
  text-align:left; background:var(--panel); border-radius:var(--radius);
  padding:2px 20px; margin-bottom:24px;
}
.pf-bio{
  text-align:left; font-size:14.5px; color:var(--ink); line-height:1.9;
}
.pf-bio p{margin:0 0 18px;}
.pf-bio p:last-child{margin-bottom:0;}

/* Articles／Gallery 沒有立繪背景可以毛玻璃時，維持完全透明、不加灰底卡片——
   只保留 body.has-fullbody-bg 那段的半透明毛玻璃效果，其餘情況不額外加背景。
   （這裡只留 Articles／Gallery 上下的間距，避免兩塊內容黏在一起） */
.profile-view > .pf-reveal:not(.pf-basic):not(.pf-fullbody-mobile){
  margin-bottom:18px;
}
.profile-view > .pf-reveal:not(.pf-basic):not(.pf-fullbody-mobile):last-child{
  margin-bottom:0;
}

/* 立繪：固定貼在畫面左側、疊在文字內容下方（z-index 較低）當放大版的背景，
   不會隨內容捲動而消失；文字／資訊改成用毛玻璃卡片的方式浮貼在它上面
   （見下方 body.has-fullbody-bg 那段），所以立繪可以比之前放大不少，
   但還是貼在左邊，不是整個置中。
   圖片本身大小完全不變，只是隨著捲動上下平移：
   一開始（頁面最上面）看得到頭，捲到畫廊底部時平移到看得到腳。 */
.pf-bg-fullbody{
  display:none;
  position:fixed; left:clamp(0px,2vw,24px); top:74px; bottom:0;
  width:min(56vw,820px);
  overflow:hidden;
  z-index:0; pointer-events:none;
  opacity:0; filter:blur(24px);
  transition:opacity .9s ease, filter .9s ease;
}
.pf-bg-fullbody.show{display:block; opacity:1; filter:blur(0);}
.pf-bg-fullbody.in-view{opacity:1; filter:blur(0);}
.pf-bg-fullbody img{
  position:absolute; top:0; left:0;
  width:100%; height:auto; display:block;
  transform:translateY(0);
  opacity:0;
  will-change:transform, width, height, opacity;
  transition:opacity .5s ease, filter .5s ease;
}
.pf-bg-fullbody img.loaded{opacity:var(--fb-dim, 1); filter:blur(calc((1 - var(--fb-dim, 1)) * 3px)) saturate(calc(.55 + var(--fb-dim, 1) * .45));}
/* 立繪圖片本身還在載入時，用一個淡淡的閃光骨架占位，
   這樣切換角色的當下畫面不會整塊空白、感覺卡住不動 */
.pf-bg-fullbody::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(100deg,
    color-mix(in srgb, var(--ink) 5%, transparent) 30%,
    color-mix(in srgb, var(--ink) 11%, transparent) 50%,
    color-mix(in srgb, var(--ink) 5%, transparent) 70%);
  background-size:200% 100%;
  animation:pfSkeletonShimmer 1.4s ease-in-out infinite;
  opacity:1;
  transition:opacity .35s ease;
}
.pf-bg-fullbody.in-view::before{opacity:0;}
@keyframes pfSkeletonShimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}
/* 立繪還在下載時，先用同一位角色的頭像小圖（檔案通常小很多，幾乎秒開）
   放大、模糊當作預覽墊底，讓等待的當下至少看得出「是這個角色」，
   而不是乾等一片閃光；正式立繪載入完成後這層會淡出。 */
.pf-bg-placeholder{
  position:absolute; inset:0;
  background-size:cover; background-position:center 20%;
  filter:blur(28px) saturate(1.05);
  transform:scale(1.15);
  opacity:.6;
  transition:opacity .5s ease;
}
.pf-bg-fullbody.in-view .pf-bg-placeholder{opacity:0;}
.pf-fullbody-mobile{ display:none; }
@media (max-width:900px){
  .pf-bg-fullbody{display:none !important;}
  /* 手機沒有空間放左側固定背景，改成用一般捲動區塊顯示立繪，一樣沒有外框、等比縮放不裁切 */
  .pf-fullbody-mobile{
    display:block; max-width:420px; margin:0 auto 50px;
  }
  .pf-fullbody-mobile img{
    width:100%; height:auto; object-fit:contain; display:block;
  }
}
/* 有立繪背景時，整個角色頁內容往右挪，空間讓給左側的立繪；
   同時取消 #app 自己的置中最大寬度限制，避免寬螢幕時兩層留白疊加、間距過大。
   （這段刻意維持原本的樣子——角色資訊／基本資料不套用毛玻璃、不疊在立繪上，
   只有 Articles／Gallery 這兩個區塊會疊上去，跟立繪還沒放大之前的行為一樣。） */
@media (min-width:901px){
  body.has-fullbody-bg #app{ max-width:none; }
  body.has-fullbody-bg .profile-view{
    margin-left:min(26vw,360px);
    padding-left:clamp(12px,2vw,28px);
  }
  /* 立繪放大之後，內容區塊要蓋在它上面才看得到文字——
     不另外加毛玻璃底卡片，保持完全透明，只維持 z-index 蓋在立繪上方。
     只套用在 Articles／Gallery 這兩個區塊——基本資料（.pf-basic）本來排版就沒問題，
     不需要也不應該被這個規則加上去 */
  body.has-fullbody-bg .profile-view > .pf-reveal:not(.pf-basic):not(.pf-fullbody-mobile){
    position:relative; z-index:1;
  }
}

.field-list{
  display:grid; grid-template-columns:1fr 1fr;
  column-gap:20px;
}
.field{
  display:flex; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.field:last-child{border-bottom:none;}
.field .k{color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px; letter-spacing:.03em; padding-top:2px;}
@media (max-width:480px){
  .field-list{grid-template-columns:1fr;}
}
.field .v{text-align:right; max-width:60%;}

/* articles：改成一顆一顆的標籤，可以自動換行、同一行擺很多個，
   不用像以前一樣每篇文章都獨占一整行，列表太長 */
.article-list{display:flex; flex-wrap:wrap; gap:10px;}
.article-row{
  display:inline-flex; align-items:center; gap:9px;
  padding:10px 16px; border:1px solid var(--line); border-radius:999px;
  transition:all .25s ease;
}
.article-row:hover{border-color:var(--accent); background:var(--accent);}
.article-row .a-main{display:flex; align-items:baseline; gap:7px; white-space:nowrap;}
.article-row .a-main .a-title{font-size:13.5px; font-weight:500;}
.article-row .a-main .a-src{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);}
.article-row:hover .a-main .a-title, .article-row:hover .a-main .a-src{color:#fff;}
.article-row .a-go{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; flex:none;
  transition:color .25s ease;
}
.article-row:hover .a-go{color:#fff;}

/* gallery */
/* 容器本身（.gallery-grid）之前用 background:var(--line) 當作縮圖之間 1px 縫隙的
   襯底色，但這個背景是鋪在整個容器滿版寬度上——當圖片數量不足以填滿整排欄位時，
   容器右側沒有縮圖的那塊空間也會被這個底色整塊填滿，變成一條色塊。
   容器本身不再上底色，縫隙直接透出後面的頁面／立繪背景，圖片不夠多時就只是
   留白，不會有多餘的色塊 */
.gallery-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 220px)); gap:1px;
  justify-content:start;
}
@media (max-width:640px){
  .gallery-grid{ grid-template-columns:repeat(3, 1fr); }
}
.gallery-thumb{
  aspect-ratio:1/1; position:relative; cursor:zoom-in; overflow:hidden; border-radius:var(--radius-sm); background:var(--panel);
}
/* Gallery 區塊捲進畫面時，縮圖一張接一張浮現（--i 是第幾張，最多延遲到第 18 張） */
.pf-reveal .gallery-thumb{
  opacity:0; transform:translateY(22px) scale(.96);
  transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i, 0) * 55ms + 150ms);
}
.pf-reveal.in-view .gallery-thumb{ opacity:1; transform:none; }
.gallery-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s cubic-bezier(.2,.8,.2,1), filter .4s ease;}
.gallery-thumb .avatar-fill{transition:transform .35s cubic-bezier(.2,.8,.2,1);}
/* 縮圖 hover 的視差改由 JS 依滑鼠在縮圖裡的位置即時算位移（initGalleryParallax），
   這裡只留最基本的「沒有 JS/滑鼠離開時」預設放大，JS 算出的 translate 會疊加上去 */
.gallery-thumb:hover img, .gallery-thumb:hover .avatar-fill{transform:scale(1.08);}
/* 還沒上傳圖片的格子：原本是整格填滿世界觀的品牌色（黑手黨世界觀底下
   就是整塊紅色），看起來太像一個搶眼的色塊、不像「還沒放圖」的空格。
   不另外加素色底——頁面本身已經有毛玻璃底層，這裡保持透明＋虛線框，
   讓底下的毛玻璃透出來就夠了 */
.gallery-thumb .avatar-fill{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:transparent;
  border:1px dashed var(--line);
  color:var(--ink-faint);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
}

/* R18／血腥等敏感圖片：縮圖預設模糊＋警告字，點一下先解除模糊看縮圖，
   要看大圖再點第二下（避免不小心點到直接看到原圖） */
.gallery-thumb.is-sensitive img{ filter:blur(22px) saturate(1.05); }
.gallery-thumb.is-sensitive.revealed img{ filter:none; }
.gallery-thumb .sensitive-badge{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:rgba(20,20,22,.4);
  color:#fff; text-align:center; padding:10px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; line-height:1.6;
  transition:opacity .25s ease;
}
.gallery-thumb .sensitive-badge .icon{font-size:18px;}
.gallery-thumb.revealed .sensitive-badge{opacity:0; pointer-events:none;}

/* 圖片載入失敗（檔案太大、網路不穩常見）：不要顯示醜醜的破圖示，
   改成淺色底＋文字提示，點一下可以重新試著載入 */
.gallery-thumb.img-error img{ display:none; }
.gallery-thumb.img-error::after{
  content:'圖片載入失敗\A點擊重試';
  white-space:pre-line;
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; line-height:1.7;
  color:var(--ink-soft); background:var(--panel);
}

.empty-note{
  color:var(--ink-faint); font-family:var(--font-mono); font-size:12.5px; padding:20px 0;
}

/* 角色頁最下面的「上一位／下一位」：不用每次都先按 Back 回列表才能點下一個，
   直接在角色頁內就能往前後切換同一個列表（原創或同世界觀）裡的角色 */
.pf-char-nav{
  display:flex; justify-content:space-between; align-items:stretch; gap:20px;
  margin-top:48px; padding-top:22px;
  border-top:1px solid var(--line);
}
.pf-nav-btn{
  display:flex; align-items:center; gap:12px;
  flex:1; min-width:0; max-width:46%;
  padding:6px 2px;
  color:var(--ink-soft);
}
.pf-nav-next{ justify-content:flex-end; text-align:right; margin-left:auto; }
.pf-nav-arrow{
  font-size:18px; flex:none; color:var(--ink-faint);
  transition:transform .25s cubic-bezier(.2,.8,.2,1), color .2s ease;
}
.pf-nav-prev:hover .pf-nav-arrow{ transform:translateX(-5px); color:var(--brand); }
.pf-nav-next:hover .pf-nav-arrow{ transform:translateX(5px); color:var(--brand); }
.pf-nav-text{ display:flex; flex-direction:column; min-width:0; gap:2px; }
.pf-nav-label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--ink-faint);
}
.pf-nav-name{
  font-family:var(--font-disp); font-size:17px; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:color .2s ease;
}
.pf-nav-btn:hover .pf-nav-name{ color:var(--brand); }
@media (max-width:640px){
  .pf-char-nav{ margin-top:36px; padding-top:18px; gap:12px; }
  .pf-nav-name{ font-size:15px; }
}

/* 圖片淡入：真正下載完成前保持透明，等載入好才淡入，
   避免圖片還沒下載完就整張生硬地彈出來（尤其網路慢的時候特別明顯） */
#app img, #lightbox img{
  opacity:0;
  transition:opacity .5s ease;
}
#app img.img-loaded, #lightbox img.img-loaded{
  opacity:1;
}

/* ---------------- lightbox ---------------- */
#lightbox{
  position:fixed; inset:0; z-index:200;
  background:rgba(255,255,255,.97);
  display:none; align-items:center; justify-content:center;
  flex-direction:column;
}
#lightbox.open{display:flex; animation:fadeIn .3s ease both;}
#lightbox img{max-width:min(86vw,900px); max-height:74vh; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,.12);}
.lb-cap{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-top:16px;}
.lb-close{
  position:absolute; top:26px; right:clamp(20px,4vw,56px);
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:999px; padding:8px 16px; background:var(--bg);
}
.lb-close:hover{border-color:var(--accent); color:var(--accent);}
.lb-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono);
  color:var(--ink);
}
.lb-nav:hover{border-color:var(--accent); color:var(--accent);}
.lb-prev{left:clamp(14px,4vw,48px);}
.lb-next{right:clamp(14px,4vw,48px);}
/* 手機：左右箭頭移到畫面下方，不要蓋住圖片的左右兩側；也可以直接左右滑動圖片切換 */
@media (max-width:640px){
  .lb-nav{ top:auto; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:none; }
  .lb-prev{ left:calc(50% - 60px); }
  .lb-next{ right:calc(50% - 60px); }
  .lb-cap{ padding:0 20px; text-align:center; }
}

footer{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  padding:28px clamp(20px,4vw,56px);
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
body.has-fullbody-bg footer{ border-top:none; }
/* ---------------- 自訂游標 ----------------
   顏色不再跟著 body 的世界觀主題手動切換（固定一個顏色在深色底的頁面
   會糊掉、換到淺色底又太搶），改用 mix-blend-mode:difference——
   游標本身固定填白色，瀏覽器會拿這個白色跟它「正下方」的畫面顏色做
   差值混合，深底自動變亮、淺底自動變暗，不管捲到哪個世界觀的頁面、
   疊在圖片或文字上，游標永遠跟背景反相、維持看得清楚的對比度，
   不用另外寫 JS 去讀目前是哪個主題。 */
#cursor{
  position:fixed; top:0; left:0; z-index:9999;
  width:26px; height:26px; margin:-13px 0 0 -13px;
  border-radius:50%;
  border:1.4px solid #fff;
  background:rgba(255,255,255,.14);
  mix-blend-mode:difference;
  pointer-events:none;
  will-change:transform;
  transition:width .22s cubic-bezier(.2,.8,.2,1), height .22s cubic-bezier(.2,.8,.2,1),
             margin .22s cubic-bezier(.2,.8,.2,1), background-color .18s ease, border-color .25s ease;
}
@media (hover:hover) and (pointer:fine){
  *{cursor:none;}
}
@media (hover:none), (pointer:coarse){
  #cursor{display:none;}
}
#cursor.is-hover{
  width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  background:#fff; border-color:#fff;
}
#cursor.is-view{
  width:62px; height:62px; margin:-31px 0 0 -31px;
  background:#fff; border-color:#fff;
}
.cursor-label{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.1em;
  color:#fff; opacity:0;
  transition:opacity .15s ease;
}
#cursor.is-view .cursor-label{ opacity:1; }
.cursor-trail{
  position:fixed; top:0; left:0; z-index:9998;
  border-radius:50%;
  /* 殘影不用反色混合（mix-blend-mode 每一格都要跟底下的畫面重新合成，很吃顯示卡），
     直接用主題的文字色，深底自動是淺色、淺底自動是深色 */
  background:var(--ink);
  pointer-events:none;
  will-change:transform;
}
@media (hover:none), (pointer:coarse){
  .cursor-trail{display:none;}
}

/* ================= 進站開場動畫 =================
   藍底上，MON'S MOOD 的 LOGO 先用白色細線一筆一筆描出來、再填滿；
   右下角的數字跟著角色資料的實際讀取進度跑到 100。讀完之後，
   藍色背景分成幾條像百葉窗一樣依序往上收（跟換頁的掃色轉場同一種手法），
   LOGO 同時平滑縮放、移到首頁底部大 LOGO 的位置接上去。
   同一個分頁裡只播一次；系統開了「減少動態效果」的人直接跳過。 */
#intro-splash{
  position:fixed; inset:0; z-index:999999;
  cursor:pointer; overflow:hidden;
}
.no-intro #intro-splash{ display:none; }
.intro-strips{ position:absolute; inset:0; display:flex; }
.intro-strips i{
  flex:1; height:100%; background:#404aff;
  margin-right:-1px; /* 條與條之間不要露出細縫 */
  transition:transform .55s cubic-bezier(.76,0,.24,1);
  transition-delay:calc(var(--k) * 35ms);
}
#intro-splash.is-out .intro-strips i{ transform:translateY(-101%); }
.intro-logo{
  position:absolute; left:50%; top:50%;
  width:min(62vw, 440px); height:auto; overflow:visible;
  transform:translate(-50%,-50%);
  transform-origin:0 0;
}
.intro-logo path, .intro-logo rect{
  fill:#fff; fill-opacity:0;
  stroke:#fff; stroke-width:1.2; stroke-dasharray:1; stroke-dashoffset:1;
  animation:introDraw var(--dur, .85s) cubic-bezier(.45,0,.25,1) forwards, introFill .4s ease forwards;
  animation-delay:calc(var(--k) * 60ms), var(--fill, .9s); /* 填色時間由 JS 算（見 runIntroSplash） */
  transition:fill .6s ease, stroke .6s ease;
}
@keyframes introDraw{ to{ stroke-dashoffset:0; } }
@keyframes introFill{ to{ fill-opacity:1; stroke-opacity:0; } }
.intro-meta{
  position:absolute; left:clamp(20px,4vw,56px); right:clamp(20px,4vw,56px); bottom:clamp(20px,4vh,40px);
  display:flex; justify-content:space-between; align-items:flex-end;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; color:rgba(255,255,255,.72);
  transition:opacity .3s ease;
}
.intro-count{ font-size:13px; color:#fff; font-variant-numeric:tabular-nums; }
#intro-splash.is-out .intro-meta{ opacity:0; }
@media (max-width:640px){
  .intro-meta{ font-size:9.5px; letter-spacing:.14em; }
  .intro-tag span{ display:block; }
}
</style>
