<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monday's Mood</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23404aff'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

/* ====================================================
   DESIGN TOKENS
   bg        #FFFFFF  純白主體
   panel     #F6F6F4  淺灰面板（卡片/區塊底）
   line      #E3E3E0  分隔線
   ink       #2A2A2E  主要深灰字
   ink-soft  #6B6B70  次要灰字
   accent    #46545C  霧藍灰（狀態點/強調，極少量使用）
   accent-soft #D8DEE0
==================================================== */
:root{
  --bg:#ffffff;
  --panel:#f6f6f4;
  --panel2:#efefec;
  --line:#e3e3e0;
  --ink:#2a2a2e;
  --ink-soft:#6b6b70;
  --ink-faint:#a9a9ac;
  --accent:#46545c;
  --accent-soft:#d8dee0;
  --brand:#404aff;
  --logo-color:#404aff;
  --font-cjk:'Noto Sans TC', sans-serif;
  --font-disp:'Space Grotesk', 'Noto Sans TC', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --wipe-dur: 620ms;
  --radius:10px;
  --radius-sm:6px;
}

/* 黑手黨世界觀專屬紅黑配色：進到 MAFIA 底下的頁面時，body 會加上這個 class，
   透過重新定義同一套 CSS 變數，整個頁面自動變成紅黑主題，離開後恢復原本白色系 */
body.theme-mafia{
  --bg:#100d0d;
  --panel:#1c1414;
  --panel2:#221818;
  --line:#3a1e20;
  --ink:#f3e9e7;
  --ink-soft:#b98a8c;
  --ink-faint:#7a5456;
  --accent:#e0293e;
  --accent-soft:#5c1f26;
  --brand:#e0293e;
  --logo-color:#e0293e;
}

/* 古風世界觀專屬配色：進到 ANCIENT 底下的頁面時，body 會加上這個 class */
body.theme-ancient{
  --bg:#808f7c;
  --panel:#76846f;
  --panel2:#6d7b67;
  --line:#96a290;
  --ink:#ffffff;
  --ink-soft:#e5e9e2;
  --ink-faint:#c1cabc;
  --accent:#ffffff;
  --accent-soft:#9aa696;
  --brand:#ffffff;
  --logo-color:#808f7c;
}

/* 西方奇幻世界觀專屬配色：白底，強調色換成霧紫色 */
body.theme-fantasy{
  --accent:#72636e;
  --accent-soft:#e6e3e5;
  --brand:#72636e;
  --logo-color:#72636e;
}

/* 足球世界觀專屬配色：白底，強調色換成草地綠 */
body.theme-football{
  --accent:#619e69;
  --accent-soft:#e3eee4;
  --brand:#619e69;
  --logo-color:#619e69;
}

/* 西方古典世界觀專屬配色：淺灰紫底，強調色換成暗酒紅 */
body.theme-victorian{
  --bg:#edebed;
  --panel:#e5e3e5;
  --panel2:#dfdddf;
  --line:#d5d4d5;
  --accent:#60373e;
  --accent-soft:#d4cbce;
  --brand:#60373e;
  --logo-color:#60373e;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-cjk);
  font-weight:400;
  letter-spacing:.01em;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background-color .5s ease, color .5s ease;
}
/* faint dot-grid texture, near-future terminal feel */
body::before{
  content:'';
  position:fixed; inset:0;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--accent-soft);}

@media (prefers-reduced-motion: reduce){
  *:not(.pf-avatar-circle):not(.pf-reveal):not(.node-circle):not(.node-svg line):not(#wipe):not(#wipe span){
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px clamp(20px,4vw,56px);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  transition:opacity .4s ease;
  /* 導覽列的背景永遠是白色霧面，不管底下的頁面套用哪個世界觀主題，
     所以這裡把顏色變數重新鎖定回預設值，避免文字/Logo 因為主題變成白色系而看不見 */
  --bg:#ffffff;
  --panel:#f6f6f4;
  --panel2:#efefec;
  --line:#e3e3e0;
  --ink:#2a2a2e;
  --ink-soft:#6b6b70;
  --ink-faint:#a9a9ac;
  --brand:#404aff;
}
body.is-gate .topbar{opacity:0; pointer-events:none;}
body.is-gate footer{display:none;}
body.is-gate{overflow:hidden;}
@media (max-width:640px){
  .topbar{flex-wrap:wrap; row-gap:8px; padding:16px 20px;}
  .brand small{display:none;}
  .topbar-right{width:100%; flex-wrap:wrap; row-gap:8px;}
  .about-link{padding-right:0; border-right:none;}
  .crumb{
    width:100%; justify-content:flex-start;
    overflow-x:auto; white-space:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  .crumb .seg, .crumb .sep{white-space:nowrap; flex:none;}
}

/* ================= GATE / 首頁入口 ================= */
.gate{
  position:fixed; inset:0; z-index:5;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.gate-media{position:absolute; inset:0; overflow:hidden;}
.gate-media video, .gate-media .gate-fallback{
  width:100%; height:100%; object-fit:cover; display:block;
}
.gate-media .gate-fallback{
  background:
    radial-gradient(circle at 30% 18%, #ffffff, transparent 60%),
    linear-gradient(160deg,#ffffff,#f2f2ef 55%,#ffffff);
  position:relative; overflow:hidden;
}
/* 淺灰點狀紋理，與全站底色的質感呼應 */
.gate-fallback::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.6;
}
.gate-media::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.5) 78%, rgba(255,255,255,.82));
}
.gate-center{
  position:relative; z-index:2;
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:44px;
  padding:24px;
}
.gate-quote{
  position:relative;
  margin:0; max-width:300px; text-align:center;
  background:var(--panel);
  border-radius:var(--radius);
  padding:26px 26px 22px;
  box-shadow:0 22px 44px rgba(42,42,46,.09);
}
.gate-quote::after{
  content:'';
  position:absolute; left:50%; top:-9px; transform:translateX(-50%);
  width:16px; height:16px;
  background:var(--panel);
  clip-path:polygon(50% 0, 0 100%, 100% 100%);
}
.gate-quote p{
  margin:0 0 12px; font-size:14px; font-style:italic; line-height:1.65; color:var(--ink);
}
.gate-quote cite{
  display:block; font-style:normal; font-family:var(--font-mono);
  font-size:10.5px; letter-spacing:.03em; color:var(--ink-soft);
}
.gate-quote cite i{font-style:italic;}
.gate-bottom-logo{
  position:relative; z-index:1;
  width:94%; margin:0 auto; line-height:0; overflow:hidden;
  animation:logoReveal 1.5s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes logoReveal{
  from{ opacity:0; filter:blur(22px); transform:translateY(30px) scale(.96); }
  to  { opacity:1; filter:blur(0); transform:translateY(0) scale(1); }
}
.gate-bottom-logo svg{
  display:block;
  width:100%;
}

/* 首頁角色縮圖預覽（moodboard 風格，仿 offforum：小尺寸、間距寬鬆）。
   只會有 8 張縮圖（在 JS 端就已經裁到 8 張），所以這裡不需要用固定高度＋overflow 去裁切，
   直接讓 grid 自然換行就好：桌機 8 欄一排、手機（<=820px）4 欄兩排。 */
.gate-thumbs{
  display:grid; grid-template-columns:repeat(8, 48px);
  gap:22px 30px; margin-bottom:40px;
  justify-content:center;
}
.thumb-tile{
  width:48px; aspect-ratio:1/1; overflow:hidden; position:relative;
  background:var(--panel2);
  border-radius:var(--radius-sm);
}
.thumb-tile img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(55%) blur(1px) brightness(1.02);
  transform:scale(1);
  transition:filter .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
}
.thumb-tile:hover img{
  filter:grayscale(0%) blur(0) brightness(1);
  transform:scale(1.09);
}
@media (max-width:820px){
  .gate-thumbs{
    grid-template-columns:repeat(4, 48px); gap:16px;
  }
}

.gate-sub{
  font-size:14.5px; color:var(--ink-soft); max-width:38ch; margin:0 0 40px;
}
.gate-enter{
  display:inline-flex; align-items:center; gap:14px;
  background:transparent; border:1px solid var(--ink);
  border-radius:999px;
  color:var(--ink); padding:14px 32px; font-family:var(--font-mono); font-size:13px; letter-spacing:.08em;
  transition:background .3s ease, border-color .3s ease, color .3s ease;
}
.gate-enter:hover{background:var(--ink); color:#fff; border-color:var(--ink);}

.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-disp);
  font-size:16px; font-weight:600;
  letter-spacing:.04em;
  color:var(--brand);
  cursor:pointer;
}
.brand-logo{
  height:18px; width:auto; display:block;
}
.logo-mark path, .logo-mark rect{
  fill:var(--logo-color);
  transition:fill .25s ease;
}
.brand:hover .logo-mark path, .brand:hover .logo-mark rect{
  fill:var(--ink);
}
.gate-bottom-logo:hover .logo-mark path, .gate-bottom-logo:hover .logo-mark rect{
  fill:var(--ink);
}
.brand small{
  font-family:var(--font-mono);
  font-size:11px; color:var(--ink-soft); font-weight:400;
}
.crumb{
  font-family:var(--font-mono);
  font-size:12.5px; color:var(--ink-soft);
  display:flex; align-items:center; gap:8px;
}
.crumb .seg{cursor:pointer;}
.crumb .seg:hover{color:var(--ink);}
.crumb .sep{color:var(--ink-faint);}

.topbar-right{
  display:flex; align-items:center; gap:22px;
}
.about-link{
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--ink-soft);
  padding-right:20px; border-right:1px solid var(--line);
  transition:color .2s ease;
}
.about-link:hover{color:var(--ink);}

/* ---------------- app / view container ---------------- */
#app{
  position:relative; z-index:1;
  max-width:1180px; margin:0 auto;
  padding:0 clamp(20px,4vw,56px) 120px;
  min-height:70vh;
}
.view{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---------------- wipe transition overlay ---------------- */
#wipe{
  position:fixed; inset:0; z-index:100;
  pointer-events:none;
  transform:scaleX(0);
  transform-origin:left;
  background:var(--ink);
}
#wipe.run{
  animation:wipeSweep var(--wipe-dur) cubic-bezier(.77,0,.18,1) forwards;
}
#wipe span{
  position:absolute; top:50%; left:24px; transform:translateY(-50%);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.15em;
  color:#fff; opacity:0;
}
#wipe.run span{animation:wipeLabel var(--wipe-dur) ease forwards;}
@keyframes wipeSweep{
  0%{transform:scaleX(0); transform-origin:left;}
  48%{transform:scaleX(1); transform-origin:left;}
  52%{transform:scaleX(1); transform-origin:right;}
  100%{transform:scaleX(0); transform-origin:right;}
}
@keyframes wipeLabel{
  0%{opacity:0;} 20%{opacity:1;} 48%{opacity:1;} 55%{opacity:0;} 100%{opacity:0;}
}

/* ================= HOME ================= */
.hero{
  padding:min(9vh,90px) 0 40px;
}
.hero-eyebrow{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
  margin-bottom:14px;
}
.hero h1{
  font-family:var(--font-disp);
  font-size:clamp(34px,5.4vw,58px);
  font-weight:600; letter-spacing:.005em;
  margin:0 0 18px; max-width:22ch;
}
.hero p{
  color:var(--ink-soft); max-width:46ch; font-size:15.5px;
}

/* About / Contact 頁 */
/* About 頁：簡單的頭像 + 簡介 + 聯絡連結，置中排版 */
.about-view{
  min-height:64vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:26px;
}
.about-avatar{
  width:132px; aspect-ratio:1/1; border-radius:50%;
  overflow:hidden; position:relative;
  box-shadow:0 18px 40px rgba(42,42,46,.08);
}
.about-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.about-avatar .avatar-fill{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--brand); color:#fff; font-family:var(--font-disp); font-size:34px;
}
.about-bio{
  color:var(--ink-soft); font-size:14.5px; max-width:38ch; line-height:1.8; margin:0;
}
.contact-links{
  display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
}
.contact-link{
  display:inline-flex; align-items:center;
  border:1px solid var(--ink); border-radius:999px;
  padding:12px 26px;
  font-family:var(--font-mono); font-size:13px; letter-spacing:.05em;
  color:var(--ink);
  transition:background .25s ease, color .25s ease, border-color .25s ease;
}
.contact-link:hover{background:var(--ink); color:#fff;}

/* ================= INDEX：兩個漂浮節點 ================= */
.node-view{
  min-height:66vh; display:flex; align-items:center; justify-content:center;
}
.node-field{
  position:relative; width:100%;
  height:min(58vh, 520px);
}
.node-svg{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none;
  overflow:visible;
}
.node-svg line{
  stroke:var(--line); stroke-width:1.4;
}
.node-circle{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(96px,10vw,124px);
  aspect-ratio:1/1; border-radius:50%;
  border:1px solid var(--brand);
  background:var(--bg);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-disp); font-weight:600; font-size:13px; letter-spacing:.06em;
  color:var(--brand);
  transition:background .3s ease, color .3s ease;
  will-change:left, top, transform, opacity;
}
.node-circle:hover{background:var(--brand); color:#fff;}
@media (max-width:640px){
  .node-field{height:72vh;}
  .node-circle{width:82px; font-size:11.5px;}
}

.category-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:2px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin-top:28px;
}
@media (max-width:720px){.category-grid{grid-template-columns:1fr;}}

.cat-panel{
  background:var(--bg);
  padding:clamp(28px,4vw,48px);
  min-height:260px;
  position:relative;
  display:flex; flex-direction:column; justify-content:space-between;
  border-radius:var(--radius);
  transition:background .3s ease;
}
.cat-panel:hover{background:var(--panel);}
.cat-panel .cat-code{
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
}
.cat-panel h2{
  font-family:var(--font-disp); font-weight:600;
  font-size:clamp(22px,2.6vw,30px);
  margin:14px 0 8px;
}
.cat-panel p{color:var(--ink-soft); font-size:14px; max-width:32ch; margin:0 0 22px;}
.cat-panel .cat-foot{
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
}
.cat-arrow{
  width:30px; height:30px; border:1px solid var(--line); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transition:transform .3s ease, background .3s ease, border-color .3s ease;
}
.cat-panel:hover .cat-arrow{transform:translateX(4px); border-color:var(--accent); background:var(--accent); color:#fff;}

/* world sub-tiles (共構)：拿掉文字說明，改成置中、偏小的方塊群，
   滑過去單一方塊會放大（其他方塊不動），像一排可以把玩的印章 */
.world-tiles{
  margin:48px auto 0; max-width:560px;
  display:flex; flex-wrap:wrap; justify-content:center; gap:16px;
}
.world-tile{
  position:relative; width:118px; height:118px; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  text-align:center; padding:10px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background .3s ease;
}
.world-tile:hover{
  transform:scale(1.22);
  z-index:5;
  background:var(--brand);
  box-shadow:0 22px 44px rgba(30,30,34,.22);
  border-color:var(--brand);
}
.world-tile .wt-code{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:var(--ink-faint); transition:color .3s ease;}
.world-tile .wt-name{font-family:var(--font-disp); font-weight:600; font-size:14px; color:var(--brand); line-height:1.25; transition:color .3s ease;}
.world-tile:hover .wt-code{color:rgba(255,255,255,.75);}
.world-tile:hover .wt-name{color:#fff;}
@media (max-width:640px){
  .world-tile{ width:96px; height:96px; }
  .world-tile .wt-name{ font-size:12.5px; }
}

/* ================= GRID (character list) ================= */
.section-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:20px; margin:46px 0 22px; flex-wrap:wrap;
}
.section-head h2{
  font-family:var(--font-disp); font-size:clamp(22px,3vw,30px); font-weight:600; margin:0;
}
.section-head h2.brand-title{color:var(--brand);}
.section-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}

/* 角色列表：橫向重疊排列的弧形卡片牆（電腦滾輪橫向瀏覽，手機直接上下滑）。
   每張卡片的寬度／垂直位移都是 JS 算好、用 inline style 帶進來的（弧線公式），
   這裡的 class 只負責視覺樣式，不負責排版數值。 */
.arc-stage{
  height:clamp(380px, 56vh, 600px);
  overflow-x:auto; overflow-y:hidden;
  display:flex; align-items:center;
  -ms-overflow-style:none; scrollbar-width:none;
  max-width:560px; margin:0 auto;
}
.arc-stage::-webkit-scrollbar{ display:none; }
/* 用 flex-end（底部對齊）而不是置中：手機版每張卡片下面接了一段說明文字，
   底部對齊才能讓所有卡片的文字對在同一條水平線上，不會因為圖片高矮不同而東倒西歪 */
.arc-track{ display:flex; align-items:flex-end; margin:0 auto; padding:0 6vw; }
.arc-card{
  position:relative; flex:0 0 auto;
  cursor:pointer;
  transition:filter .35s ease, opacity .35s ease;
}
/* 卡片本身的視覺（圖片/色塊/陰影/圓角/弧線位移）都收在 media 這層，
   這樣底下可以另外接一段「一直顯示」的說明文字，不會跟著弧線上下移動，
   每張卡片的文字才能對齊在同一條水平線上，不會互相重疊 */
.arc-card-media{
  position:relative; aspect-ratio:4/5;
  background:var(--brand); border-radius:var(--radius-sm); overflow:hidden;
  box-shadow:0 26px 50px rgba(30,30,34,.16);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
}
.arc-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.arc-card .avatar-fill{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-disp); font-size:26px; color:rgba(255,255,255,.9);
}
/* 電腦版：滑過去才浮現的名字條，蓋在圖片下緣 */
.arc-card .name-bar{
  position:absolute; left:0; right:0; bottom:0; padding:12px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,.62), transparent);
  color:#fff;
  opacity:0; transform:translateY(6px);
  transition:opacity .3s ease, transform .3s ease;
}
.arc-card .name-bar .cn{font-family:var(--font-cjk); font-weight:500; font-size:13.5px;}
.arc-card .name-bar .role{font-family:var(--font-mono); font-size:10px; opacity:.8;}
.arc-card:hover{
  filter:none !important; opacity:1 !important; z-index:99 !important;
}
.arc-card:hover .arc-card-media{
  transform:translateY(calc(var(--y, 0px) - 16px)) scale(1.06) !important;
  box-shadow:0 36px 70px rgba(30,30,34,.26);
}
.arc-card:hover .name-bar{opacity:1; transform:translateY(0);}
/* 手機版：一直顯示在圖片「下面」的小字說明，桌機不用 */
.name-caption{ display:none; }

.arc-hint{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; color:var(--ink-soft);
  padding:14px 0 4px;
}
.arc-hint .dot{width:5px; height:5px; border-radius:50%; background:var(--brand);}

/* 世界觀簡介：放在整排卡片最下面、置中的一個小區塊 */
.world-brief{
  display:flex; justify-content:center;
  margin:6px 0 40px;
}
.world-brief-inner{
  width:100%; max-width:420px; text-align:center;
  border-top:1px solid var(--line); padding-top:16px;
}
.world-brief .wb-label{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-soft);
  letter-spacing:.1em; margin-bottom:8px;
}
.world-brief p{ margin:0; font-size:13px; line-height:1.8; color:var(--ink); }

@media (max-width:820px){
  /* 手機版：跟電腦一樣是橫向的弧形卡片牆，用手指左右滑動瀏覽；
     卡片本身用 JS 算得比電腦版小一點，這裡只需要調整舞台高度跟字級。
     因為手機沒有 hover，圖片上蓋的名字條直接隱藏，改成一直顯示在圖片「下面」的小字說明。 */
  .arc-stage{
    height:clamp(290px, 47vh, 430px);
    -webkit-overflow-scrolling:touch;
  }
  .arc-hint{ padding-top:10px; }
  .arc-card .name-bar{ display:none; }
  .arc-card:hover .arc-card-media{ transform:translateY(var(--y, 0px)) !important; box-shadow:0 26px 50px rgba(30,30,34,.16); }
  .name-caption{
    display:block; text-align:center; padding:6px 4px 0;
  }
  .name-caption .cn{ font-family:var(--font-cjk); font-weight:500; font-size:10.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name-caption .role{ font-family:var(--font-mono); font-size:8px; color:var(--ink-soft); }
}

/* ================= PROFILE（近未來動態捲動版面） ================= */
.pf-avatar-wrap{
  min-height:64vh;
  display:flex; align-items:center; justify-content:center;
  padding:20px 0;
}
.pf-avatar-circle{
  width:clamp(160px,22vw,220px); aspect-ratio:1/1; border-radius:50%;
  overflow:hidden; position:relative;
  box-shadow:0 22px 46px rgba(42,42,46,.09);
  animation:pfFloat 7s ease-in-out infinite;
}
@keyframes pfFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-12px) scale(1.05);}
}
.pf-avatar-circle img{width:100%; height:100%; object-fit:cover; display:block;}
.pf-avatar-circle .avatar-fill{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-disp); font-size:30px;}

/* 捲動淡入：預設隱藏＋明顯下移＋縮小一點，進入畫面後 JS 會加上 .in-view 觸發過場 */
.pf-reveal{
  opacity:0; transform:translateY(46px) scale(.96);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
}
.pf-reveal.in-view{opacity:1; transform:translateY(0) scale(1);}

.pf-basic{
  text-align:center; max-width:480px; margin:0 auto 70px;
}
.pf-basic .p-code{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
.pf-basic h1{font-family:var(--font-disp); font-weight:600; font-size:clamp(26px,4vw,38px); margin:0 0 6px;}
.pf-basic .p-role{color:var(--ink-soft); font-size:14px; margin-bottom:26px;}
.pf-basic .field-list{
  text-align:left; background:var(--panel); border-radius:var(--radius);
  padding:2px 20px; margin-bottom:24px;
}
.pf-bio{
  text-align:left; font-size:14.5px; color:var(--ink); line-height:1.9;
}
.pf-bio p{margin:0 0 18px;}
.pf-bio p:last-child{margin-bottom:0;}

/* 立繪：固定貼在畫面左側當背景，疊在內容下方（z-index 較低），
   不會隨內容捲動而消失，但文字/頭像一定蓋在它上面，不會被立繪擋住 */
.pf-bg-fullbody{
  display:none;
  position:fixed; left:clamp(16px,4vw,64px); bottom:28px;
  width:min(34vw,480px); height:calc(100vh - 90px);
  overflow:hidden;
  z-index:0; pointer-events:none;
  opacity:0; filter:blur(24px);
  transform:scale(.92) translateY(14px);
  transition:opacity 1.8s ease, filter 1.8s ease, transform 1.8s cubic-bezier(.2,.7,.2,1);
}
.pf-bg-fullbody.show{display:block;}
.pf-bg-fullbody.in-view{opacity:1; filter:blur(0); transform:scale(1) translateY(0);}
.pf-bg-fullbody img{width:100%; height:100%; object-fit:contain; object-position:left bottom; display:block;}
.pf-fullbody-mobile{ display:none; }
@media (max-width:900px){
  .pf-bg-fullbody{display:none !important;}
  /* 手機沒有空間放左側固定背景，改成用一般捲動區塊顯示立繪，一樣沒有外框、等比縮放不裁切 */
  .pf-fullbody-mobile{
    display:block; max-width:420px; margin:0 auto 50px;
  }
  .pf-fullbody-mobile img{
    width:100%; height:auto; object-fit:contain; display:block;
  }
}
/* 有立繪背景時，整個角色頁內容往右挪，空間讓給左側的立繪；
   同時取消 #app 自己的置中最大寬度限制，避免寬螢幕時兩層留白疊加、間距過大 */
@media (min-width:901px){
  body.has-fullbody-bg #app{ max-width:none; }
  body.has-fullbody-bg .profile-view{
    margin-left:min(28vw,400px);
    padding-left:clamp(12px,2vw,28px);
  }
}

.field-list{
  display:grid; grid-template-columns:1fr 1fr;
  column-gap:20px;
}
.field{
  display:flex; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.field:last-child{border-bottom:none;}
.field .k{color:var(--ink-soft); font-family:var(--font-mono); font-size:11.5px; letter-spacing:.03em; padding-top:2px;}
@media (max-width:480px){
  .field-list{grid-template-columns:1fr;}
}
.field .v{text-align:right; max-width:60%;}

/* articles */
.article-list{display:flex; flex-direction:column;}
.article-row{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 0; border-bottom:1px solid var(--line);
  transition:padding-left .25s ease;
}
.article-row:hover{padding-left:8px;}
.article-row .a-main .a-title{font-size:15px; font-weight:500;}
.article-row .a-main .a-src{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.article-row .a-go{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:50%; width:28px; height:28px;
  display:flex; align-items:center; justify-content:center; flex:none;
  transition:all .25s ease;
}
.article-row:hover .a-go{border-color:var(--accent); color:#fff; background:var(--accent);}

/* gallery */
.gallery-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
@media (max-width:800px){.gallery-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:520px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
.gallery-thumb{
  aspect-ratio:1/1; position:relative; cursor:zoom-in; overflow:hidden; border-radius:var(--radius-sm); background:var(--panel);
}
.gallery-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease;}
.gallery-thumb:hover img{transform:scale(1.05);}
.gallery-thumb .avatar-fill{position:absolute; inset:0; color:#fff; font-family:var(--font-mono); font-size:12px;}

.empty-note{
  color:var(--ink-faint); font-family:var(--font-mono); font-size:12.5px; padding:20px 0;
}

/* ---------------- lightbox ---------------- */
#lightbox{
  position:fixed; inset:0; z-index:200;
  background:rgba(255,255,255,.97);
  display:none; align-items:center; justify-content:center;
  flex-direction:column;
}
#lightbox.open{display:flex; animation:fadeIn .3s ease both;}
#lightbox img{max-width:min(86vw,900px); max-height:74vh; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,.12);}
.lb-cap{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); margin-top:16px;}
.lb-close{
  position:absolute; top:26px; right:clamp(20px,4vw,56px);
  font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:999px; padding:8px 16px; background:var(--bg);
}
.lb-close:hover{border-color:var(--accent); color:var(--accent);}
.lb-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono);
}
.lb-nav:hover{border-color:var(--accent); color:var(--accent);}
.lb-prev{left:clamp(14px,4vw,48px);}
.lb-next{right:clamp(14px,4vw,48px);}

footer{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  padding:28px clamp(20px,4vw,56px);
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
body.has-fullbody-bg footer{ border-top:none; }
/* ---------------- 自訂游標 ---------------- */
#cursor{
  position:fixed; top:0; left:0; z-index:9999;
  width:26px; height:26px; margin:-13px 0 0 -13px;
  border-radius:50%;
  border:1.4px solid rgba(42,42,46,.75);
  background:rgba(42,42,46,.06);
  pointer-events:none;
  will-change:transform;
  transition:width .22s cubic-bezier(.2,.8,.2,1), height .22s cubic-bezier(.2,.8,.2,1),
             margin .22s cubic-bezier(.2,.8,.2,1), background-color .18s ease, border-color .25s ease;
}
@media (hover:hover) and (pointer:fine){
  *{cursor:none;}
}
@media (hover:none), (pointer:coarse){
  #cursor{display:none;}
}
#cursor.is-hover{
  width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
  background:#2a2a2e; border-color:#2a2a2e;
}
.cursor-trail{
  position:fixed; top:0; left:0; z-index:9998;
  border-radius:50%;
  background:var(--brand);
  pointer-events:none;
  will-change:transform;
}
@media (hover:none), (pointer:coarse){
  .cursor-trail{display:none;}
}

/* ================= 進站開場動畫（圓點地球） ================= */
#intro-splash{
  position:fixed; inset:0; z-index:999999;
  background:#404aff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:opacity .6s ease;
}
#intro-splash.hide{ opacity:0; pointer-events:none; }
.intro-globe-wrap{
  width:min(46vw,220px); aspect-ratio:1/1;
  animation:introSpin 3.2s linear infinite;
}
.intro-globe-wrap svg{ width:100%; height:100%; display:block; }
/* 結束時不是直接淡出消失，而是從地球的位置長出一個白色圓圈，
   撐大到蓋滿整個畫面（變成全白），再讓整個開場動畫淡出，
   銜接到首頁，感覺比較像「展開進入」而不是硬切換 */
.intro-expand{
  position:absolute; left:50%; top:50%; width:160vmax; height:160vmax;
  margin:-80vmax 0 0 -80vmax; border-radius:50%; background:#ffffff;
  transform:scale(0);
  transition:transform .9s cubic-bezier(.5,0,.2,1);
}
.intro-expand.grow{ transform:scale(1); }
.intro-dot{
  opacity:0; transform-origin:center; transform-box:fill-box;
  transform:scale(.2);
  animation:introDotIn .35s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes introDotIn{ to{ opacity:1; transform:scale(1); } }
@keyframes introSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
</style>

<script>
/* ============================================================
   資料區（DATA）
   要換成你自己的角色：
   - avatarImg / fullbodyImg 留空字串 "" 會顯示佔位色塊；
     填入圖片路徑（例如 "images/角色/avatar.jpg"）就會改成顯示真實圖片。
   - gallery 陣列每一項為 { thumb, full, caption }，同樣可留空顯示佔位。
   - articles 陣列每一項為 { title, src, url }，url 可為外部連結（同人誌網站、社群貼文等）。
============================================================ */
/* 世界觀介紹文字（名稱／代號／簡述／介紹卡片）現在從 worlds.json 讀取，
   在後台的「世界觀 Worlds」分類裡就能直接編輯，不用改這支 index.html。
   這裡先放一份跟 worlds.json 一樣的內容當備援，避免 worlds.json 讀取失敗時整頁掛掉。
   注意：這裡只是「介紹文字」的資料，真正的角色列表還是各自存在
   characters-mafia.json / characters-ancient.json / characters-hero.json 這幾個檔案裡，
   兩邊的 slug（例如 "mafia"）要一致，角色才會被歸到對的世界觀底下。 */
let WORLD_META = {
  mafia:  { name:'MAFIA',   code:'W-01', desc:'A criminal underworld built on power, contracts, and family loyalty.',
    brief:'現代黑手黨世界觀，三大黑幫家族佔據了西西里，分別是坎圖家族、羅西家族與馬拉斯家族。這裡訴說的是他們的故事。' },
  ancient:{ name:'ANCIENT', code:'W-02', desc:'An alternate ancient-East setting where court politics and jianghu coexist.',
    brief:'Placeholder text — replace with your own worldbuilding. An empire in decline, held together by ritual and rumor. Wandering swordsmen drift between border garrisons and the capital, carrying messages no one will say out loud.' },
  hero:   { name:'HERO',    code:'W-03', desc:'A contemporary order of licensed superhumans.',
    brief:'Placeholder text — replace with your own worldbuilding. Powers were legalized eleven years ago and immediately turned into a ranking system. Every hero answers to a division; not every division agrees on what "answer to" means.' },
};

async function loadWorldMeta(){
  try{
    const res = await fetch('./worlds.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.worlds || []);
    if(list.length){
      const merged = {};
      list.forEach(w=>{ if(w.slug) merged[w.slug] = { name:w.name, code:w.code, desc:w.desc, brief:w.brief }; });
      WORLD_META = merged;
    }
  }catch(err){
    console.warn('無法讀取 worlds.json，改用內建備援世界觀資料。', err);
  }
}

/* 首頁縮圖預覽區（moodboard）—— 自動從角色資料裡「已經有上傳圖片」的角色收集
   大頭照＋Gallery 縮圖，每次整理頁面會重新洗牌隨機排序。電腦只留一排、手機留兩排，
   多出來的用 CSS 裁掉，不用手動維護清單，之後角色/圖片增加會自動反映。 */
function buildThumbPool(){
  const pool = [];
  CHARACTERS.forEach(ch=>{
    if(ch.avatarImg) pool.push(ch.avatarImg);
    (ch.gallery||[]).forEach(g=>{ if(g.thumb) pool.push(g.thumb); });
  });
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool;
}

/* 角色資料現在拆成 4 個外部檔案讀取（見下方 CHARACTER_SOURCES），
   之後要新增/修改角色，直接在後台（/admin/）編輯即可，完全不用碰這支 index.html。 */
let CHARACTERS = [];

/* 讀不到角色資料檔案時（例如用 file:// 直接打開）顯示的內建備用資料，避免整頁空白 */
const FALLBACK_CHARACTERS = [
  {
    id:'sample-01', category:'original',
    codename:'Sample Character', realname:'—', role:'Placeholder',
    affiliation:'—', skill:'—', status:'active',
    bio:'This is placeholder data. See the on-screen notice for how to load your real character data files.',
    avatarImg:'', fullbodyImg:'', articles:[], gallery:[],
  },
];

const STATUS_LABEL = { alive:'Alive', dead:'Dead' };
const STATUS_COLOR = { alive:'#3fa66a', dead:'#5a5a5e' };

/* 佔位色塊統一使用單一藍色（品牌色），不做漸層深淺，所有沒放圖的角色看起來色調一致 */
function placeholderStyle(seed, sat, light1, light2){
  return `background:var(--brand);`;
}
function avatarBlock(ch, size){
  if(ch.avatarImg){ return `<img src="${ch.avatarImg}" alt="${ch.codename}">`; }
  return `<div class="avatar-fill" style="${placeholderStyle(ch.id)}">${ch.codename.slice(0,1)}</div>`;
}
function fullbodyBlock(ch){
  if(ch.fullbodyImg){ return `<img src="${ch.fullbodyImg}" alt="${ch.codename} full body art">`; }
  return `<div class="avatar-fill" style="${placeholderStyle(ch.id+'fb')}; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.85); font-family:var(--font-mono); font-size:12px;">Full body art not uploaded</div>`;
}
function galleryThumb(item, ch, idx){
  if(item.thumb){ return `<img src="${item.thumb}" alt="">`; }
  return `<div class="avatar-fill" style="${placeholderStyle(ch.id+'g'+idx,24,70,86)}">IMG_${String(idx+1).padStart(2,'0')}</div>`;
}

/* ============================================================
   路由與換頁動畫
============================================================ */
const app = document.getElementById('app');
const wipe = document.getElementById('wipe');
let wiping = false;

function runWipe(renderFn){
  if(wiping) return;
  wiping = true;
  wipe.classList.remove('run'); void wipe.offsetWidth;
  wipe.classList.add('run');
  setTimeout(()=>{
    renderFn();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }, wipe.getAnimationDuration ? 0 : 300); /* mid-wipe swap */
  setTimeout(()=>{ wiping=false; }, 640);
}

window.addEventListener('hashchange', ()=> runWipe(route));
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('foot-time').textContent = 'REV. ' + new Date().toISOString().slice(0,10);
  loadWorldMeta().then(loadCharacters);
  runIntroSplash();
});

/* 用小圓點排成一顆球，模擬「地球」的開場動畫；
   點的位置用數學算（緯線一圈一圈往下切），不用手動排 */
function buildIntroGlobe(container){
  const svgNS = 'http://www.w3.org/2000/svg';
  const size = 220, R = 96, cx = size/2, cy = size/2;
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  const rows = 19;
  const dots = [];
  for(let row=0; row<rows; row++){
    const y = -R + (row/(rows-1))*2*R;
    const rowHalf = Math.sqrt(Math.max(0, R*R - y*y));
    const count = Math.max(1, Math.round(rowHalf/6.4));
    for(let i=0; i<count; i++){
      const x = count>1 ? -rowHalf + (i/(count-1))*2*rowHalf : 0;
      if(Math.sqrt(x*x+y*y) > R) continue;
      dots.push({x:cx+x, y:cy+y});
    }
  }
  dots.forEach(d=>{
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', d.x.toFixed(1));
    c.setAttribute('cy', d.y.toFixed(1));
    c.setAttribute('r', '2.3');
    c.setAttribute('fill', '#fff');
    c.setAttribute('class', 'intro-dot');
    const dist = Math.hypot(d.x-cx, d.y-cy) / R;
    c.style.animationDelay = (dist*0.28 + Math.random()*0.12).toFixed(2) + 's';
    svg.appendChild(c);
  });
  container.appendChild(svg);
}

/* 開場動畫：圓點地球跑一輪之後，從地球位置「長出」一個白色圓圈撐滿全螢幕，
   蓋滿之後整個開場畫面才淡出，銜接到首頁——不是直接切換不見。
   也可以直接點一下跳過（跳過時一樣會走展開的銜接動畫，只是提早開始）。 */
function runIntroSplash(){
  const el = document.getElementById('intro-splash');
  if(!el) return;
  buildIntroGlobe(el.querySelector('.intro-globe-wrap'));
  const expand = el.querySelector('.intro-expand');
  let dismissed = false;
  const dismiss = ()=>{
    if(dismissed) return;
    dismissed = true;
    expand.classList.add('grow');
    setTimeout(()=>{
      el.classList.add('hide');
      setTimeout(()=>{ el.remove(); }, 500);
    }, 900);
  };
  el.addEventListener('click', dismiss);
  setTimeout(dismiss, 1150);
}

/* 角色資料現在拆成 4 個檔案，對應後台的分類/世界觀資料夾，
   category 跟 world 不再存在 JSON 裡面，而是依照「這筆角色放在哪個檔案」自動決定——
   這樣在後台把角色移到不同的資料夾，分類就會自動改變，不用另外選欄位。
     characters-original.json → category: original
     characters-mafia.json    → category: coop, world: mafia
     characters-ancient.json  → category: coop, world: ancient
     characters-hero.json     → category: coop, world: hero
   注意：如果你是直接雙擊 index.html 打開（file:// 開頭的網址），瀏覽器基於安全性考量
   通常會擋掉這個讀取動作。這種情況下請改用下面兩種方式測試：
   1. 把整包檔案上傳到任何免費靜態網站空間（例如 GitHub Pages、Netlify、Vercel 都是免費的），
      用網址打開就不會有這個問題。
   2. 或在這個資料夾裡開終端機執行 `python3 -m http.server`，然後瀏覽器打開
      http://localhost:8000 來本機測試。
   讀取失敗時，畫面會顯示提示，並先用少量內建範例資料頂著，不會整頁空白。 */
const CHARACTER_SOURCES = [
  { file: './characters-original.json',  category: 'original', world: null },
  { file: './characters-mafia.json',     category: 'coop', world: 'mafia' },
  { file: './characters-ancient.json',   category: 'coop', world: 'ancient' },
  { file: './characters-hero.json',      category: 'coop', world: 'hero' },
  { file: './characters-fantasy.json',   category: 'coop', world: 'fantasy' },
  { file: './characters-football.json',  category: 'coop', world: 'football' },
  { file: './characters-victorian.json', category: 'coop', world: 'victorian' },
  { file: './characters-other.json',     category: 'coop', world: 'other' },
];

async function loadCharacters(){
  try{
    const results = await Promise.all(CHARACTER_SOURCES.map(async src=>{
      const res = await fetch(src.file, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status+' — '+src.file);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.characters || []);
      return list.map(ch=>({ ...ch, category: src.category, ...(src.world?{world:src.world}:{}) }));
    }));
    const merged = results.flat();
    if(!merged.length) throw new Error('All character files loaded but were empty.');
    CHARACTERS = merged;
  }catch(err){
    console.warn('無法讀取角色資料檔案，改用內建範例資料。', err);
    CHARACTERS = FALLBACK_CHARACTERS;
    showDataWarning();
  }
  route();
}

function showDataWarning(){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed; left:0; right:0; bottom:0; z-index:300; background:var(--ink); color:#fff; font-family:var(--font-mono); font-size:12px; padding:12px 20px; text-align:center;';
  bar.innerHTML = 'Could not load character data files — showing sample data instead. Host this site or run a local server to load your real data. <span style="text-decoration:underline; cursor:pointer; margin-left:8px;" onclick="this.parentElement.remove()">dismiss</span>';
  document.body.appendChild(bar);
}

function setCrumb(parts){
  const el = document.getElementById('crumb');
  el.innerHTML = parts.map((p,i)=>{
    const isLast = i===parts.length-1;
    return `<span class="seg" ${p.hash?`onclick="location.hash='${p.hash}'"`:''} style="${isLast?'color:var(--ink)':''}">${p.label}</span>` + (isLast?'':'<span class="sep">/</span>');
  }).join('');
}

function setWorldTheme(world){
  document.body.classList.toggle('theme-mafia', world==='mafia');
  document.body.classList.toggle('theme-ancient', world==='ancient');
  document.body.classList.toggle('theme-fantasy', world==='fantasy');
  document.body.classList.toggle('theme-football', world==='football');
  document.body.classList.toggle('theme-victorian', world==='victorian');
}

function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);

  if(parts.length===0){ document.body.classList.add('is-gate'); hideFullbodyBackground(); setWorldTheme(null); return renderGate(); }
  document.body.classList.remove('is-gate');
  if(parts[0]==='index'){ hideFullbodyBackground(); setWorldTheme(null); return renderHome(); }
  if(parts[0]==='coop' && parts.length===1){ hideFullbodyBackground(); setWorldTheme(null); return renderCoopWorlds(); }
  if(parts[0]==='grid' && parts[1]==='original'){ hideFullbodyBackground(); setWorldTheme(null); return renderGrid('original'); }
  if(parts[0]==='grid' && parts[1]==='coop' && parts[2]){ hideFullbodyBackground(); setWorldTheme(parts[2]); return renderGrid('coop', parts[2]); }
  if(parts[0]==='about'){ hideFullbodyBackground(); setWorldTheme(null); return renderAbout(); }
  if(parts[0]==='char' && parts[1]){ return renderProfile(parts[1]); }
  hideFullbodyBackground();
  setWorldTheme(null);
  return renderHome();
}

/* 兩個分類節點的漂浮動畫：位置用 sine 波動計算，line 座標每一影格重新畫，
   讓連接線始終準確跟著兩個圓圈移動。離開這頁時透過 field 是否還在畫面上自動停止。 */
function initNodeField(){
  const field = document.getElementById('node-field');
  const svg = document.getElementById('node-svg');
  const line = svg.querySelector('line');
  const nodes = [
    { el:document.getElementById('node-a'), baseXPct:32, baseYPct:40, ampX:26, ampY:18, speed:0.00033, phase:0,
      breathSpeed:0.0009, breathPhase:0, hoverT:0, hoverC:0 },
    { el:document.getElementById('node-b'), baseXPct:68, baseYPct:60, ampX:20, ampY:24, speed:0.00026, phase:2.4,
      breathSpeed:0.0007, breathPhase:1.8, hoverT:0, hoverC:0 },
  ];
  nodes.forEach(n=>{
    n.el.addEventListener('mouseenter', ()=>{ n.hoverT = 1; });
    n.el.addEventListener('mouseleave', ()=>{ n.hoverT = 0; });
  });
  function tick(t){
    if(!document.body.contains(field)) return; /* 已離開此頁，停止動畫 */
    const rect = field.getBoundingClientRect();
    nodes.forEach(n=>{
      const baseX = rect.width * n.baseXPct/100;
      const baseY = rect.height * n.baseYPct/100;
      const x = baseX + Math.sin(t*n.speed + n.phase) * n.ampX;
      const y = baseY + Math.cos(t*n.speed*1.35 + n.phase) * n.ampY;
      n.el.style.left = x+'px';
      n.el.style.top = y+'px';
      n._x = x; n._y = y;

      /* 呼吸感：緩慢的縮放 + 些微透明度變化，兩個節點頻率/相位不同，不會同步呼吸 */
      const breath = Math.sin(t*n.breathSpeed + n.breathPhase);
      n.hoverC += (n.hoverT - n.hoverC) * 0.15; /* 平滑地放大／縮回 */
      const scale = 1 + breath*0.05 + n.hoverC*0.30;
      const opacity = 0.9 + (breath+1)/2*0.1;
      n.el.style.transform = `translate(-50%,-50%) scale(${scale.toFixed(3)})`;
      n.el.style.opacity = opacity.toFixed(3);
    });
    line.setAttribute('x1', nodes[0]._x);
    line.setAttribute('y1', nodes[0]._y);
    line.setAttribute('x2', nodes[1]._x);
    line.setAttribute('y2', nodes[1]._y);
    /* 連接線也有自己的呼吸節奏，比節點慢一些、幅度更小 */
    line.style.opacity = (0.55 + (Math.sin(t*0.00045)+1)/2*0.25).toFixed(3);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* 角色列表的弧形卡片牆：電腦是橫向一排、重疊、中間拱起、滾輪橫向瀏覽；
   手機是直向一排、置中、上下滑，寬度跟著弧線公式起伏。
   兩種版面共用同一組角色資料跟弧線公式，只是電腦用「橫向位移＋寬度」，
   手機用「純寬度起伏」（不做左右歪斜，保持置中，之前試過交錯版但不好看）。 */
function buildArcStage(list){
  if(!list.length){ return `<div class="empty-note">No characters recorded yet.</div>`; }

  const isMobile = window.innerWidth <= 820;
  const n = list.length;
  const peakIdx = (n-1)/2;
  /* 手機因為圖片下面現在有文字說明，重疊不能像電腦那麼多，
     不然旁邊卡片的名字會擠在一起看不清楚 */
  const OVERLAP = isMobile ? 0.22 : 0.46;

  /* 手機跟電腦現在用同一套「橫向弧形卡片牆」邏輯，用手指/滾輪左右瀏覽，
     只有卡片尺寸（vw 數值）跟拱起幅度依螢幕縮小，排版公式完全一樣 */
  const baseW = isMobile ? 20 : 9.2;    // vw
  const wRange = isMobile ? 11 : 5.4;   // vw
  const yRange = isMobile ? 40 : 74;    // px

  let html = '';
  list.forEach((ch,i)=>{
    const t = n>1 ? i/(n-1) : 0.5;
    const arc = Math.sin(Math.PI * t);
    const wobble = Math.sin(t*Math.PI*2.4 + i*0.7)*0.12;
    const k = Math.min(1, Math.max(0, arc + wobble));
    const w = +(baseW + wRange * k).toFixed(2);
    const y = -Math.round(yRange * k);
    const dist = Math.abs(i - peakIdx);
    const z = Math.round(100 - dist*10);
    /* 手機沒有 hover，名字條在 CSS 裡改成一直顯示；
       淡出/降飽和拿來凸顯「最中間那張最清楚」，電腦手機都保留同樣效果 */
    const fade = Math.max(0, 1 - dist*0.09);
    const sat = Math.max(35, 100 - dist*13);

    /* --y／translateY 只放在 arc-card-media（圖片本身）上，
       這樣下面的說明文字才不會跟著弧線一起被拉高拉低，
       每張卡片的文字可以對齊在同一條水平線上 */
    const cardStyle = [
      `width:${w}vw`, `z-index:${z}`, `opacity:${fade.toFixed(2)}`, `filter:saturate(${sat}%)`,
      `margin-left:${i===0 ? 0 : '-'+(w*OVERLAP).toFixed(2)+'vw'}`,
    ].join('; ');
    const mediaStyle = [`--y:${y}px`, `transform:translateY(${y}px)`].join('; ');

    html += `
    <a class="arc-card" href="#/char/${ch.id}" style="${cardStyle}">
      <div class="arc-card-media" style="${mediaStyle}">
        ${avatarBlock(ch)}
        <div class="name-bar">
          <div class="cn">${ch.codename}</div>
          <div class="role">${ch.role}</div>
        </div>
      </div>
      <div class="name-caption">
        <div class="cn">${ch.codename}</div>
      </div>
    </a>`;
  });

  const hintLabel = isMobile ? 'SWIPE TO BROWSE' : 'SCROLL TO BROWSE';
  return `
  <div class="arc-stage" id="arc-stage"><div class="arc-track" id="arc-track">${html}</div></div>
  <div class="arc-hint"><span class="dot"></span> ${hintLabel}</div>`;
}

/* 電腦滾輪轉成橫向捲動（手機直接用手指滑就好，不用另外處理）；
   不論手機電腦，一開始都自動把畫面對準弧線最高點（最中間那張） */
/* 卡片淡出/降飽和原本是照「資料清單裡的順序」算好、寫死成 inline style，
   一開始置中的那張剛好也是清單正中間那張，所以看起來對。
   但滑鼠滾輪／手指滑動之後，畫面正中間的卡片會變成別張，樣式卻不會跟著動，
   所以要改成即時算「目前哪張在舞台正中間」，動態更新透明度/飽和度。 */
function updateArcFocus(stage){
  const cards = stage.querySelectorAll('.arc-card');
  if(!cards.length) return;
  const stageRect = stage.getBoundingClientRect();
  const centerX = stageRect.left + stageRect.width/2;
  const half = stageRect.width/2 || 1;
  cards.forEach(card=>{
    const r = card.getBoundingClientRect();
    const cardCenter = r.left + r.width/2;
    const dist = Math.abs(cardCenter - centerX) / half; // 0（正中間）往外變大
    const fade = Math.max(0.32, 1 - dist*1.15);
    const sat = Math.max(35, 100 - dist*115);
    card.style.opacity = fade.toFixed(2);
    card.style.filter = `saturate(${sat.toFixed(0)}%)`;
  });
}

function initArcStage(){
  const stage = document.getElementById('arc-stage');
  if(!stage) return;
  const track = document.getElementById('arc-track');
  if(window.innerWidth > 820){
    stage.addEventListener('wheel', (e)=>{
      e.preventDefault();
      /* 滑鼠滾輪多半只會送出 deltaY，觸控板左右滑則是送 deltaX，
         兩種都要接住，不然用觸控板橫滑會完全沒反應 */
      stage.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    }, {passive:false});
  }
  let ticking = false;
  stage.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ updateArcFocus(stage); ticking = false; });
  }, {passive:true});
  requestAnimationFrame(()=>{
    const cardsEls = track.querySelectorAll('.arc-card');
    if(!cardsEls.length) return;
    const peakEl = cardsEls[Math.round((cardsEls.length-1)/2)];
    const target = peakEl.offsetLeft + peakEl.offsetWidth/2 - stage.clientWidth/2;
    stage.scrollLeft = Math.max(0, target);
    updateArcFocus(stage);
  });
}

/* 視窗寬度跨過手機/電腦的門檻（820px）時，角色列表頁要重新排版
   （橫向排列 vs 直向排列的算法不一樣），其他頁面不受影響 */
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(!lastGridArgs) return;
    const nowMobile = window.innerWidth <= 820;
    if(nowMobile !== lastGridIsMobile && location.hash.startsWith('#/grid/')){
      renderGrid(...lastGridArgs);
    }
  }, 200);
});

/* ---------------- PROFILE ---------------- */
function bioParagraphs(text){
  /* 簡介文字支援分段落：CMS 的文字框裡，空一行代表分段，這裡會自動轉成一個一個 <p> */
  return text.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

function renderProfile(id){
  const ch = CHARACTERS.find(c=>c.id===id);
  if(!ch){ app.innerHTML = `<div class="view empty-note">Character record not found.</div>`; setCrumb([{label:'Home',hash:'#/index'}]); setWorldTheme(null); return; }

  setWorldTheme(ch.category==='coop' ? ch.world : null);

  const crumbParts = [{label:'Home',hash:'#/index'}];
  if(ch.category==='original'){ crumbParts.push({label:'ORIGINAL',hash:'#/grid/original'}); }
  else{ crumbParts.push({label:'Collab',hash:'#/coop'}, {label:WORLD_META[ch.world].name, hash:`#/grid/coop/${ch.world}`}); }
  crumbParts.push({label:ch.codename});
  setCrumb(crumbParts);

  const fields = [
    ['Real Name', ch.realname||'—'],
    ['Affiliation', ch.affiliation||'—'],
    ['Skill', ch.skill||'—'],
    ['Height', ch.height||'—'],
    ['Birthday', ch.birthday||'—'],
    ['Age', ch.age||'—'],
    ['CP', ch.cp||'—'],
    ['Status', `${STATUS_LABEL[ch.status]||ch.status}`],
  ].map(([k,v])=>`<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  const articles = ch.articles && ch.articles.length ? ch.articles.map(a=>`
    <a class="article-row" href="${a.url}" target="_blank" rel="noopener">
      <div class="a-main"><div class="a-title">${a.title}</div><div class="a-src">${a.src}</div></div>
      <div class="a-go">↗</div>
    </a>
  `).join('') : `<div class="empty-note">No articles yet.</div>`;

  const gallery = ch.gallery && ch.gallery.length ? ch.gallery.map((g,i)=>`
    <div class="gallery-thumb" onclick="openLightbox('${ch.id}', ${i})">
      ${galleryThumb(g, ch, i)}
    </div>
  `).join('') : `<div class="empty-note">No images yet.</div>`;

  app.innerHTML = `
  <div class="view profile-view">
    <div class="pf-avatar-wrap">
      <div class="pf-avatar-circle">${avatarBlock(ch)}</div>
    </div>

    <div class="pf-reveal pf-basic">
      <div class="p-code">${ch.id.toUpperCase()} · ${STATUS_LABEL[ch.status]||ch.status}</div>
      <h1>${ch.codename}</h1>
      <div class="p-role">${ch.role}</div>
      <div class="field-list">${fields}</div>
      ${ch.bio ? `<div class="pf-bio">${bioParagraphs(ch.bio)}</div>` : ''}
    </div>

    ${ch.fullbodyImg ? `
    <div class="pf-reveal pf-fullbody-mobile">
      <img src="${ch.fullbodyImg}" alt="${ch.codename} full body art">
    </div>` : ''}

    <div class="pf-reveal">
      <div class="section-head"><h2>Articles</h2><div class="section-count">ARTICLES</div></div>
      <div class="article-list">${articles}</div>
    </div>

    <div class="pf-reveal">
      <div class="section-head"><h2>Gallery</h2><div class="section-count">${(ch.gallery||[]).length} FILES</div></div>
      <div class="gallery-grid">${gallery}</div>
    </div>
  </div>`;

  initProfileReveal();
  setupFullbodyBackground(ch);
}

/* 立繪固定背景：貼在畫面左側、疊在內容下方，換頁時如果沒有立繪或離開角色頁就隱藏 */
function setupFullbodyBackground(ch){
  let bg = document.getElementById('pf-bg-fullbody');
  if(!bg){
    bg = document.createElement('div');
    bg.id = 'pf-bg-fullbody';
    bg.className = 'pf-bg-fullbody';
    bg.innerHTML = '<img id="pf-bg-fullbody-img" alt="">';
    document.body.appendChild(bg);
  }
  bg.classList.remove('in-view');
  if(ch.fullbodyImg){
    const img = document.getElementById('pf-bg-fullbody-img');
    img.src = ch.fullbodyImg;
    img.alt = ch.codename + ' full body art';
    bg.classList.add('show');
    document.body.classList.add('has-fullbody-bg');
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bg.classList.add('in-view'); }); });
  } else {
    bg.classList.remove('show');
    document.body.classList.remove('has-fullbody-bg');
  }
}
function hideFullbodyBackground(){
  const bg = document.getElementById('pf-bg-fullbody');
  if(bg){ bg.classList.remove('show','in-view'); }
  document.body.classList.remove('has-fullbody-bg');
}

/* 角色頁的捲動淡入：進入畫面的區塊才觸發淡入＋上移，觸發過一次就不再重複 */
function initProfileReveal(){
  const els = document.querySelectorAll('.pf-reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in-view')); return; }
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:0.15, rootMargin:'0px 0px -60px 0px'});
  els.forEach(el=>obs.observe(el));
}

/* ============================================================
   燈箱 Lightbox
============================================================ */
let lbState = { charId:null, index:0 };
function openLightbox(charId, index){
  lbState = { charId, index };
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', lbKeyHandler);
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKeyHandler);
}
function lbNav(dir){
  const ch = CHARACTERS.find(c=>c.id===lbState.charId);
  const len = ch.gallery.length;
  lbState.index = (lbState.index + dir + len) % len;
  renderLightbox();
}
function lbKeyHandler(e){
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbNav(-1);
  if(e.key==='ArrowRight') lbNav(1);
}
function renderLightbox(){
  const ch = CHARACTERS.find(c=>c.id===lbState.charId);
  const item = ch.gallery[lbState.index];
  const img = document.getElementById('lb-img');
  if(item.full){
    img.style.display='block';
    img.src = item.full;
  } else {
    img.style.display='none';
  }
  const cap = document.getElementById('lb-cap');
  cap.textContent = `${ch.codename} · IMG_${String(lbState.index+1).padStart(2,'0')}${item.caption ? ' · '+item.caption : ''}  (${lbState.index+1}/${ch.gallery.length})`;

  /* 若無真實圖片，顯示放大版佔位色塊 */
  let ph = document.getElementById('lb-placeholder');
  if(ph) ph.remove();
  if(!item.full){
    ph = document.createElement('div');
    ph.id='lb-placeholder';
    ph.style.cssText = `width:min(70vw,640px); height:min(70vh,640px); ${placeholderStyle(ch.id+'g'+lbState.index,24,68,84)} display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:14px;`;
    ph.textContent = `IMG_${String(lbState.index+1).padStart(2,'0')} full image not uploaded`;
    img.insertAdjacentElement('afterend', ph);
  }
}
/* ============================================================
   自訂游標：主圓圈緊貼滑鼠，後面拖著一串會漸漸變小、變透明的
   殘影圓圈，製造圓形殘影拖曳感。移到連結上主圓圈會變實心。
============================================================ */
const cursor = document.createElement('div');
cursor.id = 'cursor';
document.body.appendChild(cursor);

const TRAIL_COUNT = 4;
const TRAIL_SIZES    = [14, 11, 8, 6];
const TRAIL_OPACITY  = [1, 1, 1, 1];
const trailDots = Array.from({length:TRAIL_COUNT}, (_, i)=>{
  const d = document.createElement('div');
  d.className = 'cursor-trail';
  d.style.width = d.style.height = TRAIL_SIZES[i]+'px';
  d.style.marginLeft = d.style.marginTop = (-TRAIL_SIZES[i]/2)+'px';
  d.style.opacity = TRAIL_OPACITY[i];
  document.body.appendChild(d);
  return { el:d, x:window.innerWidth/2, y:window.innerHeight/2 };
});

let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let curX = mouseX, curY = mouseY;

const HOVER_SELECTOR = 'a, button, .gallery-thumb, .crumb .seg, .brand';

window.addEventListener('mousemove', (e)=>{
  mouseX = e.clientX; mouseY = e.clientY;
});
document.addEventListener('mouseover', (e)=>{ if(e.target.closest(HOVER_SELECTOR)) cursor.classList.add('is-hover'); });
document.addEventListener('mouseout', (e)=>{ if(e.target.closest(HOVER_SELECTOR)) cursor.classList.remove('is-hover'); });

(function cursorLoop(){
  curX += (mouseX - curX) * 0.5;
  curY += (mouseY - curY) * 0.5;
  cursor.style.transform = `translate(${curX}px, ${curY}px)`;

  let prevX = curX, prevY = curY;
  trailDots.forEach((t, i)=>{
    const lerp = Math.max(0.45 - i*0.06, 0.16); /* 越後面跟得越慢，自然拉開間距 */
    t.x += (prevX - t.x) * lerp;
    t.y += (prevY - t.y) * lerp;
    t.el.style.transform = `translate(${t.x}px, ${t.y}px)`;
    prevX = t.x; prevY = t.y;
  });

  requestAnimationFrame(cursorLoop);
})();
</script>
