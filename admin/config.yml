backend:
  name: git-gateway
  branch: main

# 圖片上傳後會放在這個資料夾（網站裡的 images/uploads/）
media_folder: "images/uploads"
public_folder: "/images/uploads"

# 存檔後直接發布，不需要額外審核流程
publish_mode: simple

# ------------------------------------------------------------------
# 角色資料拆成 4 個檔案，分屬兩個大分類的資料夾：
#   企劃 Original
#     └─ characters-original.json
#   共構 Collab
#     ├─ MAFIA   → characters-mafia.json
#     ├─ ANCIENT → characters-ancient.json
#     └─ HERO    → characters-hero.json
#
# 左側選單會先看到「企劃 Original」「共構 Collab」兩個大分類，
# 點開「共構 Collab」才會看到 MAFIA / ANCIENT / HERO 三個子項，
# 點進去才是該世界觀底下的角色列表——不會再把 30 幾個角色全部塞在同一頁。
#
# 世界觀（world）跟分類（category）已經不是角色資料裡的欄位了，
# 而是由「這個角色被放進哪一個資料夾」自動決定：
# 把角色移到 MAFIA 資料夾，他就自動變成 MAFIA 世界觀的角色，不需要另外選欄位。
# ------------------------------------------------------------------

collections:
  - name: "worlds"
    label: "世界觀 Worlds"
    files:
      - file: "worlds.json"
        label: "世界觀介紹 World Intros"
        name: "worlds"
        fields:
          - label: "世界觀列表 Worlds"
            name: "worlds"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "代號 Slug（英文小寫，例如 mafia／ancient／hero，新增世界觀時要跟角色檔案的 world 對應，請先跟我確認）", name: "slug", widget: "string"}
              - {label: "名稱 Name（顯示在畫面上，例如 MAFIA）", name: "name", widget: "string"}
              - {label: "編號 Code（例如 W-01）", name: "code", widget: "string", required: false}
              - {label: "簡短說明 Short Desc（顯示在共構世界選單卡片上）", name: "desc", widget: "text", required: false}
              - {label: "介紹全文 Brief（顯示在該世界觀角色列表頁的浮動卡片裡）", name: "brief", widget: "text", required: false}

  - name: "original"
    label: "企劃 Original"
    files:
      - file: "characters-original.json"
        label: "企劃角色 Original Characters"
        name: "original_characters"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields:
              - {label: "ID（例如 orig-01，同一個資料夾底下不要重複）", name: "id", widget: "string"}
              - {label: "代號 Codename", name: "codename", widget: "string"}
              - {label: "本名 Real Name", name: "realname", widget: "string", required: false, default: "—"}
              - {label: "身分 Role", name: "role", widget: "string", required: false, default: "—"}
              - {label: "所屬 Affiliation", name: "affiliation", widget: "string", required: false, default: "—"}
              - {label: "專長 Skill", name: "skill", widget: "string", required: false, default: "—"}
              - {label: "身高 Height", name: "height", widget: "string", required: false}
              - {label: "生日 Birthday", name: "birthday", widget: "string", required: false}
              - {label: "年齡 Age", name: "age", widget: "string", required: false}
              - {label: "CP", name: "cp", widget: "string", required: false}
              - {label: "狀態 Status", name: "status", widget: "select", options: [
                  {label: "生存 Alive", value: "alive"},
                  {label: "死亡 Dead", value: "dead"}
                ], default: "alive"}
              - {label: "簡介 Bio（想分段的話，中間空一行就會自動分段）", name: "bio", widget: "text", required: false}
              - {label: "大頭照 Avatar Image", name: "avatarImg", widget: "image", required: false}
              - {label: "全身立繪 Fullbody Image", name: "fullbodyImg", widget: "image", required: false}
              - label: "外連文章 Articles"
                name: "articles"
                widget: "list"
                required: false
                fields:
                  - {label: "標題 Title", name: "title", widget: "string"}
                  - {label: "連結 URL", name: "url", widget: "string"}
              - label: "圖片 Gallery"
                name: "gallery"
                widget: "list"
                required: false
                fields:
                  - {label: "圖片 Image（新照片只要傳這一個欄位就好）", name: "image", widget: "image", required: false, hint: "只要上傳一張圖，網站會自動當縮圖和放大圖使用，不用另外做縮圖"}
                  - {label: "說明 Caption", name: "caption", widget: "string", required: false}
                  - {label: "R18／血腥等敏感內容（縮圖先模糊遮蔽）", name: "sensitive", widget: "boolean", default: false, required: false}
                  - {label: "縮圖 Thumbnail（舊照片用，新照片不用填）", name: "thumb", widget: "image", required: false}
                  - {label: "原圖 Full Image（舊照片用，新照片不用填）", name: "full", widget: "image", required: false}

