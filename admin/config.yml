backend:
  name: git-gateway
  branch: main
  # 為了省 Netlify 額度（每次正式部署扣 15 點），後台存檔／上傳圖片時，
  # commit 訊息會自動加上 [skip netlify]，Netlify 看到就不會自動部署。
  # 一批內容改完後，到 Netlify →「Deploys」→「Trigger deploy」→「Deploy site」
  # 手動部署一次，網站才會更新。想恢復「存檔就自動上線」，把下面整段刪掉即可。
  commit_messages:
    create: 'Create {{collection}} “{{slug}}” [skip netlify]'
    update: 'Update {{collection}} “{{slug}}” [skip netlify]'
    delete: 'Delete {{collection}} “{{slug}}” [skip netlify]'
    uploadMedia: 'Upload “{{path}}” [skip netlify]'
    deleteMedia: 'Delete “{{path}}” [skip netlify]'

# 圖片上傳後會放在這個資料夾（網站裡的 images/uploads/）
media_folder: "images/uploads"
public_folder: "/images/uploads"

# 存檔後直接寫進 main，不需要額外審核流程（但網站要手動部署才會更新，見上方 commit_messages 說明）
publish_mode: simple

# ------------------------------------------------------------------
# 角色資料拆成 8 個檔案，分屬兩個大分類的資料夾：
#   企劃 Original
#     └─ characters-original.json
#   共構 Collab
#     ├─ MAFIA     → characters-mafia.json
#     ├─ ANCIENT   → characters-ancient.json
#     ├─ HERO      → characters-hero.json
#     ├─ FANTASY   → characters-fantasy.json
#     ├─ FOOTBALL  → characters-football.json
#     ├─ VICTORIAN → characters-victorian.json
#     └─ OTHER     → characters-other.json
#
# 左側選單會先看到「企劃 Original」「共構 Collab」兩個大分類，
# 點開「共構 Collab」才會看到各個世界觀的子項，
# 點進去才是該世界觀底下的角色列表——不會再把 30 幾個角色全部塞在同一頁。
#
# 世界觀（world）跟分類（category）已經不是角色資料裡的欄位了，
# 而是由「這個角色被放進哪一個資料夾」自動決定：
# 把角色移到 MAFIA 資料夾，他就自動變成 MAFIA 世界觀的角色，不需要另外選欄位。
# ------------------------------------------------------------------

collections:
  - name: "worlds"
    label: "世界觀 Worlds"
    files:
      - file: "worlds.json"
        label: "世界觀介紹 World Intros"
        name: "worlds"
        fields:
          - label: "世界觀列表 Worlds"
            name: "worlds"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "代號 Slug（英文小寫，例如 mafia／ancient／hero，新增世界觀時要跟角色檔案的 world 對應，請先跟我確認）", name: "slug", widget: "string"}
              - {label: "名稱 Name（顯示在畫面上，例如 MAFIA）", name: "name", widget: "string"}
              - {label: "編號 Code（例如 W-01）", name: "code", widget: "string", required: false}
              - {label: "簡短說明 Short Desc（顯示在共構世界選單卡片上）", name: "desc", widget: "text", required: false}
              - {label: "介紹全文 Brief（顯示在該世界觀角色列表頁的浮動卡片裡）", name: "brief", widget: "text", required: false}
              - {label: "代表色 Color（共構選單、換頁轉場、該世界觀頁面的強調色；留空就用網站內建的顏色）", name: "color", widget: "color", required: false}
              - label: "時間軸 Timeline"
                name: "timeline"
                widget: "list"
                required: false
                collapsed: true
                label_singular: "事件"
                summary: "{{fields.date}}　{{fields.title}}"
                hint: "有填任何一個事件，該世界觀的角色列表頁就會出現「🕰 時間軸」按鈕。會照這裡的順序由上往下排，可以拖曳調整。"
                fields:
                  - {label: "時間 Date", name: "date", widget: "string", required: false, hint: "隨意寫，例如 1998、1998 春、二十年前、第一章"}
                  - {label: "標題 Title", name: "title", widget: "string"}
                  - {label: "說明 Description", name: "desc", widget: "text", required: false, hint: "選填。換行會照樣顯示"}
                  - label: "相關角色 Characters"
                    name: "characters"
                    widget: "list"
                    required: false
                    collapsed: false
                    hint: "選填。填角色 ID（例如 coop-mafia-02）或角色名字，網站上的角色會顯示頭像、可以點進去；不在網站上的人就只顯示名字"
                    field: {label: "角色", name: "character", widget: "string"}

  - name: "gate"
    label: "首頁 Gate"
    files:
      - file: "gate.json"
        label: "首頁大圖 Showcase"
        name: "gate"
        fields:
          - label: "首頁大圖（往下捲動時一張張淡入的滿版圖片，出現順序每次隨機）"
            name: "slides"
            widget: "list"
            label_singular: "大圖"
            summary: "{{fields.caption}}　{{fields.image}}{{fields.mobileImage | ternary('　＋手機直圖', '')}}"
            fields:
              - {label: "電腦版 Image（橫圖）", name: "image", widget: "image", hint: "直接上傳原圖就好，網站部署時會自動壓縮。"}
              - {label: "手機版 Mobile Image（直圖，選填）", name: "mobileImage", widget: "image", required: false, hint: "手機（直的畫面）會改用這張。建議 9:16 左右的直圖，例如 1080×1920；留空的話手機上會把電腦版的橫圖裁切顯示。"}
              - {label: "說明 Caption（選填）", name: "caption", widget: "string", required: false, hint: "捲到這張圖時左下角會淡入這行小字，例如作品名稱或「拉涅里與克里斯蒂亞諾」。留空就只顯示頁碼"}
              - {label: "連結 Link（選填）", name: "link", widget: "string", required: false, hint: "填角色 ID（例如 coop-mafia-02）或角色名字，說明文字就能點進那個角色頁"}

  - name: "original"
    label: "企劃 Original"
    files:
      - file: "characters-original.json"
        label: "企劃角色 Original Characters"
        name: "original_characters"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: &character_fields
              # ---- 這一段角色欄位只寫一次，8 個角色資料夾都共用（下面其他資料夾寫 fields: *character_fields）。
              # ---- 要新增／修改角色欄位，只要改這裡，所有世界觀會一起套用。
              - label: "ID"
                name: "id"
                widget: "string"
                pattern: ["^[A-Za-z0-9-]+$", "只能用英文、數字和 -（不能有空格或中文）"]
                hint: "例如 coop-mafia-23。同一個資料夾裡不能重複；建立後不要再改，角色的分享網址會用到它。"
              - {label: "代號 Codename", name: "codename", widget: "string", hint: "角色名字，顯示在卡片和角色頁標題"}
              - {label: "身分 Role", name: "role", widget: "string", required: false, default: "—"}
              - {label: "本名 Real Name", name: "realname", widget: "string", required: false, default: "—"}
              - {label: "所屬 Affiliation", name: "affiliation", widget: "string", required: false, default: "—"}
              - {label: "專長 Skill", name: "skill", widget: "string", required: false, default: "—"}
              - {label: "身高 Height", name: "height", widget: "string", required: false}
              - {label: "生日 Birthday", name: "birthday", widget: "string", required: false, hint: "寫成「月.日」，例如 6.6 或 12.25；Index 頁的壽星提醒會讀這個欄位（6/6、6月6日 也可以）"}
              - {label: "年齡 Age", name: "age", widget: "string", required: false}
              - label: "狀態 Status"
                name: "status"
                widget: "select"
                default: "alive"
                options: [{label: "生存 Alive", value: "alive"}, {label: "死亡 Dead", value: "dead"}]
              - {label: "簡介 Bio", name: "bio", widget: "text", required: false, hint: "中間空一行就會自動分段；想加粗可以寫 <b>文字</b>"}
              - {label: "大頭照 Avatar", name: "avatarImg", widget: "image", required: false, hint: "直接上傳原圖就好，網站部署時會自動壓縮成縮圖和大圖，不用自己縮小。"}
              - {label: "全身立繪 Fullbody", name: "fullbodyImg", widget: "image", required: false, hint: "直接上傳原圖就好，網站部署時會自動壓縮成縮圖和大圖，不用自己縮小。"}
              - {label: "CP", name: "cp", widget: "string", required: false, hint: "對方的名字。下面的 CP 介紹／圖片／特質量表有填任何一項，角色頁上的 CP 名字就能點開小卡"}
              - {label: "CP 介紹 CP Intro", name: "cpIntro", widget: "text", required: false, hint: "選填。中間空一行就會自動分段"}
              - {label: "CP 圖片 CP Image", name: "cpImage", widget: "image", required: false, hint: "選填。顯示在 CP 小卡上方。直接上傳原圖就好，網站部署時會自動壓縮成縮圖和大圖，不用自己縮小。"}
              - label: "CP 特質量表：這個角色 → 對方"
                name: "cpTraitsMine"
                widget: "object"
                required: false
                collapsed: true
                hint: "每項 0～5 個點，留空的項目在網站上會顯示「—」"
                fields:
                  - {label: "感情強度", name: "affection", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "忠誠度", name: "loyalty", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "獨佔欲", name: "possessive", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "依存度", name: "dependence", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "性慾強度", name: "desire", widget: "number", value_type: "int", min: 0, max: 5, required: false}
              - label: "CP 特質量表：對方 → 這個角色"
                name: "cpTraitsTheirs"
                widget: "object"
                required: false
                collapsed: true
                hint: "每項 0～5 個點，留空的項目在網站上會顯示「—」"
                fields:
                  - {label: "感情強度", name: "affection", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "忠誠度", name: "loyalty", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "獨佔欲", name: "possessive", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "依存度", name: "dependence", widget: "number", value_type: "int", min: 0, max: 5, required: false}
                  - {label: "性慾強度", name: "desire", widget: "number", value_type: "int", min: 0, max: 5, required: false}
              - label: "圖片 Gallery"
                name: "gallery"
                widget: "list"
                required: false
                collapsed: true
                label_singular: "圖片"
                summary: "{{fields.sensitive | ternary('⚠ 敏感　', '')}}{{fields.caption}}　{{fields.image}}"
                hint: "可以拖曳調整順序；網站上的 Gallery 會照這個順序排列。想一次加很多張，用上方的「＋ 一次上傳多張圖片」按鈕"
                fields:
                  - {label: "圖片 Image", name: "image", widget: "image", hint: "直接上傳原圖就好，網站部署時會自動壓縮成縮圖和大圖，不用自己縮小。"}
                  - {label: "說明 Caption", name: "caption", widget: "string", required: false}
                  - {label: "R18／血腥等敏感內容", name: "sensitive", widget: "boolean", default: false, required: false, hint: "打開的話，網站上的縮圖會先模糊遮住，點一下才顯示"}
              - label: "外連文章 Articles"
                name: "articles"
                widget: "list"
                required: false
                collapsed: true
                label_singular: "文章"
                summary: "{{fields.title}}"
                fields:
                  - {label: "標題 Title", name: "title", widget: "string"}
                  - {label: "連結 URL", name: "url", widget: "string"}
              - label: "關係 Relationships"
                name: "relationships"
                widget: "list"
                required: false
                collapsed: true
                label_singular: "關係"
                summary: "{{fields.label}}：{{fields.target}}"
                hint: "會顯示在角色頁的關係圖上"
                fields:
                  - {label: "對方", name: "target", widget: "string", hint: "對方在這個網站上的話，填對方的角色 ID（例如 coop-mafia-03），頭像會出現而且可以點進去；不在這個網站上的話，直接打名字就好"}
                  - {label: "關係稱呼", name: "label", widget: "string", hint: "例如：戀人、上司、宿敵、青梅竹馬"}

  - name: "coop"
    label: "共構 Collab"
    files:
      - file: "characters-mafia.json"
        label: "MAFIA"
        name: "coop_mafia"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-ancient.json"
        label: "ANCIENT"
        name: "coop_ancient"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-hero.json"
        label: "HERO"
        name: "coop_hero"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-fantasy.json"
        label: "FANTASY"
        name: "coop_fantasy"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-football.json"
        label: "FOOTBALL"
        name: "coop_football"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-victorian.json"
        label: "VICTORIAN"
        name: "coop_victorian"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields

      - file: "characters-other.json"
        label: "OTHER"
        name: "coop_other"
        fields:
          - label: "角色列表 Characters"
            name: "characters"
            widget: "list"
            summary: "{{fields.codename}} — {{fields.role}}"
            fields: *character_fields
